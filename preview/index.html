<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F7">
<title>极氪看板 · 设计预览</title>
<style>
/* ═══════════════════════════════════════════════
   中国传统色设计系统
   色值参考 zhongguose.com（中科院《色谱》1957）
   ═══════════════════════════════════════════════ */
:root {
  --tian-qing:      #2E8BC0;  /* 天青 → 清爽天蓝 · 主色 */
  --tian-qing-deep: #1C6FA8;  /* 天青·深 */
  --zhu-qing:       #16B89A;  /* 竹青 → 青碧同系清绿 · 安全色 */
  --qing-bi:        #16B89A;  /* 青碧 · 安全/正常 */
  --piao-se:        #E8F2FA;  /* 缥色 → 淡天蓝底，不再发绿 */
  --dian-lan:       #3A6EA5;  /* 靛蓝 */
  --dian-qing:      #1E7FC2;  /* 靛青 · 充电/主强调（清爽蓝） */
  --cang-qing:      #2C3E5C;  /* 藏青 */
  --qun-qing:       #4C8DAE;  /* 群青 */
  --zhu-sha:        #E5483B;  /* 朱砂 · 告警（更干净的红） */
  /* 珊瑚 · 「开启中」状态色（车控按钮）。
     与朱砂告警红同属红粉系，刻意用明度拉开差距，避免被读成「异常/失败」：
     浅色模式下加深到 #C9483F（对比度 4.25 才能压住浅玻璃底），
     深色模式下用本源色 #FA9894（对比度 6.68）。
     深色模式的值由本文件末尾的 prefers-color-scheme 块覆盖。 */
  --shan-hu:        #C9483F;
  --yan-zhi:        #C0392B;  /* 胭脂 */
  --teng-huang:     #FFB020;  /* 藤黄 · 强调（明亮琥珀） */
  --xiang-se:       #F4B400;  /* 缃色 */
  --ti-se:          #F2994A;  /* 缇色 */
  --yue-bai:        #F3F5F7;  /* 月白 → 冷调中性白，不再发绿 */
  --xiang-ya-bai:   #FFFFFF;  /* 象牙白 → 纯白卡片，更干净 */
  --gao-se:         #EDF1F4;  /* 缟色 → 冷灰 */
  --mo-se:          #1B1F24;  /* 墨 · 主文字（去掉绿味） */
  --xuan-qing:      #4A4E57;  /* 玄青 · 次文字 */
  --dai-se:         #5B6472;  /* 黛色 */

  --card-radius: 16px;
  --card-padding: 16px;
  --gap: 12px;
  --screen-padding: 16px;

  --bg: var(--yue-bai);
  --surface: var(--xiang-ya-bai);
  --surface-alt: var(--gao-se);
  --text-1: var(--mo-se);
  --text-2: rgba(27, 31, 36, .58);
  --text-3: rgba(91, 100, 114, .42);
  --accent: var(--tian-qing-deep);
  --separator: rgba(27, 31, 36, .07);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171C;
    --surface: #1E2228;
    --surface-alt: #272C33;
    --text-1: #ECEFF3;
    --text-2: #9AA3AE;
    --text-3: #626B76;
    --accent: #4DA3DC;
    --separator: rgba(255, 255, 255, .08);
    /* 深色模式用珊瑚粉本源色（浅色模式为加深版 #C9483F） */
    --shan-hu: #FA9894;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

/* ═══════════════════════════════════════════════
   iOS 26 Liquid Glass · 液态玻璃设计系统
   ───────────────────────────────────────────────
   还原四个核心特征：
   ① 背景折射     backdrop-filter blur + saturate
   ② 高光边线     内描边 + inset 高光，模拟玻璃棱边
   ③ 厚度折射     多层 box-shadow，不是一层薄片
   ④ 动态响应     滚动/按压时改变透明度与高光位置
   ═══════════════════════════════════════════════ */

/* ── 玻璃基色：受光面 / 背光面 ── */
.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  /* 厚度：外阴影撑起层次，内描边勾勒棱边 */
  box-shadow:
    0 1px 0 0 var(--glass-edge),                    /* 顶部受光亮线 */
    0 -1px 0 0 var(--glass-edge-dim) inset,         /* 底部背光暗线 */
    0 8px 32px -8px var(--glass-shadow),            /* 投影厚度 */
    inset 0 1px 0 0 var(--glass-highlight);         /* 内侧高光 */
}

/* 高光斜扫：玻璃表面那道流动的反光 */
.glass::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1px;                                   /* 用 padding 做 1px 描边 */
  background: linear-gradient(
    145deg,
    var(--glass-stroke-strong) 0%,
    var(--glass-stroke-weak) 38%,
    transparent 62%,
    var(--glass-stroke-weak) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
}

/* 内层漫射光：让玻璃有"体积"而不是一张贴纸 */
.glass::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    120% 80% at 50% -20%,
    var(--glass-glow) 0%,
    transparent 60%
  );
  pointer-events: none;
}

/* ── 玻璃在浅色 / 深色下的参数 ── */
:root {
  --glass-blur: 24px;
  --glass-saturate: 190%;
  --glass-bg: rgba(255, 255, 255, .62);
  --glass-edge: rgba(255, 255, 255, .85);
  --glass-edge-dim: rgba(0, 0, 0, .045);
  --glass-highlight: rgba(255, 255, 255, .70);
  --glass-shadow: rgba(20, 30, 45, .16);
  --glass-stroke-strong: rgba(255, 255, 255, .95);
  --glass-stroke-weak: rgba(255, 255, 255, .30);
  --glass-glow: rgba(255, 255, 255, .55);
  /* 卡片内部小件：半透明亚光，避免玻璃叠玻璃导致层级混乱 */
  --glass-inner: rgba(255, 255, 255, .52);
  --glass-inner-2: rgba(255, 255, 255, .34);
}
@media (prefers-color-scheme: dark) {
  :root {
    --glass-bg: rgba(38, 43, 51, .58);
    --glass-edge: rgba(255, 255, 255, .16);
    --glass-edge-dim: rgba(255, 255, 255, .05);
    --glass-highlight: rgba(255, 255, 255, .12);
    --glass-shadow: rgba(0, 0, 0, .50);
    --glass-stroke-strong: rgba(255, 255, 255, .34);
    --glass-stroke-weak: rgba(255, 255, 255, .10);
    --glass-glow: rgba(255, 255, 255, .16);
    --glass-inner: rgba(255, 255, 255, .09);
    --glass-inner-2: rgba(255, 255, 255, .055);
  }
}

/* ── 玻璃强度分级（模拟 iOS 的 regular / clear 两档）── */
.glass--thick { --glass-bg: rgba(255, 255, 255, .78); --glass-blur: 30px; }
.glass--thin  { --glass-bg: rgba(255, 255, 255, .42); --glass-blur: 16px; }
@media (prefers-color-scheme: dark) {
  .glass--thick { --glass-bg: rgba(38, 43, 51, .74); --glass-blur: 30px; }
  .glass--thin  { --glass-bg: rgba(38, 43, 51, .38); --glass-blur: 16px; }
}

/* ── 滚动响应：下滑时玻璃变实，回顶时变透（iOS 26 行为）── */
body.is-scrolled .glass--adaptive {
  --glass-bg: rgba(255, 255, 255, .80);
  --glass-blur: 30px;
}
@media (prefers-color-scheme: dark) {
  body.is-scrolled .glass--adaptive { --glass-bg: rgba(38, 43, 51, .78); }
}

/* ── 不支持 backdrop-filter 时降级为不透明底，保证可读性 ── */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .glass--thin { background: var(--surface-alt); }
}

/* ── 玻璃按钮：点击时玻璃"压下去"，高光偏移 ── */
.glass-btn {
  position: relative; overflow: hidden;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-edge);
  box-shadow: 0 4px 16px -6px var(--glass-shadow), inset 0 1px 0 0 var(--glass-highlight);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1),
              box-shadow .2s ease, background .2s ease;
}
.glass-btn:active {
  transform: scale(.94);
  box-shadow: 0 2px 8px -4px var(--glass-shadow), inset 0 2px 6px 0 var(--glass-edge-dim);
}

/* ── 减少动态效果 ── */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text-1);
  /* 底部内容预留：内容下边缘锚定在距屏幕底 105px。
     自屏幕底往上：下留白 14 → 胶囊 59 → 胶囊上沿 73 → 与内容间隙 32 → 105。
     iOS 侧用同一组数字（胶囊 64pt）：14 + 64 = 78，间隙 27，同样落在 105。
     即 105 是两端共同的锚点，胶囊高度差 5px 由间隙吸收。
     105 − 系统安全区 34 = 71。 */
  padding-bottom: calc(71px + env(safe-area-inset-bottom));
  transition: background .2s;
  position: relative;
  overflow-x: hidden;
}

/* 氛围光斑层 —— 玻璃的折射感来自背景有东西可折射。
   固定在底层，随页面滚动保持不动，模拟 iOS 壁纸透过玻璃的效果。 */
body::before {
  content: '';
  position: fixed; inset: -10%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(38% 26% at 18% 12%, var(--aura-1) 0%, transparent 68%),
    radial-gradient(34% 24% at 84% 22%, var(--aura-2) 0%, transparent 66%),
    radial-gradient(44% 30% at 62% 88%, var(--aura-3) 0%, transparent 70%),
    radial-gradient(30% 22% at 8% 76%, var(--aura-4) 0%, transparent 68%);
  filter: blur(6px);
}
:root {
  --aura-1: rgba(46, 139, 192, .16);
  --aura-2: rgba(22, 184, 154, .13);
  --aura-3: rgba(77, 163, 220, .14);
  --aura-4: rgba(242, 153, 74, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --aura-1: rgba(46, 139, 192, .22);
    --aura-2: rgba(22, 184, 154, .16);
    --aura-3: rgba(30, 127, 194, .20);
    --aura-4: rgba(242, 153, 74, .12);
  }
}

/* ─────────── 顶部悬浮徽标（Liquid Glass 胶囊）───────────
   页面大标题已与底部导航重复，故移除 —— 此处只保留数据来源徽标，
   做成悬浮玻璃胶囊，不再占据整条吸顶栏。 */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; justify-content: flex-end;
  background: transparent;
  border: none; box-shadow: none;
  padding: calc(env(safe-area-inset-top) + 8px) var(--screen-padding) 8px;
  /* 胶囊上方的渐变遮罩，滚动时内容不会从徽标旁边"硬切"出来 */
  pointer-events: none;
}
.topbar::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 0;
  height: 100%;
  background: linear-gradient(
    to bottom,
    color-mix(in srgb, var(--bg) 92%, transparent) 0%,
    color-mix(in srgb, var(--bg) 72%, transparent) 62%,
    transparent 100%
  );
  -webkit-mask: none;
  backdrop-filter: blur(10px) saturate(160%);
  -webkit-backdrop-filter: blur(10px) saturate(160%);
  z-index: -1;
  pointer-events: none;
}
/* 移除旧的高光扫线与标题样式 */
.topbar::after { display: none; }
body.is-scrolled .topbar::before {
  background: linear-gradient(
    to bottom,
    color-mix(in srgb, var(--bg) 96%, transparent) 0%,
    color-mix(in srgb, var(--bg) 84%, transparent) 60%,
    transparent 100%
  );
}
/* 模式徽标：悬浮玻璃胶囊 */
.badge-mode {
  position: relative; pointer-events: auto;
  font-size: 11px; padding: 5px 12px; border-radius: 20px;
  background: var(--glass-bg); color: var(--tian-qing-deep); font-weight: 600;
  border: 1px solid var(--glass-stroke-weak);
  backdrop-filter: blur(18px) saturate(190%);
  -webkit-backdrop-filter: blur(18px) saturate(190%);
  box-shadow:
    inset 0 1px 0 0 var(--glass-highlight),
    0 4px 16px -8px var(--glass-shadow);
  display: inline-flex; align-items: center; gap: 5px;
}
/* 状态圆点：模拟数据为琥珀色、真实数据为青碧、未连接为灰 */
.badge-mode::before {
  content: '';
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--teng-huang);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--teng-huang) 22%, transparent);
}
.badge-mode[data-mode="live"]::before {
  background: var(--qing-bi);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--qing-bi) 22%, transparent);
}
.badge-mode[data-mode="offline"]::before {
  background: var(--text-3);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--text-3) 18%, transparent);
}
@media (prefers-color-scheme: dark) {
  .badge-mode { color: var(--tian-qing); }
}

/* ─────────── 容器 ─────────── */
.wrap { padding: var(--screen-padding); display: flex; flex-direction: column; gap: var(--gap); }

/* ─────────── 卡片（Liquid Glass 卡片层）─────────── */
.card {
  position: relative;
  /* 卡片玻璃比导航层更实（内容可读性优先），近似 iOS 的 regular 材质 */
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  border: 1px solid var(--glass-stroke-weak);
  box-shadow:
    inset 0 1px 0 0 var(--glass-highlight),
    0 6px 24px -12px var(--glass-shadow);
  transition: box-shadow .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
}
/* 卡片顶部高光扫线，呼应玻璃受光面 */
.card::before {
  content: '';
  position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
  border-radius: 1px;
  background: linear-gradient(
    90deg, transparent, var(--glass-stroke-strong) 50%, transparent
  );
  opacity: .8; pointer-events: none;
}
.card-title {
  font-size: 15px; font-weight: 600; margin: 0 0 12px;
  display: flex; align-items: center; justify-content: space-between;
}

/* ─────────── 主卡：电量环形 ─────────── */
.hero { display: flex; gap: 20px; align-items: center; }
.ring-wrap { position: relative; flex-shrink: 0; }
.ring-wrap svg { display: block; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-alt); }
.ring-fg {
  fill: none; stroke-linecap: round;
  transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1), stroke .3s;
}
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-num {
  font-size: 32px; font-weight: 600; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -1px;
}
.ring-num .pct { font-size: 16px; font-weight: 500; opacity: .5; margin-left: 1px; }
.ring-label { font-size: 10px; color: var(--text-3); margin-top: 5px; }
.ring-bolt {
  position: absolute; top: 12px; right: 12px;
  color: var(--dian-qing); font-size: 15px;
}

/* ── 低电量警示效果 ────────────────────────────
   中档（30~50%）藤黄：仅换色 + 轻微光晕，提示但不打扰
   低档（<30%）朱砂：环体呼吸脉冲 + 外发光 + 「电量偏低」标签 */
.ring-wrap--mid .ring-fg {
  filter: drop-shadow(0 0 5px color-mix(in srgb, var(--teng-huang) 42%, transparent));
}
.ring-wrap--low .ring-fg {
  filter: drop-shadow(0 0 7px color-mix(in srgb, var(--zhu-sha) 55%, transparent));
}
/* 呼吸脉冲：环体明暗与半径交替，模拟"心跳"警示 */
.ring-pulse {
  transform-origin: 50% 50%;
  animation: ringPulse 1.6s ease-in-out infinite;
}
@keyframes ringPulse {
  0%, 100% { opacity: 1;    transform: scale(1); }
  50%      { opacity: .55;  transform: scale(1.035); }
}
/* 环内数字同步脉冲，强化注意力 */
.ring-wrap--low .ring-num { animation: ringNumPulse 1.6s ease-in-out infinite; }
@keyframes ringNumPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .68; }
}
/* 「电量偏低」胶囊标签，贴在环下方 */
.ring-alert {
  position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
  font-size: 10px; font-weight: 600; white-space: nowrap;
  padding: 2px 9px; border-radius: 10px;
  color: #fff;
  background: var(--zhu-sha);
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--zhu-sha) 60%, transparent);
  animation: alertIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes alertIn { from { opacity: 0; transform: translateX(-50%) scale(.8); } }

@media (prefers-reduced-motion: reduce) {
  .ring-pulse, .ring-wrap--low .ring-num, .ring-alert { animation: none !important; }
}

.hero-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.hero-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
.hero-plate { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.hr { height: 1px; background: var(--separator); }
.mini-row { display: flex; justify-content: space-between; align-items: baseline; }
.mini-label { font-size: 12px; color: var(--text-3); }
.mini-val {
  font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
}

/* ─────────── 充电卡 ─────────── */
.card-charging {
  background: color-mix(in srgb, var(--piao-se) 55%, var(--surface));
}
@media (prefers-color-scheme: dark) {
  .card-charging { background: rgba(77,163,220,.10); }
}
.charge-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--dian-qing);
}
.charge-grid { display: flex; margin-top: 12px; }
.charge-item { flex: 1; text-align: center; }
.charge-item .v {
  font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.charge-item .k { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.charge-eta {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-2); margin-top: 11px;
}

/* ─────────── 图标（内联 SVG，避免 emoji 渲染差异）─────────── */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex-shrink: 0; }
.ic-sm { width: 14px; height: 14px; display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

/* ─────────── 统计卡头部 ─────────── */
.stat .head .ic-sm { opacity: .75; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.stat { background: var(--glass-inner); border-radius: var(--card-radius); padding: 13px 14px;
  box-shadow: inset 0 1px 0 0 var(--glass-highlight); }
.stat .head {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-3); margin-bottom: 7px;
}
.stat .val {
  font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums;
  letter-spacing: -.4px;
}
.stat .val .u { font-size: 11px; font-weight: 400; color: var(--text-3); margin-left: 3px; }

/* ─────────── 胎压 ─────────── */
/* ─────────── 胎压（紧凑横排，一行四列）─────────── */
.tyre-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.tyre {
  background: var(--glass-inner-2); border-radius: 10px;
  padding: 9px 3px; text-align: center;
  box-shadow: inset 0 1px 0 0 var(--glass-highlight);
}
.tyre .v {
  font-size: 16px; font-weight: 600; line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.tyre .k { font-size: 10px; color: var(--text-3); margin-bottom: 3px; }
.tyre.warn .v { color: var(--zhu-sha); }

/* ─────────── 车身状态 chip ─────────── */
.chip {
  display: flex; align-items: center; gap: 9px;
  background: var(--glass-inner-2); border-radius: 11px; padding: 11px 12px;
}
  /* 车身状态 chip —— 每种状态给独立语义色，不滥用告警色 */
  .chip .ico {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600;
  }
  .chip .txt { min-width: 0; }
  .chip .t { font-size: 11px; color: var(--text-3); }
  .chip .s { font-size: 13px; font-weight: 500; margin-top: 1px; }

  /* 正常/安全 —— 青碧 */
  .chip.good .ico { background: rgba(22,184,154,.14); color: var(--qing-bi); }
  .chip.good .s { color: var(--qing-bi); }

  /* 需要注意 —— 朱砂（仅用于真正的异常） */
  .chip.bad .ico { background: rgba(229,72,59,.13); color: var(--zhu-sha); }
  .chip.bad .s { color: var(--zhu-sha); }

  /* 中性状态 —— 天青（空调开关等非异常状态） */
  .chip.mid .ico { background: rgba(28,111,168,.14); color: var(--tian-qing-deep); }
  .chip.mid .s { color: var(--tian-qing-deep); }

  /* 关闭态 —— 灰调，明确表示「非异常但未启用」 */
  .chip.off .ico { background: rgba(91,100,114,.10); color: var(--text-3); }
  .chip.off .s { color: var(--text-2); }
  /* 关闭态的 chip 本体压暗一档，避免与卡片底色糊在一起 */
  .chip.off { background: rgba(91,100,114,.05); }

  /* 未知态 —— 网关没给这个字段。
     与 off（确认关闭）严格区分：off 是"读了，是关的"，
     unknown 是"没读到"。把两者混同会让用户在没有数据时看到
     「已关」这种假结论（车窗尤其危险 —— 以为关了其实没关）。 */
  .chip.unknown .ico { background: rgba(91,100,114,.08); color: var(--text-3); opacity: .75; }
  .chip.unknown .s { color: var(--text-3); font-weight: 400; }
  .chip.unknown { background: rgba(91,100,114,.03); }
  .chip.unknown .s::after { content: ''; }

/* ─────────── 轨迹缩略图（行程回放）─────────── */
.track {
  margin-top: 8px; border-radius: 10px; overflow: hidden;
  background: var(--glass-inner-2); padding: 8px 10px;
}
  .track svg { display: block; width: 100%; height: 52px; }
  .track .tk-legend {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--text-3); margin-top: 2px;
  }

/* ─────────── 预约充电卡 ─────────── */
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.plan-item {
  background: var(--glass-inner-2); border-radius: 11px; padding: 10px 12px;
}
  .plan-item .k { font-size: 11px; color: var(--text-3); }
  .plan-item .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .plan-item .v small { font-size: 11px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
  .plan-item.off .v { color: var(--text-3); font-weight: 400; }

/* ─────────── 附近充电站 ───────────
   一行一站：左侧站名 + 元信息，右侧当前电价。
   价格刻意用靛青（--dian-qing，本项目"电"的语义色），与消费卡的
   青碧/朱砂互不干扰。点击一行展开分时电价表。 */
.st-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-top: 10px;
}
.st-list { display: flex; flex-direction: column; gap: 8px; margin-top: 9px; }
.st {
  background: var(--glass-inner-2); border-radius: 11px;
  padding: 11px 12px; cursor: pointer;
  transition: background .15s;
}
.st:active { background: var(--glass-inner); }
.st-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.st-name {
  font-size: 13.5px; font-weight: 500; color: var(--text-1); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.st-price {
  flex: none; font-size: 16px; font-weight: 600; color: var(--dian-qing);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.st-price .u { font-size: 10.5px; font-weight: 400; color: var(--text-3); margin-left: 1px; }
/* 价格缺失 ≠ 免费 —— 用弱化灰而非 0，避免被读成"这个站不要钱" */
.st-price.na { color: var(--text-3); font-size: 13px; font-weight: 400; }
.st-meta {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-3); margin-top: 5px;
}
.st-meta .ok { color: var(--qing-bi); }
.st-meta .gone { color: var(--zhu-sha); }
.st-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 5px;
  background: rgba(30,127,194,.12); color: var(--dian-qing);
}
.st-periods {
  margin-top: 9px; padding-top: 8px;
  border-top: 1px solid var(--glass-inner-2);
  display: flex; flex-direction: column; gap: 5px;
}
.st-period {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 11.5px; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
/* 当前时段高亮 —— 这张卡最该被一眼看到的信息 */
.st-period.now { color: var(--dian-qing); font-weight: 600; }
.st-note { font-size: 10.5px; color: var(--text-3); margin-top: 7px; line-height: 1.6; }
.st-actions { display: flex; gap: 8px; margin-top: 9px; }
.st-btn {
  flex: 1; border: none; font: inherit; font-size: 12px; cursor: pointer;
  padding: 8px 0; border-radius: 9px;
  background: rgba(30,127,194,.12); color: var(--dian-qing);
}
.st-btn.ghost { background: var(--glass-inner-2); color: var(--text-2); }
.st-btn:active { opacity: .72; }
.st-input {
  flex: 1; min-width: 0; font: inherit; font-size: 12px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--separator);
  background: var(--surface-alt); color: var(--text-1);
}
@media (prefers-color-scheme: dark) {
  .st-price, .st-period.now { color: var(--accent); }
  .st-tag { background: rgba(77,163,220,.16); color: var(--accent); }
  .st-btn { background: rgba(77,163,220,.16); color: var(--accent); }
}

/* ─────────── 车辆能力集 ─────────── */
.cap-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap {
    font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
    background: rgba(22,184,154,.10); color: var(--qing-bi);
  }
  .cap.no { background: rgba(91,100,114,.08); color: var(--text-3); text-decoration: line-through; }
  .cap-badge { font-size: 10.5px; font-weight: 400; color: var(--text-3); }
  .cap-hint {
    margin-top: 10px; font-size: 11px; color: var(--text-3);
    padding: 7px 10px; border-radius: 9px; background: rgba(91,100,114,.05);
  }

/* ─────────── 开关（车控总开关）。
   只是包一层 label，视觉上仍是 iOS 那种系统开关：
   轨道灰 → 开启时染主色，圆点带轻微投影。 */
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.sw-txt { min-width: 0; }
.sw-txt .t { display: block; font-size: 14px; color: var(--text-1); }
.sw-txt .d { display: block; font-size: 11px; color: var(--text-3); margin-top: 3px; }
.sw {
  flex: none; position: relative; margin: 0;
  width: 46px; height: 28px; border-radius: 999px;
  -webkit-appearance: none; appearance: none;
  background: rgba(91, 100, 114, .22);
  transition: background .22s ease; cursor: pointer;
}
.sw::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(20, 30, 45, .30);
  transition: transform .22s cubic-bezier(.22, .61, .36, 1);
}
.sw:checked { background: var(--tian-qing); }
.sw:checked::after { transform: translateX(18px); }
/* 开启后的风险提示：用缇色（非告警朱砂）—— 是提醒，不是错误 */
.sw-warn {
  margin-top: 10px; font-size: 11px; line-height: 1.6;
  color: var(--ti-se);
}
  /* 胎温（与胎压同格显示，小字附在主值下方） */
  .tyre .t { font-size: 10px; color: var(--text-3); margin-top: 1px; }

/* ─────────── 车控按钮（含完整按压 / 下发 / 成功动效）─────────── */
.ctrl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.ctrl-grid + .ctrl-grid { margin-top: var(--gap); }

.ctrl {
  position: relative; overflow: hidden;
  /* 车控按钮走玻璃质感，与卡片同层 */
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid var(--glass-stroke-weak); border-radius: 13px;
  padding: 14px 6px; min-height: 82px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  font-family: inherit; font-size: 12px; color: var(--text-1);
  cursor: pointer; -webkit-user-select: none; user-select: none;
  box-shadow: inset 0 1px 0 0 var(--glass-highlight);
  transition: transform .16s cubic-bezier(.34,1.56,.64,1),
              background .18s ease, color .18s ease, box-shadow .18s ease;
}

/* 图标：按压时轻微下沉 + 回弹 */
.ctrl .ico {
  position: relative;             /* 供成功态的脉冲圈定位 */
  display: flex; align-items: center; justify-content: center;
  transition: transform .28s cubic-bezier(.34,1.56,.64,1);
}
.ctrl svg { width: 22px; height: 22px; display: block; }
.ctrl-txt { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
.ctrl-sub { font-size: 9.5px; color: var(--text-3); transition: color .18s ease; }

/* ① 按压反馈：下沉 + 微缩 + 玻璃内凹 */
.ctrl:active {
  transform: scale(.93);
  background: color-mix(in srgb, var(--tian-qing) 14%, var(--glass-bg));
  color: var(--tian-qing-deep);
  box-shadow: inset 0 2px 8px var(--glass-edge-dim);
}
.ctrl:active .ico { transform: scale(.86) translateY(1px); }
.ctrl:active .ctrl-sub { color: color-mix(in srgb, var(--tian-qing-deep) 70%, transparent); }

/* ② 涟漪：点击处扩散，纯 CSS 变量驱动 */
.ctrl .ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: currentColor; opacity: .22;
  transform: translate(-50%, -50%) scale(0);
  animation: ctrlRipple .55s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes ctrlRipple {
  to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* ③ 开关型：开启态只染图标 + 文字加粗。
   不再整块铺主色 —— 整块变色在密集网格里过重，且盖掉了玻璃质感。
   现在按钮底保持与未开启时一致，仅靠「图标着色」传达状态，
   一眼能扫出哪些是开着的，又不破坏网格的整齐。 */
.ctrl--toggle.on {
  color: var(--text-1);
}
.ctrl--toggle.on .ico {
  color: var(--shan-hu);
  /* 轻微辉光：让着色图标从玻璃底上「浮」起来，弥补线条显色面积小 */
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--shan-hu) 45%, transparent));
}
.ctrl--toggle.on .ico svg { stroke-width: 2; }
/* 开启态文字加粗，与图标的重量感对齐 */
.ctrl--toggle.on .ctrl-txt { font-weight: 600; }
.ctrl--toggle.on .ctrl-sub { color: var(--text-2); }
.ctrl--toggle.on:active {
  background: color-mix(in srgb, var(--shan-hu) 12%, var(--glass-bg));
}

/* ④ 瞬时动作用菱形角标，和开关型区分开 */
.ctrl--action::after {
  content: ''; position: absolute; top: 7px; right: 7px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--text-3); opacity: .45;
}
.ctrl--action:active::after { opacity: 0; }

/* ⑤ 场景型：横向铺开、带副标题 */
.ctrl--scene { min-height: 74px; }
.ctrl--scene .ico svg { width: 20px; height: 20px; }

/* ⑥ 禁用态（如未插枪时不能开充） */
.ctrl[disabled] { opacity: .38; pointer-events: none; }

/* ⑦ 下发中：转圈遮罩，锁定重复点击 */
.ctrl-spin {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--surface-alt) 78%, transparent);
  backdrop-filter: blur(1px);
}
/* 开启态按钮底已是普通玻璃，转圈遮罩无需再为主色块特调 */
.ctrl-spin::after {
  content: ''; width: 17px; height: 17px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--text-3) 35%, transparent);
  border-top-color: var(--accent);
  animation: ctrlSpin .7s linear infinite;
}
@keyframes ctrlSpin { to { transform: rotate(360deg); } }

.ctrl.busy { pointer-events: none; }
.ctrl.busy .ctrl-spin { display: flex; }

/* ⑧ 第二段：等待车端执行确认（queryProcessResult）
   与 busy（HTTP 请求中）在语义上必须分开 ——
   网关收下令只是"已受理"，车不一定动了。用琥珀色转圈区分两个阶段，
   避免出现"以为锁了车其实没锁"的假成功。 */
.ctrl.pending { pointer-events: none; }
.ctrl.pending .ctrl-spin { display: flex; }
.ctrl.pending .ctrl-spin::after { border-top-color: var(--teng-huang); }
.ctrl.pending .ctrl-sub { color: var(--teng-huang); }

/* ⑨ 超时未确认：琥珀告警，不当作成功也不当作失败 */
.ctrl.unconfirmed .ico { color: var(--teng-huang); }
.ctrl.unconfirmed .ctrl-sub { color: var(--teng-huang); }

/* ⑧ 成功反馈：图标弹跳 + 着色 + 外圈脉冲，1 秒后自动复位。

   原先用 .ctrl-ok 整块铺满按钮（青碧底 + 白勾），是满屏大色块，
   与开启态整块变色是同一个毛病。现改为「图标自己动」：
   颜色只落在 22px 的图标上，遮罩整块铺色彻底去掉。
   状态靠颜色 + 形状双重传达，不依赖大面积底色。 */
.ctrl.done { animation: ctrlBounce .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes ctrlBounce {
  0% { transform: scale(.93); }
  55% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* 成功：图标变青碧 + 弹一下 */
.ctrl.done .ico {
  animation: ctrlIcoPop .5s cubic-bezier(.34,1.56,.64,1);
}
.ctrl.done:not(.fail) .ico { color: var(--qing-bi); }
@keyframes ctrlIcoPop {
  0%   { transform: scale(.72); }
  55%  { transform: scale(1.16); }
  100% { transform: scale(1); }
}

/* 成功后图标外圈扩散一圈青碧脉冲（只用描边，不铺底） */
.ctrl.done:not(.fail) .ico::after {
  content: ''; position: absolute;
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--qing-bi);
  animation: ctrlPulse .62s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes ctrlPulse {
  from { opacity: .7; transform: scale(.55); }
  to   { opacity: 0;  transform: scale(1.05); }
}

/* ⑨ 失败反馈：图标变朱砂红 + 左右抖动（按钮整体抖，不改底色） */
.ctrl.fail .ico { color: var(--zhu-sha); }
.ctrl.fail { animation: ctrlShake .4s; }
@keyframes ctrlShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

/* 分组小标题 + 右上角状态提示 */
.ctrl-sep {
  display: flex; align-items: center; gap: 9px;
  font-size: 11px; color: var(--text-3); font-weight: 500;
  margin: 16px 0 10px;
}
.ctrl-sep::after { content: ''; flex: 1; height: 1px; background: var(--separator); }
.ctrl-hint { font-size: 11px; color: var(--text-3); font-weight: 400; }

/* 尊重系统「减弱动态效果」 */
@media (prefers-reduced-motion: reduce) {
  .ctrl, .ctrl .ico, .ctrl .ico::after { animation: none !important; transition-duration: .01ms !important; }
  .ctrl .ripple { display: none; }
}

/* ─────────── 底部 Tab（Liquid Glass 悬浮胶囊）───────────
   iOS 26 的 tab bar 不再是通栏，而是悬浮的玻璃胶囊，
   两侧留出间隙，能透出下方滚动内容。 */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex;
  /* 外层留白，让胶囊浮起来。下留白 14px 与 iOS 侧 RootView.tabBarBottomGap 一致，
     胶囊贴住屏幕底边（不再是早先的 10px）。 */
  padding: 0 14px calc(env(safe-area-inset-bottom) + 14px);
  background: transparent;
  pointer-events: none;                    /* 空白区不挡内容 */
}
/* 真正的玻璃胶囊 */
.tabbar-inner {
  flex: 1; display: flex; pointer-events: auto;
  border-radius: 26px;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-edge);
  box-shadow:
    0 1px 0 0 var(--glass-edge) inset,
    inset 0 1px 0 0 var(--glass-highlight),
    0 8px 28px -10px var(--glass-shadow);
  overflow: hidden;
}
.tab {
  flex: 1; position: relative; border: none; background: none; font-family: inherit;
  padding: 9px 2px 8px; min-height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 10px; color: var(--text-3); cursor: pointer;
  transition: color .18s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
}
.tab svg { width: 22px; height: 22px; display: block; transition: transform .24s cubic-bezier(.34,1.56,.64,1); }
.tab:active svg { transform: scale(.86); }
.tab.on { color: var(--accent); font-weight: 600; }
.tab.on svg { transform: scale(1.06); }
/* 选中态：玻璃上的高光药丸背景 */
.tab.on::before {
  content: '';
  position: absolute; inset: 5px 8px;
  border-radius: 18px;
  background: var(--glass-highlight);
  box-shadow: inset 0 0 0 1px var(--glass-stroke-weak);
  z-index: -1;
  animation: tabPill .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes tabPill { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .tab.on::before { animation: none; }
}

/* ─────────── 图表 ─────────── */
.chart-box { background: var(--glass-bg); border-radius: var(--card-radius); padding: var(--card-padding); }
.seg {
  display: inline-flex; background: var(--glass-inner-2);
  border-radius: 9px; padding: 2px; gap: 2px;
}
.seg button {
  border: none; background: none; font-family: inherit;
  font-size: 12px; color: var(--text-2);
  padding: 5px 13px; border-radius: 7px; cursor: pointer;
  transition: background .15s, color .15s;
}
.seg button.on { background: var(--glass-inner); color: var(--text-1); font-weight: 600; }
canvas { display: block; width: 100%; }

/* ─────────── 行程 / 消费列表 ─────────── */
.list { display: flex; flex-direction: column; gap: var(--gap); }
.item {
  background: var(--glass-bg); border-radius: var(--card-radius);
  padding: 13px 14px;
}
.item-top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.item-time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.item-amt {
  font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.item-main { font-size: 14px; font-weight: 500; margin-top: 6px; }

/* ─────────── 提示条 ───────────
   毛玻璃半透明胶囊 + 深色文字，与 .glass / tabbar 同一套材质语言。
   位置紧贴底部导航胶囊上方：车控面板是车况页最后一张卡片，
   若提示条浮在屏幕中部偏下，滚到底部时会与之重叠而被挡住。 */
.toast {
  position: fixed; left: 50%;
  /* tabbar 上沿 = safe-area + padding 14px + 胶囊 59px = safe-area + 73px，
     此处再留 8px 间隙 = safe-area + 81px。
     取 52 与 iOS 侧的 toastBottomInset 语义对齐 —— iOS 的 52 是相对安全区上沿计的，
     换算到屏幕底即 52 + 34 = 86 ≈ 81（差额来自两边胶囊高度 64pt / 59px）。 */
  bottom: calc(env(safe-area-inset-bottom) + 52px);
  transform: translateX(-50%) translateY(12px);
  background: var(--glass-bg);
  /* 与 tabbar / 卡片共用同一档模糊，同屏并置时质感才一致 */
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-stroke-weak);
  color: var(--text-1); font-size: 12.5px;
  padding: 10px 18px; border-radius: 22px; z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
  max-width: 82vw; text-align: center;
  box-shadow: 0 8px 28px -10px var(--glass-shadow), inset 0 1px 0 0 var(--glass-highlight);
}
/* 底色本身已半透明，不再叠加 opacity —— 再叠一层会让模糊打折、文字发灰 */
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 不支持 backdrop-filter 时降级为不透明底，保证可读性 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .toast { background: var(--surface); }
}

.hidden { display: none !important; }
</style>
</head>

<script>
'use strict';

/* ═══════════════════════════════════════════════
   配置
   ═══════════════════════════════════════════════ */

/* 服务端地址来源：
   ① URL 上显式指定 ?api=xxx 时优先使用（方便在不改代码的情况下切换后端）
   ② 页面由自有服务端托管（非 5500 预览端口）时用同源地址
   ③ 其余情况（本地 5500 预览、file:// 打开）回退到 localhost —— 即模拟数据 */
const QUERY_API = new URLSearchParams(location.search).get('api');
/* 服务端设了 API_TOKEN 时，用 ?token=xxx 打开本页即可免改代码带令牌。
   服务端同时接受 Authorization 头与 ?token= 查询参数（见 main.py 中间件）。 */
const QUERY_TOKEN = new URLSearchParams(location.search).get('token') || '';
const API_SOURCE = QUERY_API
  ? QUERY_API.trim()
  : ((location.origin.startsWith('http') && location.port !== '5500')
      ? location.origin
      : 'http://localhost:8765');

/* 判定地址形态 —— 必须与 iOS 端 EndpointResolver 给出完全一致的结论：
   地址为空或指向本机回环地址 → 使用内置模拟数据，不请求后端；
   配置了真实地址 → 先请求后端，失败才回落模拟数据并弹框提示。

   两处容易与 Swift 走岔的边界，这里显式对齐（均为实测结论）：
   · `http://[::1]:8080` —— Swift 的 URLComponents.host 会**保留**方括号
     （返回 "[::1]"），Node 的 URL.hostname 同样保留，故回环名单里
     两种写法都收，避免任何一侧漏判。
   · `//localhost:8765` —— 没有 `scheme://` 前缀，Swift 的 hasScheme 判为
     false，补成 `http:////localhost:8765` 后 host 为空（→ unset）；
     这里同样把 `//` 开头的输入直接判为 unset，保证两边结论一致。 */
function hasScheme(value) {
  return /^[A-Za-z][A-Za-z0-9+.-]*:\/\//.test(value);
}

function resolveEndpointMode(raw) {
  const value = String(raw ?? '').trim();
  if (!value) return 'unset';                 // 未配置

  // 以 `//` 开头的协议相对地址：Swift 侧 hasScheme 为 false，补成
  // `http:////host` 后解析不出 host（→ unset）。这里显式对齐同一结论。
  if (value.startsWith('//')) return 'unset';

  const candidate = hasScheme(value) ? value : 'http://' + value;
  let host = '';
  try {
    host = new URL(candidate).hostname;
  } catch {
    return 'unset';                            // 无法解析，按未配置处理
  }
  if (!host) return 'unset';

  // 与 Swift 的回环名单保持一致（含带方括号的 IPv6 写法）
  const loopback = ['localhost', '127.0.0.1', '0.0.0.0', '::1', '[::1]'];
  return loopback.includes(host.toLowerCase()) ? 'loopback' : 'remote';
}

const ENDPOINT_MODE = resolveEndpointMode(API_SOURCE);
/* 根本不需要联网：未配置或指向本机时，直接用内置模拟数据 */
const PREFERS_MOCK = (ENDPOINT_MODE === 'unset' || ENDPOINT_MODE === 'loopback');

/* 演示模式：车控指令不发真实请求，本地模拟下发，保证动效链路可视 */
const DEMO = true;

/* 车控总开关的持久化。localStorage 在隐私模式 / 沙箱下可能直接抛异常，
   失败时静默回落为「关」—— 这是安全方向上的默认值。 */
function readAllowCommands() {
  try { return localStorage.getItem('zk.allowCommands') === '1'; } catch { return false; }
}
function writeAllowCommands(on) {
  try { localStorage.setItem('zk.allowCommands', on ? '1' : '0'); } catch { /* 忽略 */ }
}

const state = {
  tab: 'dash',
  status: null,
  trips: [],
  trend: [],
  summary: null,
  records: [],
  days: 30,
  health: null,
  /* 登录状态（GET /api/auth/status）。
     独立于数据来源：即使预览页数据走内置模拟，登录也真的落到服务端 ——
     会话存在后端，debug 页和后续 live 请求都要用它。 */
  auth: null,

     未拿到时为 null —— 此时按"保守显示"处理（不隐藏功能，但数据缺失处标注未知），

  stations: null,

     两者在界面上必须能区分 —— 把缺价格显示成 0 元是安全事故级误导。 */
  stationsPriceOk: true,
  stationsTotal: 0,

  locStatus: 'idle',

  loc: null,

  mode: PREFERS_MOCK ? 'mock' : 'live',

   预览兜底数据：2026 款焕新极氪 001（真实感演示）

/* ═══════════════════════════════════════════════
   工具
   ═══════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);

function fmt(v, d = 0, fallback = '--') {
  if (v === null || v === undefined || Number.isNaN(v)) return fallback;
  return Number(v).toFixed(d);
}
function fmtDist(km) {
  // 里程一律显示原始公里数 —— 不做「万」换算：15545 被压成「1.6 万」后
  // 既有精度损失，也无法比对官方 App 里的读数。
  if (km === null || km === undefined || Number.isNaN(km)) return '--';
  return Math.round(Number(km)).toLocaleString('en-US') + ' km';
}
function fmtDuration(min) {
  if (!min || min <= 0) return '--';
  const t = Math.round(min);
  if (t < 60) return t + ' 分钟';
  const h = Math.floor(t / 60), m = t % 60;
  return m === 0 ? h + ' 小时' : h + ' 小时 ' + m + ' 分';
}
function fmtTime(ts) {
  if (!ts) return '--';
  const d = new Date(String(ts).replace(/-/g, '/'));
  if (Number.isNaN(d.getTime())) return String(ts).slice(5, 16);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return '今天 ' + hh + ':' + mm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm;
}
function fmtMonth(ym) {
  const p = String(ym).split('-');
  return p.length === 2 ? parseInt(p[1], 10) + ' 月' : ym;
}
/* 电量配色阈值（中国传统色）：
   ≥50%  青碧 #16B89A —— 电量充裕
   30~50% 藤黄 #FFB020 —— 电量中等，建议留意
   <30%  朱砂 #E5483B —— 电量偏低，需尽快补能 */
function socColor(soc) {
  if (soc < 30) return 'var(--zhu-sha)';
  if (soc < 50) return 'var(--teng-huang)';
  return 'var(--qing-bi)';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* 演示模式：车控指令不发真实请求，本地模拟下发耗时并回执成功，
   以便完整预览按压 → 转圈 → 对勾 的动效链路 */
const CTRL_LABELS = {
  lock: '车辆已上锁', unlock: '车辆已解锁',
  climateOn: '空调已开启', climateOff: '空调已关闭',
  defrost: '前风挡除霜已开启', wheelHeat: '方向盘加热已开启',
  seatHeat: '座椅加热已开启', ventSeat: '座椅通风已开启',
  flash: '已闪灯', honk: '已鸣笛',
  closeWindows: '车窗已关闭', sunshade: '遮阳帘已展开',
  chargeStart: '已开始充电', chargeStop: '已结束充电',
  sentinel: '哨兵模式已开启',
  tripPlan: '出行规划已下发', carFinder: '车辆位置已推送', refresh: '车况已刷新',
};

/* 给请求补上 API 令牌。服务端没设 API_TOKEN 时 QUERY_TOKEN 为空，
   行为与以前完全一致（不额外加头）。 */
function withAuth(opts) {
  if (!QUERY_TOKEN) return opts;
  const merged = Object.assign({}, opts || {});
  merged.headers = Object.assign({}, (opts && opts.headers) || {}, {
    Authorization: 'Bearer ' + QUERY_TOKEN,
  });
  return merged;
}

async function api(path, opts) {
  // 模拟数据模式：不发起任何网络请求，交由调用方直接使用内置数据
  // 未登录前不调任何数据接口。live 模式下服务端要求登录态，调了只会失败，
  // 还会把服务端日志刷满无意义的报错 —— 登录相关的几个接口走 apiNoMock()，
  // 不受这里限制（否则连"查登录状态"都发不出去）。
  if (!isLoggedIn()) throw new Error('未登录：请先在「设置」里登录极氪账号');
  if (state.mode === 'mock') throw new Error('mock 模式：不访问网络');

  if (DEMO && path === '/api/vehicle/command') {
    const cmd = JSON.parse((opts && opts.body) || '{}').command;
    await new Promise((r) => setTimeout(r, 620));   // 模拟下发耗时
    applyDemoCommand(cmd);
    return { success: true, message: CTRL_LABELS[cmd] || '指令已下发' };
  }
  const res = await fetch(API_SOURCE + path, withAuth(opts));
  if (res.status === 401) {
    throw new Error('服务端要求 API 令牌：请改用 /preview?token=xxx 打开本页');
  }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.success) throw new Error(json.error || '服务端返回失败');
  return json.data;
}

/* 演示模式下让车况随指令联动，开关状态才有真实感 */
function applyDemoCommand(cmd) {
  const s = state.status;
  if (!s) return;
  switch (cmd) {
    case 'lock':      s.isLocked = true; break;
    case 'unlock':    s.isLocked = false; break;
    case 'climateOn': s.climateOn = true; break;
    case 'climateOff':s.climateOn = false; break;
    case 'closeWindows':
      s.windows = { driver: false, passenger: false, rearLeft: false, rearRight: false };
      break;
    case 'chargeStart': s.isCharging = true; break;
    case 'chargeStop':  s.isCharging = false; break;
  }
  const d = new Date();
  state.lastRefresh = String(d.getHours()).padStart(2, '0') + ':' +
                      String(d.getMinutes()).padStart(2, '0');
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ═══════════════════════════════════════════════
   电量环形
   ═══════════════════════════════════════════════ */
function socRing(soc, charging, size = 132, lw = 11) {
  const r = (size - lw) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, soc));
  const offset = c * (1 - pct / 100);
  const color = charging ? 'var(--dian-qing)' : socColor(pct);

  // 低电量分级：<30% 高危、30~50% 提醒（充电中不触发，此时主色为蓝）
  const level = charging ? null : (pct < 30 ? 'low' : (pct < 50 ? 'mid' : null));
  // 低电量时环体加呼吸脉冲，并用同色光晕强化警示
  const ringCls = ['ring-fg', level === 'low' ? 'ring-pulse' : ''].filter(Boolean).join(' ');

  return `
  <div class="ring-wrap${level ? ' ring-wrap--' + level : ''}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${lw}"/>
      <circle class="${ringCls}" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${lw}"
              stroke="${color}"
              stroke-dasharray="${c.toFixed(2)}"
              stroke-dashoffset="${offset.toFixed(2)}"/>
    </svg>
    <div class="ring-center">
      <div class="ring-num" style="color:${color}">
        ${Math.round(pct)}<span class="pct">%</span>
      </div>
      <div class="ring-label">${charging ? '充电中' : '剩余电量'}</div>
    </div>
    ${charging ? `<div class="ring-bolt">${SVG.bolt}</div>` : ''}
    ${level === 'low' ? `<div class="ring-alert">电量偏低</div>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════════
   折线图（Canvas 手绘，零依赖）
   ═══════════════════════════════════════════════ */
function drawLineChart(canvas, points, opts = {}) {
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 320;
  const cssH = opts.height || 160;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const padL = 34, padR = 10, padT = 14, padB = 24;
  const w = cssW - padL - padR;
  const h = cssH - padT - padB;

  const vals = points.map((p) => p.v).filter((v) => v !== null && !Number.isNaN(v));
  if (!vals.length) return;

  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { max += 1; min -= 1; }
  const span = max - min;
  min -= span * 0.12;
  max += span * 0.12;

  const stroke = opts.color || getComputedStyle(document.documentElement)
    .getPropertyValue('--tian-qing-deep').trim() || '#1C6FA8';
  const gridColor = 'rgba(128,128,128,.16)';
  const textColor = opts.textColor || 'rgba(128,128,128,.9)';

  const x = (i) => padL + (points.length === 1 ? w / 2 : (i / (points.length - 1)) * w);
  const y = (v) => padT + h - ((v - min) / (max - min)) * h;

  // 横向网格 + Y 轴刻度
  ctx.font = '10px -apple-system, sans-serif';
  ctx.fillStyle = textColor;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const gy = padT + (h / 3) * i;
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(padL + w, gy);
    ctx.stroke();

    const gv = max - ((max - min) / 3) * i;
    ctx.fillText(gv.toFixed(opts.decimals ?? 0), padL - 6, gy);
  }

  // 面积渐变
  const grad = ctx.createLinearGradient(0, padT, 0, padT + h);
  grad.addColorStop(0, opts.fillTop || 'rgba(46,139,192,.30)');
  grad.addColorStop(1, 'rgba(46,139,192,0)');

  ctx.beginPath();
  points.forEach((p, i) => {
    const py = y(p.v ?? min);
    i === 0 ? ctx.moveTo(x(i), py) : ctx.lineTo(x(i), py);
  });
  ctx.lineTo(x(points.length - 1), padT + h);
  ctx.lineTo(x(0), padT + h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 折线
  ctx.beginPath();
  points.forEach((p, i) => {
    const py = y(p.v ?? min);
    i === 0 ? ctx.moveTo(x(i), py) : ctx.lineTo(x(i), py);
  });
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // 末点标记
  const last = points[points.length - 1];
  if (last && last.v !== null) {
    ctx.beginPath();
    ctx.arc(x(points.length - 1), y(last.v), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = stroke;
    ctx.fill();
  }

  // 首尾日期
  ctx.fillStyle = textColor;
  ctx.textBaseline = 'top';
  ctx.font = '10px -apple-system, sans-serif';
  if (points.length > 1) {
    ctx.textAlign = 'left';
    ctx.fillText(points[0].label, padL, padT + h + 7);
    ctx.textAlign = 'right';
    ctx.fillText(last.label, padL + w, padT + h + 7);
  }
}

/* ═══════════════════════════════════════════════
   视图：车况
   ═══════════════════════════════════════════════ */
function renderDashboard() {
  const s = state.status;
  if (!s) {
    return `<div class="empty">
      <div class="ico">${SVG.car}</div>
      <div>尚未获取到车辆数据</div>
      <div style="margin-top:8px;font-size:11.5px">请确认 Python 服务已启动，且地址配置正确</div>
    </div>`;
  }

  const charging = s.isCharging === true;

  /* 车控总开关（设置页那个，默认关）。关闭时**保留按钮但置为 disabled** ——
     与 iOS ControlsPanel 一致：整格消失会让人以为功能丢了，
     置灰 + 一行说明才说得清"要先去设置里开"。 */
  const cmdsOn = state.allowCommands;

  const chargingCard = charging ? `
    <div class="card card-charging">
      <div class="charge-head">${SVG.bolt} 充电中</div>
      <div class="charge-grid">
        <div class="charge-item">
          <div class="v">${fmt(s.chargePowerKw, 1)}</div>
          <div class="k">功率 kW</div>
        </div>
        <div class="charge-item">
          <div class="v">${fmt(s.chargeVoltage, 0)}</div>
          <div class="k">电压 V</div>
        </div>
        <div class="charge-item">
          <div class="v">${fmt(s.chargeCurrent, 0)}</div>
          <div class="k">电流 A</div>
        </div>
      </div>
      ${s.minutesToFull > 0
        ? `<div class="charge-eta">${SVG.clock} 预计 ${fmtDuration(s.minutesToFull)} 充满</div>` : ''}
    </div>` : '';

  /* 胎压格：胎温作为副行显示（官方有 leftFrontTyreTemp 等独立字段，
     原实现只显示胎压，浪费了数据）。 */
  const tyre = (label, v, temp) => {
    const bad = v !== null && v !== undefined && (v < 220 || v > 280);
    const t = (cap('tyreTemp') && temp != null) ? `<div class="t">${fmt(temp, 0)} °C</div>` : '';
    return `<div class="tyre${bad ? ' warn' : ''}">
      <div class="k">${label}</div>
      <div class="v">${fmt(v, 0)}</div>
      ${t}
    </div>`;
  };

  /**
   * 状态 chip
   * tone 语义：
   *   good —— 安全/正常（青碧），如车门已锁
   *   bad  —— 真正的异常（朱砂），如车门未锁、车窗未关
   *   mid  —— 已启用（天青），如空调开启
   *   off  —— 未启用但正常（灰调），如空调关闭
   */
  const chip = (title, tone, text, icon) => `
    <div class="chip ${tone}">
      <div class="ico">${icon}</div>
      <div class="txt"><div class="t">${title}</div>
      <div class="s">${text}</div></div>
    </div>`;

  /* 三态 chip：显式区分「确认已关」「确认未关」「没读到」。
     旧实现用 `x !== true` 判断，字段缺失时会渲染成「已关」——
     在没有数据的情况下给出一个肯定的安全结论，这是最危险的假数据形态。 */
  const triChip = (title, icon, v, o = {}) => {
    const { onText = '开启', offText = '已关', onTone = 'bad', offTone = 'good' } = o;
    if (v === null || v === undefined) return chip(title, 'unknown', '—', icon);
    return v ? chip(title, onTone, onText, icon) : chip(title, offTone, offText, icon);
  };

  /* 三态取值：null 表示网关未提供该字段 */
  const tri = (v) => (v === null || v === undefined ? null : v === true);

  const climateOn = s.climateOn === true;
  const locked = s.isLocked === true;
  const lock3 = tri(s.isLocked);
  const doorOpen3 = anyTrue(...Object.values(s.doors || {}));
  const winOpen3 = anyTrue(...Object.values(s.windows || {}));
  const trunkOpen3 = tri(s.trunkOpen);
  const frunkOpen3 = tri(s.frunkOpen);

  // ── 车控按钮：三种形态 ──────────────────────────
  // 1) toggle：开关型（对应 zeekr_ha 的 switch / lock），显示目标动作，
  //    由服务端返回的 vehicle_status 驱动 .on 状态与图标方向
  // 2) action：瞬时动作（对应 button 实体），点击后给一次性脉冲反馈
  // 3) scene ：场景型（组合指令），同样是一次性动作
  const ctrlBtn = (o) => {
    const cls = [
      'ctrl',
      `ctrl--${o.kind || 'action'}`,
      o.on ? 'on' : '',
      o.danger ? 'danger' : '',
      o.wide ? 'wide' : '',
    ].filter(Boolean).join(' ');
    const sub = o.sub ? `<span class="ctrl-sub">${o.sub}</span>` : '';
    // 两种禁用来源：① 该指令当前不适用（如未插枪不能开充）；② 车控总开关关闭。
    // 用同一个 `disabled` 属性 —— 视觉（.ctrl[disabled] 半透明）与行为一致，
    // 不必再造一套"半禁用"状态。
    return `
    <button class="${cls}" data-cmd="${o.cmd}" data-label="${o.label}"
            aria-pressed="${o.kind === 'toggle' ? String(!!o.on) : 'false'}"
            ${(o.disabled || !cmdsOn) ? 'disabled' : ''}>
      <span class="ico">${o.icon}</span>
      <span class="ctrl-txt">${o.label}${sub}</span>
      <span class="ctrl-spin" aria-hidden="true"></span>
    </button>`;
  };

  /* 带能力门控的车控按钮：车辆不支持该能力时**整格不渲染**。
     旧版把 18 条指令全列出来（其中 10 条未经真车验证），点了只会静默失败 ——
     先问车支持什么，能一次性消掉这批死按钮。 */
  const capBtn = (key, o) => (cap(key) ? ctrlBtn(o) : '');

  return `
    <div class="card">
      <div class="hero">
        ${socRing(s.soc ?? 0, charging)}
        <div class="hero-info">
          <div>
            <div class="hero-name">${esc(s.nickname || s.modelName || '我的爱车')}</div>
            ${s.plateNo ? `<div class="hero-plate">${esc(s.plateNo)}</div>` : ''}
          </div>
          <div class="hr"></div>
          <div class="mini-row">
            <span class="mini-label">续航</span>
            <span class="mini-val">${s.rangeKm ? Math.round(s.rangeKm) + ' km' : '--'}</span>
          </div>
          <div class="mini-row">
            <span class="mini-label">总里程</span>
            <span class="mini-val">${fmtDist(s.odometerKm)}</span>
          </div>
        </div>
      </div>
    </div>

    ${chargingCard}

    <div class="grid2">
      <div class="stat">
        <div class="head">${SVG.thermo} 车内温度</div>
        <div class="val">${fmt(s.interiorTemp, 1)}<span class="u">°C</span></div>
      </div>
      <div class="stat">
        <div class="head">${SVG.sun} 车外温度</div>
        <div class="val">${fmt(s.exteriorTemp, 1)}<span class="u">°C</span></div>
      </div>
      <div class="stat">
        <div class="head">${SVG.chart} 平均能耗</div>
        <div class="val">${fmt(s.avgConsumption, 1)}<span class="u">kWh/100km</span></div>
      </div>
      <div class="stat">
        <div class="head">${SVG.battery} 12V 电瓶</div>
        <div class="val">${fmt(s.battery12vVoltage, 1)}<span class="u">V</span></div>
      </div>
    </div>

    ${cap('tyrePressure') ? `
    <div class="card">
      <div class="card-title">
        <span>胎压 <span style="font-size:11px;font-weight:400;color:var(--text-3)">kPa</span></span>
        ${s.tyreWarning === true
          ? '<span style="font-size:11px;color:var(--zhu-sha);font-weight:500">异常</span>'
          : (s.tyreWarning === null || s.tyreWarning === undefined
              ? '<span style="font-size:11px;color:var(--text-3)">告警状态未知</span>' : '')}
      </div>
      <div class="tyre-grid">
        ${tyre('左前', s.tyreFrontLeft, s.tyreTempFrontLeft)}
        ${tyre('右前', s.tyreFrontRight, s.tyreTempFrontRight)}
        ${tyre('左后', s.tyreRearLeft, s.tyreTempRearLeft)}
        ${tyre('右后', s.tyreRearRight, s.tyreTempRearRight)}
      </div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">
        <span>车身状态</span>
        ${state.capabilities ? '<span class="cap-badge">按车辆能力显示</span>' : ''}
      </div>
      <div class="grid2">
        ${cap('doorLock') ? triChip('锁车', lock3 ? SVG.lock : SVG.unlock, lock3,
              { onText: '已锁', offText: '未锁', onTone: 'good', offTone: 'bad' }) : ''}
        ${cap('doorLock') ? triChip('车门', SVG.car, doorOpen3,
              { onText: '有门未关', offText: '全部关闭' }) : ''}
        ${cap('climate') ? triChip('空调', SVG.snow, tri(s.climateOn),
              { onText: '开启', offText: '关闭', onTone: 'mid', offTone: 'off' }) : ''}
        ${cap('window') ? triChip('车窗', SVG.window, winOpen3,
              { onText: '有窗未关', offText: '全部关闭' }) : ''}
        ${cap('trunk') ? triChip('后备箱', SVG.trunk, trunkOpen3, { onText: '开启', offText: '已关' }) : ''}
        ${cap('frunk') ? triChip('前备箱', SVG.trunk, frunkOpen3, { onText: '开启', offText: '已关' }) : ''}
      </div>
      ${!state.capabilities
        ? `<div class="cap-hint">未取到车辆能力集，已按「全部显示」处理</div>` : ''}
    </div>

    <div class="card">
      <div class="card-title">
        <span>快捷车控</span>
        <span class="ctrl-hint">${cmdsOn
          ? (locked ? '车辆已上锁' : '车辆未上锁')
          : '已禁用'}</span>
      </div>

      <div class="ctrl-grid">
        ${capBtn('doorLock', {
          cmd: locked ? 'unlock' : 'lock',
          label: locked ? '解锁' : '锁车',
          sub: locked ? '当前已锁' : '当前未锁',
          icon: locked ? SVG.carUnlock : SVG.carLock,
          kind: 'toggle', on: locked,
        })}
        ${capBtn('climate', {
          cmd: climateOn ? 'climateOff' : 'climateOn',
          label: climateOn ? '关空调' : '开空调',
          sub: climateOn ? '运行中' : '已关闭',
          icon: SVG.snow, kind: 'toggle', on: climateOn,
        })}

/* ═══════════════════════════════════════════════
   能力集与三态判断
   ═══════════════════════════════════════════════ */

/* 先问车支持什么，再决定 UI 显示什么。
   `cap(key)` 的三态语义：
     true  —— 车辆明确支持
     false —— 车辆明确不支持 → UI 隐藏该功能
     能力集未拿到（null）→ 一律 true（保守显示）

   刻意不做"拿不到就隐藏"：网络抖动不该让整页功能凭空消失。
   而"某个字段网关没给"是另一回事，由 chip 的 unknown 态表达 ——
   两者职责分开，不要混用。 */
function cap(key) {
  const c = state.capabilities;
  if (!c || c[key] === undefined) return true;
  return c[key] !== false;
}

/* 三态归并：任一为 true → true；全为 null/undefined → null（未知）；否则 false。
   用于把四门 / 四窗归并成一个"有没有开"。
   返回 null 而不是 false 是关键 —— 后者会把"没数据"谎报成"已关好"。 */
function anyTrue(...vals) {
  const meaningful = vals.filter((v) => v !== null && v !== undefined);
  if (!meaningful.length) return null;
  return meaningful.some((v) => v === true);
}

function hasOpenWindow(s) {
  return anyTrue(...Object.values(s.windows || {})) === true;
}

/* 行程轨迹缩略图：把 trackpoint 序列画成一条折线。
   经纬度跨度可能极小，故按自身包围盒归一化，不依赖地图。 */
function trackSvg(points) {
  if (!Array.isArray(points) || points.length < 2) return '';
  const W = 300, H = 52, PAD = 4;
  const lngs = points.map((p) => p[0]);
  const lats = points.map((p) => p[1]);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const spanLng = maxLng - minLng || 1e-9;
  const spanLat = maxLat - minLat || 1e-9;
  const x = (lng) => PAD + ((lng - minLng) / spanLng) * (W - PAD * 2);
  const y = (lat) => H - PAD - ((lat - minLat) / spanLat) * (H - PAD * 2);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const s = points[0], e = points[points.length - 1];
  return `
    <div class="track">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="行程轨迹">
        <path d="${d}" fill="none" stroke="var(--tian-qing)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
        <circle cx="${x(s[0]).toFixed(1)}" cy="${y(s[1]).toFixed(1)}" r="3.2" fill="var(--qing-bi)"/>
        <circle cx="${x(e[0]).toFixed(1)}" cy="${y(e[1]).toFixed(1)}" r="3.2" fill="var(--zhu-sha)"/>
      </svg>
      <div class="tk-legend"><span>起点</span><span>${points.length} 个轨迹点</span><span>终点</span></div>
    </div>`;
}

/* ═══════════════════════════════════════════════
   视图：行程
   ═══════════════════════════════════════════════ */
function renderTrips() {
  const trend = state.trend;
  const trips = state.trips;

  if (!trend.length && !trips.length) {
    return `<div class="empty"><div class="ico">${SVG.chart}</div><div>暂无行程数据</div></div>`;
  }

  const totalDist = trend.reduce((a, p) => a + (p.distanceKm || 0), 0);
  const totalEnergy = trend.reduce((a, p) => a + (p.energyKwh || 0), 0);
  const avgCons = totalDist > 0 ? (totalEnergy / totalDist) * 100 : null;

  return `
    <div class="grid2">
      <div class="stat">
        <div class="head">${SVG.ruler} 累计里程</div>
        <div class="val">${Math.round(totalDist)}<span class="u">km</span></div>
      </div>
      <div class="stat">
        <div class="head">${SVG.bolt} 累计能耗</div>
        <div class="val">${totalEnergy.toFixed(1)}<span class="u">kWh</span></div>
      </div>
      <div class="stat">
        <div class="head">${SVG.chart} 平均能耗</div>
        <div class="val">${fmt(avgCons, 1)}<span class="u">kWh/100km</span></div>
      </div>
      <div class="stat">
        <div class="head">${SVG.route} 行程次数</div>
        <div class="val">${trips.length}<span class="u">次</span></div>
      </div>
    </div>

    <div class="chart-box">
      <div class="card-title">
        <span>百公里能耗趋势</span>
        <span class="seg">
          <button data-days="7" class="${state.days === 7 ? 'on' : ''}">7天</button>
          <button data-days="30" class="${state.days === 30 ? 'on' : ''}">30天</button>
          <button data-days="90" class="${state.days === 90 ? 'on' : ''}">90天</button>
        </span>
      </div>
      <canvas id="consChart"></canvas>
    </div>

    <div class="list">
      ${trips.slice(0, 30).map(tripItem).join('')}
    </div>`;
}

function tripItem(t) {
  /* 轨迹回放：仅在车辆具备该能力（cap('tripTrack')）且本行程确实带回轨迹点时渲染。
     数据来自 /ms-vehicle-trail/api/v1.0/journalLog/trackpoint/list。 */
  const track = (cap('tripTrack') && t.trackpoints) ? trackSvg(t.trackpoints) : '';

  return `
    <div class="item">
      <div class="item-top">
        <span class="item-time">${fmtTime(t.startTime)}</span>
        <span class="item-amt">${fmt(t.distanceKm, 1)} km</span>
      </div>
      <div class="item-main">${esc(t.startPlace || '起点')} → ${esc(t.endPlace || '终点')}</div>
      <div class="item-tags">
        <span class="tag a">${fmt(t.energyKwh, 2)} kWh</span>
        <span class="tag w">${fmt(t.consumption, 1)} kWh/100km</span>
        ${t.durationMinutes ? `<span class="tag">${fmtDuration(t.durationMinutes)}</span>` : ''}
        ${t.avgSpeedKmh != null ? `<span class="tag">均速 ${fmt(t.avgSpeedKmh, 0)} km/h</span>` : ''}
        ${t.maxSpeedKmh != null ? `<span class="tag">最高 ${fmt(t.maxSpeedKmh, 0)} km/h</span>` : ''}
      </div>
      ${track}
    </div>`;
}

/* ═══════════════════════════════════════════════
   视图：充电
   ═══════════════════════════════════════════════ */
function renderCharges() {
  const sum = state.summary;
  const records = state.records;
  /* 附近充电站与消费账单是**两块独立的数据**（前者实时、后者是导入的历史），
     所以它必须在空态判断**之外**渲染 —— 没导入过账单，不代表看不到
     "附近哪能充、现在多少钱"，而那恰恰是充电页最有用的信息。 */
  const nearby = nearbyStationsCard();

  if (!sum || !sum.totalCount) {
    return `
      ${nearby}
      <div class="empty">
        <div class="ico">${SVG.bolt}</div>
        <div>还没有充电消费记录</div>
        <div style="margin-top:8px;font-size:11.5px">
          导入支付宝 / 微信账单后，这里会自动归集各服务商的充电消费
        </div>
      </div>
      ${chargePlanCard()}
      ${soonCard()}`;
  }

  const maxAmt = Math.max(...(sum.byProvider || []).map((p) => p.amount || 0), 1);

  return `
    <div class="summary-hero">
      <div class="lbl">累计充电消费</div>
      <div class="big">${fmt(sum.totalAmount, 2)}<span class="u">元</span></div>
      <div class="summary-sub">
        <div>
          <div class="v">${sum.totalCount}</div>
          <div class="k">笔数</div>
        </div>
        <div>
          <div class="v">${sum.totalEnergyKwh ? fmt(sum.totalEnergyKwh, 1) : '--'}</div>
          <div class="k">总电量 kWh</div>
        </div>
        <div>
          <div class="v">${sum.avgUnitPrice ? fmt(sum.avgUnitPrice, 2) : '--'}</div>
          <div class="k">均价 元/kWh</div>
        </div>
      </div>
    </div>

    ${nearby}

    ${chargePlanCard()}

    <div class="card">
      <div class="card-title">服务商分布</div>
      <div class="pbar">
        ${(sum.byProvider || []).map((p) => {
          const color = PROVIDER_COLORS[p.provider] || PROVIDER_COLORS.other;
          const pct = ((p.amount || 0) / maxAmt) * 100;
          return `<div class="pbar-row">
            <div class="pbar-head">
              <span class="pbar-name">${esc(p.providerName || p.provider || '其他')}</span>
              <span class="pbar-amt">${fmt(p.amount, 2)} 元</span>
            </div>
            <div class="pbar-track">
              <div class="pbar-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <div class="pbar-sub">${p.count} 笔</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="chart-box">
      <div class="card-title">月度消费趋势</div>
      <canvas id="monthChart"></canvas>
    </div>

    <div class="card-title" style="padding:4px 2px 0">消费明细</div>
    <div class="list">
      ${records.slice(0, 40).map(chargeItem).join('')}
    </div>

    ${soonCard()}`;
}

function chargeItem(r) {
  const color = PROVIDER_COLORS[r.provider] || PROVIDER_COLORS.other;
  return `
    <div class="item">
      <div class="item-top">
        <span class="item-time">${fmtTime(r.timestamp)}</span>
        <span class="item-amt" style="color:${color}">${fmt(r.amount, 2)} 元</span>
      </div>
      <div class="item-main">${esc(r.merchant || '未知商户')}</div>
      <div class="item-tags">
        <span class="tag p">${esc(r.providerName || r.provider || '其他')}</span>
        ${r.channel ? `<span class="tag">${r.channel === 'alipay' ? '支付宝' : r.channel === 'wechat' ? '微信' : r.channel}</span>` : ''}
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════
   附近充电站
   ───────────────────────────────────────────────
   数据由**服务端**合并两跳后下发：极氪给坐标与枪数，第三方网关给站名与电价。
   前端只吃结构化结果 —— 既不接触签名，也接触不到渠道号，更不会把
   用户坐标发给第三方（服务端只把 stationId 转出去）。

   位置来源是**手机定位**，刻意不用车辆位置：车况接口虽然也带经纬度，
   但人车分离时"车停哪儿"对"我现在要去哪充"毫无帮助，而它又属于隐私数据。
   ═══════════════════════════════════════════════ */

/* 排序：距离升序；价格缺失的站点永远排最后。
   把"没有价格"当 0 排到首位，是这里最典型也最危险的排序错误。 */
function sortStations(list) {
  const copy = list.slice();
  if (state.stationSort === 'price') {
    copy.sort((a, b) => {
      const pa = a.price && a.price.totalPrice != null ? a.price.totalPrice : Infinity;
      const pb = b.price && b.price.totalPrice != null ? b.price.totalPrice : Infinity;
      return (pa - pb) || ((a.distanceKm || 0) - (b.distanceKm || 0));
    });
  } else {
    copy.sort((a, b) => (a.distanceKm || 0) - (b.distanceKm || 0));
  }
  return copy;
}

function stationRow(s) {
  const p = s.price || null;
  const open = state.stationOpen === s.stationId;
  const total = s.totalCount || 0;
  const avail = s.availableCount || 0;

  /* 枪数按快慢充分开显示。上游没给总枪数时**不显示 0/x** ——
     "0 个可用"和"不知道几个可用"是两回事，前者会让人白白放弃一个站。 */
  const guns = [];
  if (s.dcCount) guns.push(`快充 ${s.ableDcCount == null ? '--' : s.ableDcCount}/${s.dcCount}`);
  if (s.acCount) guns.push(`慢充 ${s.ableAcCount == null ? '--' : s.ableAcCount}/${s.acCount}`);
  if (!guns.length && total) guns.push(`可用 ${avail}/${total}`);
  const gunClass = (total && avail === 0) ? 'gone' : 'ok';

  const hasPrice = p && p.totalPrice != null;
  const priceHtml = hasPrice
    ? `${fmt(p.totalPrice, 2)}<span class="u">/度</span>`
    : '<span class="u">价格 --</span>';

  const tags = (s.tags || []).slice(0, 2)
    .map((t) => `<span class="st-tag">${esc(t)}</span>`).join('');

  return `<div class="st" data-sid="${esc(s.stationId)}">
    <div class="st-head">
      <div class="st-name">${esc(s.name || '未命名站点')}</div>
      <div class="st-price${hasPrice ? '' : ' na'}">${priceHtml}</div>
    </div>
    <div class="st-meta">
      <span>${s.distanceKm == null ? '--' : fmt(s.distanceKm, 2) + ' km'}</span>
      ${guns.length ? `<span class="${gunClass}">${guns.join(' · ')}</span>` : ''}
      ${s.score ? `<span>评分 ${s.score}</span>` : ''}
      ${s.selfOperate ? '<span class="st-tag">自营</span>' : ''}
      ${tags}
    </div>
    ${open ? stationDetail(s) : ''}
  </div>`;
}

/* 展开区：分时电价表 + 停车 / 占位费 + 导航。
   当前时段**必须指认出来** —— 用户看这张卡就是为了知道"现在充多少钱"，
   把 7 段电价平铺而不标出当前段，等于让他自己算。 */
function stationDetail(s) {
  const p = s.price;
  if (!p) {
    return `<div class="st-periods">
      <div class="st-period"><span>该站点暂时取不到价格</span><span>--</span></div>
    </div>`;
  }

  const periods = (p.periods || []).map((f) => {
    const now = !!f.timeFrame && f.timeFrame === p.currentPeriod;
    return `<div class="st-period${now ? ' now' : ''}">
      <span>${esc(f.timeFrame || '--')}${now ? ' · 当前' : ''}</span>
      <span>${f.total == null ? '--' : fmt(f.total, 2)} 元/度</span>
    </div>`;
  }).join('');

  const notes = [];
  if (p.feeDesc) notes.push(esc(p.feeDesc));
  if (p.parkingFee) notes.push(`停车：${esc(p.parkingFee)}${p.parkFree ? '（免费）' : ''}`);
  if (p.holdFee) notes.push('超时占用另收占位费');

  return `
    <div class="st-periods">${periods
      || '<div class="st-period"><span>分时电价未提供</span><span>--</span></div>'}</div>
    ${notes.length ? `<div class="st-note">${notes.join('<br>')}</div>` : ''}
    <div class="st-actions">
      <button class="st-btn" data-nav="${esc(s.stationId)}">导航到这里</button>
    </div>`;
}

function nearbyStationsCard() {
  // 未登录时服务端会拒绝 /api/stations —— 放出卡片只会诱导用户点一个
  // 必然失败的按钮，那比不显示更糟。
  if (state.mode === 'needLogin') return '';

  const title = (right) => `
    <div class="card-title">
      <span>附近充电站</span>
      <span class="cap-badge">${right}</span>
    </div>`;

  // ① 定位失败 / 环境不支持：**给出具体原因**，否则用户只会以为页面坏了
  if (!state.loc && ['denied', 'error', 'unsupported'].includes(state.locStatus)) {
    return `<div class="card">
      ${title('需定位')}
      <div class="st-note">${esc(state.locError || '无法获取位置')}</div>
      <div class="st-actions">
        <button class="st-btn" onclick="locate(true)">重试定位</button>
      </div>
      <div class="st-actions">
        <input class="st-input" id="manualLoc" placeholder="或手动输入：纬度, 经度">
        <button class="st-btn ghost" style="flex:0 0 62px" onclick="useManualLoc()">使用</button>
      </div>
    </div>`;
  }

  // ② 尚未定位 / 定位中
  if (!state.loc) {
    const busy = state.locStatus === 'locating';
    return `<div class="card">
      ${title(busy ? '定位中' : '待定位')}
      <div class="st-note">${busy
        ? '正在获取当前位置…'
        : '查找充电站需要手机定位。位置只用于本次查询 —— 不落盘，也不会发给第三方。'}</div>
      ${busy ? '' : `<div class="st-actions">
        <button class="st-btn" onclick="locate(true)">获取附近充电站</button>
      </div>`}
    </div>`;
  }

  // ③ 已定位但没拿到站点
  const list = state.stations || [];
  if (!list.length) {
    return `<div class="card">
      ${title(state.stationsLoading ? '加载中' : '无数据')}
      <div class="st-note">${state.stationsLoading
        ? '正在查找附近充电站…'
        : (state.locError ? esc(state.locError) : '附近没有查到充电站。')}</div>
      <div class="st-actions">
        <button class="st-btn ghost" onclick="locate(true)">重新定位</button>
      </div>
    </div>`;
  }

  const sorted = sortStations(list);
  return `<div class="card">
    ${title(`${state.stationsTotal} 站`)}
    ${state.stationsPriceOk ? '' : `<div class="st-note">价格服务暂时不可用，以下仅显示距离与枪数。</div>`}
    <div class="st-bar">
      <span class="cap-badge">点卡片看分时电价</span>
      <div class="seg">
        <button class="${state.stationSort === 'distance' ? 'on' : ''}" data-sort="distance">距离</button>
        <button class="${state.stationSort === 'price' ? 'on' : ''}" data-sort="price">价格</button>
      </div>
    </div>
    <div class="st-list">${sorted.map(stationRow).join('')}</div>
    <div class="st-note">位置仅用于本次查询，不落盘、不发给第三方。</div>
  </div>`;
}

/* 一键导航：交给系统/地图 App，不在本页画地图 ——
   画地图要引入瓦片、手势与坐标系纠偏，成本远高于收益。 */
function openStationNav(stationId) {
  const s = (state.stations || []).find((x) => x.stationId === stationId);
  if (!s || s.lat == null || s.lng == null) { toast('该站点缺少坐标，无法导航'); return; }
  const name = encodeURIComponent(s.name || '充电站');
  window.open(`https://uri.amap.com/marker?position=${s.lng},${s.lat}&name=${name}`, '_blank');
}

/* ── 定位 ──
   唯一的位置来源是手机定位。坐标只在内存里活到本次查询结束：
   不写 localStorage、不进日志、不随请求发给第三方网关。 */
function locate(force) {
  if (state.mode === 'mock' || state.mode === 'offline') {
    // 预览兜底数据已经带了位置，无需（也做不到）真去定位
    state.locStatus = 'ok';
    render();
    return;
  }
  // 未登录时连 /api/stations 都调不了，此时弹权限框纯属骚扰
  if (state.mode === 'needLogin') return;
  if (!navigator.geolocation) {
    state.locStatus = 'unsupported';
    state.locError = '当前环境不支持定位：浏览器只在 HTTPS 或 localhost 下提供定位能力。';
    render();
    return;
  }
  if (state.locStatus === 'locating' && !force) return;

  state.locStatus = 'locating';
  state.locError = '';
  render();

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.locStatus = 'ok';
      loadStations().then(render);
    },
    (err) => {
      // 1 = 用户拒绝；2 = 位置不可用；3 = 超时
      state.locStatus = err.code === 1 ? 'denied' : 'error';
      state.locError = err.code === 1
        ? '定位权限被拒绝。可在浏览器地址栏左侧重新允许，或手动输入坐标。'
        : `定位失败（${err.message || '超时或位置不可用'}）。可重试，或手动输入坐标。`;
      render();
    },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 },
  );
}

/* 手动兜底：坐标只留在前端内存，与定位结果走同一条加载路径。
   存在意义：局域网 HTTP 访问时浏览器**不提供**定位能力，
   没有这条退路，那种环境下的充电页永远是空的。 */
function useManualLoc() {
  const el = document.getElementById('manualLoc');
  const parts = ((el && el.value) || '').split(/[\s,，]+/).filter(Boolean).map(Number);
  if (parts.length !== 2 || !parts.every(Number.isFinite)) {
    toast('请输入「纬度, 经度」，例如 31.2304, 121.4737');
    return;
  }
  const [lat, lng] = parts;
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) { toast('坐标超出有效范围'); return; }
  state.loc = { lat, lng };
  state.locStatus = 'ok';
  state.locError = '';
  loadStations().then(render);
}

async function loadStations() {
  if (!state.loc) return false;
  state.stationsLoading = true;
  render();
  try {
    const data = await api(
      `/api/stations/nearby?lat=${state.loc.lat}&lng=${state.loc.lng}&limit=20`);
    state.stations = data.stations || [];
    state.stationsTotal = data.total == null ? state.stations.length : data.total;
    // 显式判 `!== false`：后端不返回该字段时按"有价格"处理，避免误报不可用
    state.stationsPriceOk = data.priceAvailable !== false;
    state.locError = '';
    return true;
  } catch (e) {
    console.warn('附近充电站加载失败', e);
    state.stations = [];
    state.stationsPriceOk = false;
    state.locError = e.message;
    return false;
  } finally {
    state.stationsLoading = false;
  }
}

/* ─────────── 账号登录 ───────────
   为什么另起一套请求函数：预览页在「地址指向本机」时会走内置模拟数据、
   完全不发请求（这样没有后端也能看设计）。但登录不能这样 —— 会话存在
   服务端，必须真的请求，否则 debug 页拿不到登录态。
   所以 apiNoMock() 跳过那层判断，只用于登录相关接口。 */
async function apiNoMock(path, opts) {
  const res = await fetch(API_SOURCE + path, withAuth(Object.assign({
    headers: { 'Content-Type': 'application/json' },
  }, opts || {})));

  let json = null;
  try { json = await res.json(); } catch (_) { /* 可能没有响应体 */ }

  if (!res.ok) {
    const detail = (json && (json.detail || json.error)) || ('HTTP ' + res.status);
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  if (json && json.success === false) throw new Error(json.error || '服务端返回失败');
  return json && typeof json === 'object' && 'data' in json ? json.data : json;
}

async function loadAuth() {
  try {
    state.auth = Object.assign({}, await apiNoMock('/api/auth/status'), { error: null });
  } catch (err) {

  }
  render();
}

let authBusy = false;

async function authSendCode() {
  const el = document.getElementById('authPhone');
  const phone = ((el && el.value) || '').trim();
  if (!/^\d{11}$/.test(phone)) { toast('请输入 11 位手机号'); return; }
  if (authBusy) return;
  authBusy = true;

  const btn = document.getElementById('authSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = '发送中'; }
  try {
    const r = await apiNoMock('/api/auth/sendCode', {
      method: 'POST', body: JSON.stringify({ phone }),
    });
    toast((r && r.message) || '验证码已发送，请查看短信');
    const code = document.getElementById('authCode');
    if (code) code.focus();
  } catch (err) {
    toast('发送失败：' + err.message);
  } finally {
    authBusy = false;
    const b = document.getElementById('authSendBtn');
    if (b) { b.disabled = false; b.textContent = '发送验证码'; }
  }
}

async function authLogin() {
  const phoneEl = document.getElementById('authPhone');
  const codeEl = document.getElementById('authCode');
  const phone = ((phoneEl && phoneEl.value) || '').trim();
  const code = ((codeEl && codeEl.value) || '').trim();
  if (!/^\d{11}$/.test(phone)) { toast('请输入 11 位手机号'); return; }
  if (!/^\d{4,6}$/.test(code)) { toast('请输入短信验证码'); return; }
  if (authBusy) return;
  authBusy = true;

  const btn = document.getElementById('authLoginBtn');
  if (btn) { btn.disabled = true; btn.textContent = '登录中'; }
  try {
    await apiNoMock('/api/auth/verifyCode', {
      method: 'POST', body: JSON.stringify({ phone, code }),
    });
    toast('登录成功');
    await loadAuth();
    await loadAll();          // 登录之后才开始加载数据
  } catch (err) {
    toast('登录失败：' + err.message);
  } finally {
    authBusy = false;
    const b = document.getElementById('authLoginBtn');
    if (b) { b.disabled = false; b.textContent = '登录'; }
  }
}

async function authLogout() {
  if (authBusy) return;
  authBusy = true;
  try {
    await apiNoMock('/api/auth/logout', { method: 'POST' });
    toast('已退出登录');
    // 退出后清掉已加载的数据 —— 否则页面上还留着上一位用户的车辆信息
    state.status = null; state.trips = []; state.trend = [];
    state.summary = null; state.records = []; state.health = null;
    state.capabilities = null; state.permissions = null; state.chargePlan = null;

       而且它只对"这一次查询"有意义。 */
    state.stations = null; state.stationsTotal = 0; state.stationsPriceOk = true;
    state.loc = null; state.locStatus = 'idle'; state.locError = ''; state.stationOpen = '';
    await loadAuth();
    state.mode = 'needLogin';
    render();
  } catch (err) {
    toast('退出失败：' + err.message);
  } finally {
    authBusy = false;
  }
}
