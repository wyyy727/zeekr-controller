function render() {
  const view = $('#view');

  // 未登录：除「设置」（登录表单在那里）外一律显示登录引导，
  // 不渲染任何依赖数据的内容
  if (state.mode === 'needLogin' && state.tab !== 'settings') {
    view.innerHTML = renderLoginWall();
    return;
  }

  const html = {
    dash: renderDashboard,
    trips: renderTrips,
    charges: renderCharges,
    settings: renderSettings,
  }[state.tab]();

  view.innerHTML = html;

  // 图表延后绘制（需等布局完成）
  requestAnimationFrame(() => {
    if (state.tab === 'trips') {
      const c = $('#consChart');
      if (c && state.trend.length) {
        drawLineChart(c,
          state.trend.map((p) => ({
            v: p.consumption,
            label: String(p.date).slice(5),
          })),
          { height: 168, decimals: 0 });
      }
    }
    if (state.tab === 'charges') {
      const c = $('#monthChart');
      if (c && state.summary && state.summary.monthly) {
        const m = [...state.summary.monthly].reverse();
        drawLineChart(c,
          m.map((x) => ({ v: x.amount, label: fmtMonth(x.month) })),
          { height: 168, decimals: 0, fillTop: 'rgba(46,139,192,.28)' });
      }
    }
  });
}

/* ═══════════════════════════════════════════════
   数据加载
   ═══════════════════════════════════════════════ */
state.loading = false;
state.lastRefresh = null;

/* 徽标：文本 + data-mode（驱动状态圆点配色）
   真实数据无需标识，直接隐藏；只有模拟数据才显示 */
function setModeBadge(text, mode) {
  const badge = $('#modeBadge');
  if (!badge) return;
  if (!text) {
    badge.classList.add('hidden');
    badge.dataset.mode = mode || '';
    return;
  }
  badge.classList.remove('hidden');
  badge.textContent = text;
  badge.dataset.mode = mode;
}

/* 按当前 state.mode 刷新徽标 */
function syncModeBadge() {
  switch (state.mode) {
    case 'live':
      setModeBadge('', 'live');                                   // 真实数据：不显示
      break;
    case 'offline':
      setModeBadge('模拟数据 · 后端不可达', 'offline');
      break;
    default:
      setModeBadge('模拟数据', 'mock');
  }
}

/* 各加载器返回是否成功，供 loadAll 统一判定后端可用性 */
async function loadHealth() {
  try {
    state.health = await api('/api/health');
    return true;
  } catch {
    state.health = null;
    return false;
  }
}

async function loadStatus() {
  try {
    state.status = await api('/api/vehicle/status');
    const d = new Date();
    state.lastRefresh = String(d.getHours()).padStart(2, '0') + ':' +
                       String(d.getMinutes()).padStart(2, '0');
    return true;
  } catch (e) {
    console.warn('状态加载失败', e);
    return false;
  }
}

async function loadTrips() {
  try {
    const [trips, trend] = await Promise.all([
      api('/api/trips?days=' + state.days),
      api('/api/energy/trend?days=' + state.days),
    ]);
    state.trips = trips || [];
    state.trend = trend || [];
    return true;
  } catch (e) {
    console.warn('行程加载失败', e);
    return false;
  }
}

async function loadCharges() {
  try {
    const [summary, records] = await Promise.all([
      api('/api/charges/summary?months=6'),
      api('/api/charges/records?limit=50'),
    ]);
    state.summary = summary;
    state.records = records || [];
    return true;
  } catch (e) {
    console.warn('充电数据加载失败', e);
    return false;
  }
}

function seedMock() {
  state.status = MOCK.status;
  state.trips = MOCK.trips;
  state.trend = MOCK.trend.slice(-state.days);
  state.summary = MOCK.summary;
  state.records = MOCK.records;
  state.health = MOCK.health;
  state.capabilities = MOCK.capabilities;
  state.permissions = MOCK.permissions;
  state.chargePlan = MOCK.chargePlan;
  state.stations = MOCK.stations;
  state.stationsTotal = MOCK.stations.length;
  state.stationsPriceOk = true;
  /* 预览兜底数据的位置：与 MOCK.stations 里各站的距离基准一致（上海市中心）。
     直接给值而不是走定位 —— 预览页的本职是"看设计"，
     不该一打开就弹权限框。 */
  state.loc = { lat: 31.2304, lng: 121.4737 };
  state.locStatus = 'ok';
  const d = new Date();
  state.lastRefresh = String(d.getHours()).padStart(2, '0') + ':' +
                     String(d.getMinutes()).padStart(2, '0');
}

/* 权限包与预约计划：真实模式下尝试拉取（后端 GET /api/vehicle/capability）。
   拿不到时静默退化为 capabilities = null —— cap() 会按「全部显示」处理，
   数据缺失由 chip 的 unknown 态表达。不阻断主流程。 */
async function loadCapabilities() {
  try {
    const data = await api('/api/vehicle/capability');
    if (data && data.capabilities) {
      state.capabilities = data.capabilities;
    }
    if (data && Array.isArray(data.permissions)) {
      state.permissions = data.permissions;
    }
    if (data && data.chargePlan) {
      state.chargePlan = data.chargePlan;
    }
  } catch {
    state.capabilities = state.capabilities || null;
  }
}

/* 模拟数据模式提示：只在「配置了真实地址却连不上」时弹一次，
   避免用户误以为界面上的是真实车况 */
let fallbackNotified = false;
function notifyFallback(reason) {
  if (fallbackNotified) return;
  fallbackNotified = true;
  toast('连接服务端失败，已切换为模拟数据，当前展示的不是真实车况');
  console.warn('[ZeekrDash] 后端不可达，已回落模拟数据', reason || '');
}

/* 并发保护：启动与 visibilitychange 可能同时触发，避免重复请求与状态抖动 */
let loading = false;

/* 是否已建立登录会话 —— 所有数据接口的前置条件。 */
function isLoggedIn() {
  return !!(state.auth && state.auth.authenticated === true);
}

/* 启动流程：**先确认登录态，再决定要不要加载数据**。
   未登录时一个数据接口都不调 —— live 模式下服务端要求登录，
   调了只会失败，还把日志刷满无意义的报错。
   唯一允许的请求是 /api/auth/status：不查它就无法判断
   该显示登录表单还是数据。 */
async function bootstrap() {
  await loadAuth();
  const a = state.auth || {};

  if (a.authenticated) {
    state.mode = 'live';
    await loadAll();
    return;
  }

  if (a.error) {
    // 连不上后端：这正是预览页的本职场景 —— 用内置数据把设计呈现出来
    seedMock();
    state.mode = 'mock';
    render();
    return;
  }

  // 后端在，但还没登录：停在登录引导，不碰任何数据接口
  state.status = null; state.trips = []; state.trend = [];
  state.summary = null; state.records = []; state.health = null;
  /* 未登录时不定位、也不保留上一会话的站点与坐标 */
  state.stations = null; state.loc = null; state.locStatus = 'idle';
  state.mode = 'needLogin';
  render();
}

/* 切标签页（底部导航与「去登录」按钮共用） */
function goTab(name) {
  const btn = document.querySelector(`.tab[data-tab="${name}"]`);
  state.tab = name;
  document.querySelectorAll('.tab').forEach((b) =>
    b.classList.toggle('on', b === btn));
  /* 首次进充电页时自动请求一次定位 —— **只自动做一次**：
     被拒绝后反复弹权限框是骚扰，之后交给用户点「重试定位」。 */
  if (name === 'charges' && state.locStatus === 'idle') locate();
  render();
}

/* 未登录时的占位 —— 明确说明"没有请求接口"，免得看起来像页面坏了 */
function renderLoginWall() {
  return `
    <div class="card" style="text-align:center;padding:36px 20px">
      <div style="font-size:32px;opacity:.3;margin-bottom:12px">${SVG.phone}</div>
      <div style="font-size:14px;font-weight:500;margin-bottom:7px">需要先登录极氪账号</div>
      <div style="font-size:12px;color:var(--text-3);line-height:1.75;margin-bottom:18px">
        服务端已连上（真实数据模式）。<br>
        登录前不会请求任何车况 / 行程 / 充电接口。
      </div>
      <button class="auth-btn" onclick="goTab('settings')">去登录</button>
    </div>`;
}

async function loadAll() {
  if (loading) return;
  loading = true;
  state.loading = true;
  render();

  try {
    // ① 地址未配置或指向 localhost：按约定直接展示内置模拟数据，不请求后端
    // 未登录 / 无后端：不请求数据接口（登录态由 bootstrap 统一处理）
    if (!isLoggedIn()) {
      if (state.mode !== 'needLogin') { seedMock(); state.mode = 'mock'; }
      return;
    }

    // ② 配置了真实地址：并发请求，全量结果一起等
    //    以「车辆状态 + 健康检查」是否都拿到作为后端可用的判据，
    //    任一失败即视为不可达，回落模拟数据
    const [statusOk, healthOk] = await Promise.all([loadStatus(), loadHealth()]);
    await Promise.all([loadTrips(), loadCharges(), loadCapabilities(), loadAuth()]);

    if (statusOk && healthOk) {
      state.mode = 'live';
      fallbackNotified = false;
    } else {
      seedMock();
      state.mode = 'offline';
      notifyFallback('后端未响应 /api/vehicle/status 或 /api/health');
    }
  } finally {
    syncModeBadge();
    state.loading = false;
    loading = false;
    render();
  }
}

/* ═══════════════════════════════════════════════
   交互
   ═══════════════════════════════════════════════ */
document.querySelector('.tabbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  goTab(btn.dataset.tab);
});

/* 车控总开关：切换后立即持久化并重渲染 —— 车控页那 15 个按钮的可用态
   跟着变（关 → 全部置灰 + 「已禁用」）。这是**界面意图**开关；
   真正的闸门在服务端（ALLOW_COMMANDS），两把锁都要开。 */
document.addEventListener('change', (e) => {
  const sw = e.target.closest('#allowCmdsSw');
  if (!sw) return;
  state.allowCommands = sw.checked;
  writeAllowCommands(sw.checked);
  render();
});

document.addEventListener('click', (e) => {
  // 附近充电站：导航按钮在卡片行**内部**，必须先于整行展开判断，
  // 否则点「导航」会连带把详情也收起来。
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    openStationNav(navBtn.dataset.nav);
    return;
  }
  // 站点排序（限定 data-sort，与下面的时间区间切换互不干扰）
  const sortBtn = e.target.closest('.seg button[data-sort]');
  if (sortBtn) {
    state.stationSort = sortBtn.dataset.sort;
    render();
    return;
  }
  // 站点卡片：展开 / 收起分时电价表
  const stCard = e.target.closest('.st');
  if (stCard) {
    const sid = stCard.dataset.sid;
    state.stationOpen = state.stationOpen === sid ? '' : sid;
    render();
    return;
  }
  // 车控
  const ctrl = e.target.closest('.ctrl');
  if (ctrl && !ctrl.disabled) {
    spawnRipple(ctrl, e);
    sendCommand(ctrl);
    return;
  }
  // 时间区间切换（限定 data-days：`.seg` 被附近充电站的排序复用了）
  const seg = e.target.closest('.seg button[data-days]');
  if (seg) {
    state.days = parseInt(seg.dataset.days, 10);
    loadTrips().then(render);
  }
});

/* 点击处生成涟漪 —— 纯视觉反馈，不参与业务 */
function spawnRipple(btn, e) {
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.9;
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = ((e.clientX ?? r.left + r.width / 2) - r.left) + 'px';
  span.style.top = ((e.clientY ?? r.top + r.height / 2) - r.top) + 'px';
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}

/* 车端执行结果确认。
   对应官方接口 `/ms-remote-control/api/v1.0/remoteControl/queryProcessResult`
   —— 网关返回"已提交"只代表它收下了，**不代表车动了**。

   返回值三态：
     true  —— 车端确认已执行
     false —— 车端明确执行失败
     null  —— 超时未确认（既不能当成功，也不能当失败） */
async function pollCommandResult(commandId) {
  // 演示模式：本地模拟一次车端确认，保证三态链路可视
  if (DEMO || state.mode === 'mock') {
    await new Promise((r) => setTimeout(r, 1100));
    return true;
  }
  // 真实模式：后端该接口尚未实现（属待确认的新功能），
  // 请求失败时如实返回 null —— 宁可报"未确认"，不谎报成功。
  for (let i = 0; i < 5; i++) {
    try {
      const r = await api('/api/vehicle/command/result?id=' + encodeURIComponent(commandId));
      if (r && r.status === 'done') return true;
      if (r && r.status === 'failed') return false;
    } catch { /* 接口未实现 / 网络异常 → 继续轮询 */ }
    await new Promise((res) => setTimeout(res, 1500));
  }
  return null;
}

/* 车控指令：四段式反馈
   ① busy        —— 请求已发出，等网关受理
   ② pending     —— 网关已受理，等**车端执行确认**
   ③ done        —— 车端确认已执行
   ④ fail / unconfirmed —— 执行失败 / 超时未确认

   ② 与 ③ 必须分开：旧实现把"网关已提交"直接当成功，
   会造成"以为锁了车其实没锁"的假成功 —— 这是安全问题，不是体验问题。 */
async function sendCommand(btn) {
  const cmd = btn.dataset.cmd;
  const label = btn.dataset.label || '指令';
  const isToggle = btn.classList.contains('ctrl--toggle');

  // 双保险：开关关闭时按钮已是 disabled（且 pointer-events:none），点击根本到不了这里；
  // 但程序化调用仍必须被拦住 —— 安全开关不能只靠一个入口。
  if (!state.allowCommands) { toast('控制指令已关闭：请在「设置」中开启'); return; }

  if (btn.classList.contains('busy') || btn.classList.contains('pending')) return;
  btn.classList.add('busy');

  const subEl = btn.querySelector('.ctrl-sub');
  const origSub = subEl ? subEl.textContent : '';

  const settle = (cls, keepMs) => {
    btn.classList.remove('busy', 'pending');
    btn.classList.add(cls);
    setTimeout(() => {
      btn.classList.remove('done', 'fail', 'unconfirmed', cls);
      if (subEl) subEl.textContent = origSub;
      loadStatus().then(render);
    }, keepMs);
  };

  try {
    const res = await api('/api/vehicle/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd }),
    });

    // ── 阶段 ②：网关已受理，等车端执行确认 ──
    btn.classList.remove('busy');
    btn.classList.add('pending');
    if (subEl) subEl.textContent = '等待车端确认…';

    const confirmed = await pollCommandResult(res.commandId || cmd);

    if (confirmed === true) {
      if (isToggle) btn.classList.toggle('on');
      toast(res.message || (label + '已执行'));
      settle('done', 950);
    } else if (confirmed === false) {
      toast(label + '车端执行失败');
      settle('fail', 1400);
    } else {
      // 未确认：既不是成功也不是失败，如实告知
      if (subEl) subEl.textContent = '未确认';
      toast(label + '已下发，但未在时限内确认车端执行');
      settle('unconfirmed', 2200);
    }
  } catch (err) {
    toast(label + '失败：' + err.message);
    settle('fail', 900);
  }
}

/* ═══════════════════════════════════════════════
   启动
   ═══════════════════════════════════════════════ */
bootstrap();

/* 滚动响应：下滑超过一屏的 6% 时，顶栏玻璃变实
   —— 对应 iOS 26 从 scrollEdge 到 inline 的过渡行为 */
let lastScrolled = false;
function syncScrollState() {
  const scrolled = window.scrollY > 24;
  if (scrolled !== lastScrolled) {
    lastScrolled = scrolled;
    document.body.classList.toggle('is-scrolled', scrolled);
  }
}
window.addEventListener('scroll', syncScrollState, { passive: true });
syncScrollState();

// 轮询：仅真实数据（live）模式下刷新，充电中 60 秒，否则 5 分钟；
// 模拟 / 回落状态下没有可刷新的后端，直接跳过
let pollTimer;
function schedulePoll() {
  clearTimeout(pollTimer);
  const interval = (state.status && state.status.isCharging) ? 60000 : 300000;
  pollTimer = setTimeout(async () => {
    if (state.mode === 'live') {
      await loadStatus();
      render();
    }
    schedulePoll();
  }, interval);
}
setTimeout(schedulePoll, 5000);

// 页面回到前台时刷新
document.addEventListener('visibilitychange', () => {
  // 未登录时不刷新 —— 没有可刷的数据，只会白打接口
  if (!document.hidden && isLoggedIn()) loadAll();
});
</script>
</body>
</html>
