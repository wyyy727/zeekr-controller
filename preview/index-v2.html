   两处口径不一致的话，最典型的表现就是"演示和真机的次数对不上"。 */
function mockCharge() {
  const pad = (v) => String(v).padStart(2, '0');
  const now = new Date();
  const kwhPool = [61.9, 42.3, 78.4, 30.6, 55.2, 88.1, 24.9, 67.5, 36.4, 52.8];
  /* 演示金额：按度数 × 电价现算，保证「金额 = 电量 × 单价」自洽。
     电价取 1.0~1.6 之间（快充略贵、交流便宜），看起来才像真的。
     真机上金额只能来自 OCR / 手工录入 —— 但演示数据要有数字才能看出样式，
     页面顶部有「演示数据」标记，不会被当成自己花的钱。 */
  const pricePool = [1.28, 1.45, 1.12, 1.62, 0.95, 1.35, 1.18, 1.55];
  /* 站名同理：真机上**只有 OCR 补录过才有**，官方流水链路里没有。
     演示里给几个"运营商·地点"样式的名字，是为了看列表标题换行和长度，
     名字都是通用地名，不对应任何真实场站。 */
  const stationPool = [
    '极氪极充·世纪公园', '特来电·张江高科', '星星充电·万象城',
    '国家电网·静安寺', '小桔充电·虹桥枢纽', '云快充·南京西路',
  ];
  const sessions = [];

  for (let m = 0; m < 10; m += 1) {
    const anchor = new Date(now.getFullYear(), now.getMonth() - m, 1);
    const year = anchor.getFullYear();
    const mon = anchor.getMonth() + 1;
    const lastDay = new Date(year, mon, 0).getDate();
    // 当月只回溯到"昨天"：演示数据里不该出现还没发生的充电
    const upper = m === 0 ? Math.max(1, now.getDate() - 1) : lastDay;
    const count = m === 0 ? Math.max(1, Math.min(4, Math.floor(now.getDate() / 8) + 1)) : 3 + ((m * 2) % 3);
    /* 留一个月**不补金额**：切到那个月就能看到「未补录」的样子 ——
       全都补满了，这个状态在演示里就永远看不到。 */
    const priced = m !== 2;

    for (let i = 0; i < count; i += 1) {
      const kwh = kwhPool[(m * 3 + i) % kwhPool.length];
      const isAc = (m + i) % 11 === 4;
      // 直流按 ~75 kW、交流按 ~7 kW 反推时长，保证"平均功率"这一列看起来合理
      const minutes = Math.round((kwh / (isAc ? 7 : 75)) * 60);
      const day = Math.max(1, Math.min(upper, 1 + ((m * 7 + i * 5) % upper)));
      const hour = [7, 12, 18, 21, 22][(m + i) % 5];
      const minute = [3, 15, 28, 41, 55][(m * 2 + i) % 5];
      const price = pricePool[(m + i) % pricePool.length];

      sessions.push({
        sessionId: `mock-${year}${pad(mon)}-${i}`,
        startTime: `${year}-${pad(mon)}-${pad(day)} ${pad(hour)}:${pad(minute)}:00`,
        durationMin: minutes,
        energyKwh: kwh,
        chargeType: isAc ? 'ac' : 'dc',
        stationName: stationPool[(m * 2 + i) % stationPool.length],
        amount: priced ? +(kwh * price).toFixed(2) : null,
        amountSource: priced ? 'ocr' : null,
      });
    }
  }
  sessions.sort((a, b) => (a.startTime < b.startTime ? 1 : -1));

  /* 月份清单：把"当月"换成 currentMonth，与接口保持一致 */
  const currentYm = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
  const seen = [...new Set(sessions.map((s) => s.startTime.slice(0, 7)))].sort().reverse();
  const months = seen.map((ym) => {
    const st = summarizeCharge(ym, sessions);
    return {
      yearMonth: ym === currentYm ? 'currentMonth' : ym,
      label: ym === currentYm ? '本月' : `${ym.slice(0, 4)}年${Number(ym.slice(5, 7))}月`,
      count: st.count,
      kwh: st.totalKwh,
      avgMinutes: st.avgMinutes,
      amount: st.amountTotal || 0,
      amountCount: st.amountCount,
      dcCount: st.dcCount,
      acCount: st.acCount,
    };
  });

  return { sessions, months };
}

/* 按月汇总（与后端 `_summarize_month` 同一口径）。
   `count` 含"电量缺失"的记录 —— 充了几次和充了多少度是两件事。 */
function summarizeCharge(ym, sessions) {
  const rows = sessions.filter((s) => String(s.startTime).slice(0, 7) === ym);
  let totalKwh = 0;
  let totalMinutes = 0;
  let dcCount = 0;
  let dcKwh = 0;
  let acCount = 0;
  let acKwh = 0;
  // 金额三口径与后端 `_summarize_month` 完全一致：
  // 真值（amountTotal / pricedKwh）/ 估算（单独计）/ 未补（unpriced*）
  let amountTotal = 0;
  let amountCount = 0;
  let pricedKwh = 0;
  let unpricedCount = 0;
  let unpricedKwh = 0;
  let estimatedCount = 0;
  let estimatedTotal = 0;

  rows.forEach((r) => {
    const kwh = Number(r.energyKwh) || 0;
    totalKwh += kwh;
    totalMinutes += Number(r.durationMin) || 0;
    if (r.chargeType === 'dc') { dcCount += 1; dcKwh += kwh; }
    if (r.chargeType === 'ac') { acCount += 1; acKwh += kwh; }

    if (r.amountSource === 'estimate') {
      estimatedCount += 1;
      estimatedTotal += Number(r.amount) || 0;
    } else if (r.amount != null) {
      amountCount += 1;
      amountTotal += Number(r.amount) || 0;
      pricedKwh += kwh;
    } else {
      unpricedCount += 1;
      unpricedKwh += kwh;
    }
  });

  return {
    yearMonth: ym,
    label: `${ym.slice(0, 4)}年${Number(ym.slice(5, 7))}月`,
    count: rows.length,
    totalKwh: +totalKwh.toFixed(1),
    dcCount,
    dcKwh: +dcKwh.toFixed(1),
    acCount,
    acKwh: +acKwh.toFixed(1),
    totalMinutes: Math.round(totalMinutes),
    avgKwh: rows.length ? +(totalKwh / rows.length).toFixed(1) : 0,
    avgMinutes: rows.length ? Math.round(totalMinutes / rows.length) : 0,
    avgPowerKw: totalMinutes > 0 ? +(totalKwh / (totalMinutes / 60)).toFixed(1) : null,
    amountTotal: amountCount ? +amountTotal.toFixed(2) : null,
    amountCount,
    // 单价分母只用**已补录金额对应的电量**：拿总电量去除会把没补录的算进去，单价凭空变低
    pricedKwh: +pricedKwh.toFixed(1),
    unitPrice: pricedKwh > 0 ? +(amountTotal / pricedKwh).toFixed(2) : null,
    unpricedCount,
    unpricedKwh: +unpricedKwh.toFixed(1),
    // 估算与真值分开记：混算会让"每度多少钱"变成第三种数字
    estimatedTotal: estimatedCount ? +estimatedTotal.toFixed(2) : null,
    estimatedCount,
    pendingPayments: 0,
    unmatchedPayments: 0,
    records: rows,
  };
}

/* 生成一条演示站点。
   存在的意义：只有 4 个站时，界面上「折叠 6 条 / 展开全部 / 内层滚动 / 分页」
   全都看不出来 —— 没数据就没法验证交互。所以把演示数据扩到能翻三页的量。
   字段结构照抄真实接口：`price: null` 用来表现"取不到价格 ≠ 免费"。 */
function demoStation(index, name, distanceKm, opt) {
  const bearing = ((index * 47) % 360) * Math.PI / 180;
  const latOffset = (distanceKm / 111) * Math.cos(bearing);
  const lngOffset = (distanceKm / (111 * Math.cos(31.23 * Math.PI / 180))) * Math.sin(bearing);
  const electric = Math.round(opt.price * 0.6 * 100) / 100;
  const service = Math.round((opt.price - electric) * 100) / 100;

  return {
    stationId: `mock-station-${index}`,
    name,
    address: `演示路 ${index} 号`,
    lat: Number((31.2304 + latOffset).toFixed(6)),
    lng: Number((121.4737 + lngOffset).toFixed(6)),
    distanceKm,
    availableCount: opt.available,
    totalCount: opt.total,
    ableDcCount: Math.min(opt.available, opt.dc),
    dcCount: opt.dc,
    ableAcCount: Math.max(0, opt.available - Math.min(opt.available, opt.dc)),
    acCount: opt.ac,
    selfOperate: !!opt.self,
    score: opt.score == null ? 4.0 : opt.score,
    tags: ['演示数据'],
    price: opt.price == null ? null : {
      totalPrice: opt.price,
      feeElectric: electric,
      serviceFee: service,
      currentPeriod: '00:00-23:59',
      periods: [{ timeFrame: '00:00-23:59', electric, service, total: opt.price }],
      parkingFee: opt.parkFree ? '充电期间免费' : '按停车场标准收费',
      parkFree: !!opt.parkFree,
      holdFee: false,
      feeDesc: '演示数据：全天一口价',
    },
  };
}

/* ═══════════════════════════════════════════════
   工具
   ═══════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);

function fmt(v, d = 0, fallback = '--') {
  /* 判据用 Number.isFinite 而不是 Number.isNaN：后者对字符串恒 false，
     于是 Number('--').toFixed() 会渲染出字面量 "NaN"；溢出成 Infinity 也一并挡掉。 */
  if (v === null || v === undefined || v === '') return fallback;
  const n = Number(v);
  if (!Number.isFinite(n)) return fallback;
  return n.toFixed(d);
}
function fmtDist(km) {
  // 里程一律显示原始公里数 —— 不做「万」换算：15545 被压成「1.6 万」后
  // 既有精度损失，也无法比对官方 App 里的读数。
  if (km === null || km === undefined || Number.isNaN(km)) return '--';
  return Math.round(Number(km)).toLocaleString('en-US') + ' km';
}
function fmtDuration(min) {
  if (!min || min <= 0) return '--';
  const t = Math.round(min);
  if (t < 60) return t + ' 分钟';
  const h = Math.floor(t / 60), m = t % 60;
  return m === 0 ? h + ' 小时' : h + ' 小时 ' + m + ' 分';
}
/* 时间戳 → HH:MM。用于「同步于 14:07」这类"今天几点"的场景，
   不需要日期 —— 跨天的情况已经由"未同步/同步于"这类文案提示过了。 */
function clockOf(ts) {
  const d = new Date(Number(ts));
  if (Number.isNaN(d.getTime())) return '--';
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtTime(ts) {
  if (!ts) return '--';
  const d = new Date(String(ts).replace(/-/g, '/'));
  if (Number.isNaN(d.getTime())) return String(ts).slice(5, 16);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (sameDay) return '今天 ' + hh + ':' + mm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm;
}
function fmtMonth(ym) {
  const p = String(ym).split('-');
  return p.length === 2 ? parseInt(p[1], 10) + ' 月' : ym;
}
/* 电量配色阈值（中国传统色）：
   ≥50%  青碧 #16B89A —— 电量充裕
   30~50% 藤黄 #FFB020 —— 电量中等，建议留意
   <30%  朱砂 #E5483B —— 电量偏低，需尽快补能 */
function socColor(soc) {
  if (soc < 30) return 'var(--zhu-sha)';
  if (soc < 50) return 'var(--teng-huang)';
  return 'var(--qing-bi)';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* 给请求补上 API 令牌。调试台里令牌可在「连接」区填写，
   也可用 ?token=xxx 打开本页带入；留空则不额外加头。 */
function withAuth(opts) {
  const merged = Object.assign({}, opts || {});
  merged.headers = Object.assign({}, (opts && opts.headers) || {});

  /* 字符串 body 一律按 JSON 发。
     fetch 对字符串 body 的默认 Content-Type 是 `text/plain;charset=UTF-8`，
     而 FastAPI 的 `Body(...)` 只解析 application/json —— 少了这个头，POST 会在
     进入函数之前就被判 **422**，报错是 `{"type":"dict_type","msg":"Input should be
     a valid dictionary"}`，看起来像报文格式写错了，极易误判。
     FormData（截图上传）不是字符串，不会被加这个头，multipart 边界照常。 */
  if (typeof merged.body === 'string' && !merged.headers['Content-Type']) {
    merged.headers['Content-Type'] = 'application/json';
  }

  if (API_TOKEN) merged.headers.Authorization = 'Bearer ' + API_TOKEN;
  return merged;
}

/* ── 请求记录 ──
   调试台的核心诉求之一是"看有没有报错"，所以每一次请求都要留痕：
   方法、路径、状态码、耗时、以及**服务端返回的原始 detail**。
   旧实现只抛「HTTP 400」，把服务端给的原因丢掉了，等于把最有用的信息扔了。 */
const dbgLog = [];
let dbgSeq = 0;

function dbgRecord(entry) {
  entry.id = ++dbgSeq;
  entry.at = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  dbgLog.push(entry);
  if (dbgLog.length > 300) dbgLog.shift();
  if (typeof renderDebugPanel === 'function') renderDebugPanel();
}

/* 地图缩略图：<img> 不能带请求头，所以**不能**把令牌拼进 URL ——
   那会留在浏览历史、Referer 与任何中间代理日志里。
   改成先 fetch（带和 api() 同样的 Authorization 头）拿 blob，再挂 objectURL，
   URL 里只有一个路径。令牌放在请求头里，不进地址栏。 */
const AUTH_IMG_CACHE = new Map();   // path → objectURL；切 tab 回来不必重取
function authImgTag(path, cls, alt) {
  const cached = AUTH_IMG_CACHE.get(path);
  return `<img class="${cls}" alt="${alt}" data-authsrc="${esc(path)}"${
    cached ? ` src="${cached}"` : ' style="display:none"'}>`;
}
async function hydrateAuthImages() {
  const imgs = document.querySelectorAll('img[data-authsrc]');
  for (const el of imgs) {
    const path = el.dataset.authsrc;
    if (!path || el.dataset.authdone === '1') continue;
    el.dataset.authdone = '1';
    const cached = AUTH_IMG_CACHE.get(path);
    if (cached) { el.src = cached; el.style.display = ''; continue; }
    try {
      const headers = {};
      if (API_TOKEN) headers.Authorization = 'Bearer ' + API_TOKEN;
      const res = await fetch(API_SOURCE + path, { headers });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const url = URL.createObjectURL(await res.blob());
      AUTH_IMG_CACHE.set(path, url);
      if (el.isConnected) { el.src = url; el.style.display = ''; }
    } catch (e) {
      console.warn('地图缩略图加载失败', e);
      el.style.display = 'none';
    }
  }
}

/* ── 全局请求指示器 ──
   任何接口开始 → 计数 +1，结束 → −1；计数 > 0 就点亮页面顶部那条 2px 进度条。
   放在 api() 这一层，车况 / 行程 / 充电 / 设置**全都自动有反馈**，
   不用每个页面各写一份 loading 状态（写多了必然漏，比如筛选时就没有）。 */
let NET_INFLIGHT = 0;
function netBegin() {
  NET_INFLIGHT += 1;
  const el = document.getElementById('netBar');
  if (el) el.classList.add('on');
}
function netEnd() {
  NET_INFLIGHT = Math.max(0, NET_INFLIGHT - 1);
  if (NET_INFLIGHT > 0) return;   // 还有请求在飞，别提前收
  const el = document.getElementById('netBar');
  if (el) el.classList.remove('on');
}

/* 对外只有一个 api()，真正的实现在 apiInner()。
   这样包一层 try/finally 就能保证**抛异常也会收掉进度条** ——
   失败路径上忘了收，进度条会一直转，比没有更糟。 */
async function api(path, opts) {
  netBegin();
  try {
    return await apiInner(path, opts);
  } finally {
    netEnd();
  }
}

async function apiInner(path, opts) {
  // 模拟数据模式：不发起任何网络请求（调试台默认为 false）
  // 未登录前不调任何数据接口。live 模式下服务端要求登录态，调了只会失败，
  // 还会把服务端日志刷满无意义的报错 —— 登录相关的几个接口走 apiNoMock()，
  // 不受这里限制（否则连"查登录状态"都发不出去）。
  if (!isLoggedIn()) throw new Error('未登录：请先在「设置」里登录极氪账号');
  if (state.mode === 'mock') throw new Error('mock 模式：不访问网络');

  if (DEMO && path === '/api/vehicle/command') {
    const cmd = JSON.parse((opts && opts.body) || '{}').command;
    await new Promise((r) => setTimeout(r, 620));   // 模拟下发耗时
    applyDemoCommand(cmd);
    dbgRecord({ method: 'POST', path, status: 'DEMO', ms: 620, ok: true, detail: '本地模拟，未发请求' });
    return { success: true, message: CTRL_LABELS[cmd] || '指令已下发' };
  }

  const method = (opts && opts.method) || 'GET';
  const t0 = performance.now();
  let res;

  const t = withTimeout(15000);
  try {
    res = await fetch(API_SOURCE + path, withAuth(opts), t.signal ? { signal: t.signal } : undefined);
  } catch (err) {
    if (t.done) t.done();
    if (err && (err.name === 'TimeoutError' || err.name === 'AbortError')) {
      dbgRecord({ method, path, status: '超时', ms: Math.round(performance.now() - t0), ok: false, detail: '15 秒无响应' });
      throw new Error('连不上后端 ' + API_SOURCE + '：请求超时（15 秒无响应）');
    }
    // 网络层失败（后端没起、地址写错、被 CORS 拦下）—— 这类原因最值得留全
    const msg = String((err && err.message) || err);
    dbgRecord({ method, path, status: '网络失败', ms: Math.round(performance.now() - t0), ok: false, detail: msg });
    throw new Error('连不上后端 ' + API_SOURCE + '：' + msg);
  }

  if (t.done) t.done();
  const ms = Math.round(performance.now() - t0);
  const text = await res.text();
  let json = null;
  try { json = JSON.parse(text); } catch { /* 非 JSON 响应（如 404 的 HTML） */ }

  const serverMsg = json
    ? (json.error || (typeof json.detail === 'string' ? json.detail : (json.detail ? JSON.stringify(json.detail) : ''))
       || (json.success === false ? '服务端返回 success=false' : ''))
    : text.slice(0, 300);

  dbgRecord({
    method, path, status: res.status, ms,
    ok: res.ok && (!json || json.success !== false),
    detail: serverMsg || '',
    body: text.slice(0, 4000),
  });

  if (res.status === 401) {
    throw new Error('服务端要求 API 令牌：请在调试栏「令牌」输入框填写后重新连接');
  }
  if (!res.ok) {
    throw new Error('HTTP ' + res.status + (serverMsg ? '：' + serverMsg : ''));
  }
  if (!json) throw new Error('响应不是 JSON：' + text.slice(0, 120));
  if (!json.success) throw new Error(json.error || '服务端返回失败');
  return json.data;
}

/* 演示模式下让车况随指令联动，开关状态才有真实感 */
function applyDemoCommand(cmd) {
  const s = state.status;
  if (!s) return;
  switch (cmd) {
    case 'lock':      s.isLocked = true; break;
    case 'unlock':    s.isLocked = false; break;
    case 'climateOn': s.climateOn = true; break;
    case 'climateOff':s.climateOn = false; break;
    case 'closeWindows':
      s.windows = { driver: false, passenger: false, rearLeft: false, rearRight: false };
      break;
    case 'chargeStart': s.isCharging = true; break;
    case 'chargeStop':  s.isCharging = false; break;
  }
  const d = new Date();
  state.lastRefresh = String(d.getHours()).padStart(2, '0') + ':' +
                      String(d.getMinutes()).padStart(2, '0');
}

/* ═══════════════════════════════════════════════
   电量环形
   ═══════════════════════════════════════════════ */
function socRing(soc, charging, size = 132, lw = 11) {
  const r = (size - lw) / 2;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(100, soc));
  const offset = c * (1 - pct / 100);
  const color = charging ? 'var(--dian-qing)' : socColor(pct);

  // 低电量分级：<30% 高危、30~50% 提醒（充电中不触发，此时主色为蓝）
  const level = charging ? null : (pct < 30 ? 'low' : (pct < 50 ? 'mid' : null));
  // 低电量时环体加呼吸脉冲，并用同色光晕强化警示
  const ringCls = ['ring-fg', level === 'low' ? 'ring-pulse' : ''].filter(Boolean).join(' ');

  return `
  <div class="ring-wrap${level ? ' ring-wrap--' + level : ''}" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${lw}"/>
      <circle class="${ringCls}" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${lw}"
              stroke="${color}"
              stroke-dasharray="${c.toFixed(2)}"
              stroke-dashoffset="${offset.toFixed(2)}"/>
    </svg>
    <div class="ring-center">
      <div class="ring-num" style="color:${color}">
        ${Math.round(pct)}<span class="pct">%</span>
      </div>
      <div class="ring-label">${charging ? '充电中' : '剩余电量'}</div>
    </div>
    ${charging ? `<div class="ring-bolt">${SVG.bolt}</div>` : ''}
    ${level === 'low' ? `<div class="ring-alert">电量偏低</div>` : ''}
  </div>`;
}

/* ═══════════════════════════════════════════════
   折线图（Canvas 手绘，零依赖）
   ═══════════════════════════════════════════════ */
function drawLineChart(canvas, points, opts = {}) {
  /* opts:
       height      画布高度
       color       折线/数据点颜色
       fillTop     面积渐变起始色
       decimals    数值保留位数
       showValue   是否在点上标数值（默认关，开了会给顶部留出空间）
       xLabelStep  每隔几个点标一个日期（不传则自动，最多约 7 个）
       highlight   高亮第几个点（其余降到 34% 透明度）——
                   图里有全部月份、上方数字只有所选月份时，用它对齐"看的是哪根"
       series2     第二根轴：{ values, color, decimals }。与主系列共用横轴、
                   独立纵轴（在右侧），用来叠一条量纲不同的折线（如"单次时长"） */
  const dpr = window.devicePixelRatio || 1;
  const showValue = opts.showValue === true;
  const cssH = opts.height || 160;

  /* 可横向滚动：每个数据点固定占 minPointWidth，画布比容器宽时由外层 .chart-scroll 滚动。
     这样 30 个点也各有自己的位置，日期与数值不会挤在一起。 */
  const scrollable = opts.scrollable === true;
  const parentW = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
  const availW = parentW || canvas.clientWidth || 320;
  const perPoint = opts.minPointWidth || 56;
  const cssW = scrollable
    ? Math.max(availW, points.length * perPoint + 46)
    : (canvas.clientWidth || 320);
  if (scrollable) canvas.style.width = cssW + 'px';

  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.height = cssH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  /* 第二根轴的刻度要占右侧一列，否则右轴数字会被裁掉 */
  const padL = 34;
  const padR = opts.series2 ? 46 : 12;
  const padT = showValue ? 26 : 14;
  const padB = 26;
  const w = cssW - padL - padR;
  const h = cssH - padT - padB;

  const vals = points.map((p) => p.v).filter((v) => v !== null && !Number.isNaN(v));
  if (!vals.length) return;

  let min = Math.min(...vals), max = Math.max(...vals);
  if (max === min) { max += 1; min -= 1; }

  if (opts.niceMax) {
    /* 顶部刻度取「好看的整数」再加 10% 余量：峰值 45 → 纵轴到 55，
       否则柱子几乎顶到框顶，两张图形状看着一模一样、也读不出差距。 */
    const exp = Math.floor(Math.log10(Math.max(max, 1)));
    const base = Math.pow(10, exp);
    const ratio = max / base;
    const step = ratio <= 1 ? 1 : ratio <= 2 ? 2 : ratio <= 5 ? 5 : 10;
    max = step * base * 1.1;
    // 里程不会为负：底部直接压到 0，别出现 -5 这种刻度
    min = min >= 0 ? 0 : min - (max - min) * 0.08;
  } else {
    const span = max - min;
    min -= span * 0.12;
    max += span * 0.12;
  }

  const stroke = opts.color || '#1C6FA8';
  const gridColor = 'rgba(128,128,128,.16)';
  const textColor = opts.textColor || 'rgba(128,128,128,.9)';
  const decimals = opts.decimals ?? 0;

  const x = (i) => padL + (points.length === 1 ? w / 2 : (i / (points.length - 1)) * w);
  const y = (v) => padT + h - ((v - min) / (max - min)) * h;

  /* 标注抽稀：30 天时 30 个数值会糊成一片，让数值与日期共用同一组抽稀下标 */
  const step = opts.xLabelStep || Math.max(1, Math.ceil(points.length / 7));
  const marks = [];
  for (let i = 0; i < points.length; i += step) marks.push(i);
  if (marks[marks.length - 1] !== points.length - 1) marks.push(points.length - 1);

  // 横向网格 + Y 轴刻度
  ctx.font = '10px -apple-system, sans-serif';
  ctx.fillStyle = textColor;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= 3; i++) {
    const gy = padT + (h / 3) * i;
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(padL + w, gy);
    ctx.stroke();

    const gv = max - ((max - min) / 3) * i;
    ctx.fillText(gv.toFixed(decimals), padL - 6, gy);
  }

  if (opts.bar) {
    /* 柱状：柱宽随可用宽度自适应，顶部 4px 圆角，颜色由深到浅过渡 */
    const barW = Math.max(6, Math.min(26, (w / Math.max(points.length, 1)) * 0.5));
    const radius = Math.min(4, barW / 2);
    const baseline = padT + h;

    points.forEach((p, i) => {
      if (p.v === null || Number.isNaN(p.v)) return;
      const top = y(p.v);
      const px = x(i) - barW / 2;

      const barGrad = ctx.createLinearGradient(0, top, 0, baseline);
      barGrad.addColorStop(0, stroke);
      barGrad.addColorStop(1, opts.fillTop || 'rgba(124,92,252,.28)');

      /* 非高亮月份压暗：图里画的是全部月份，上方大数只有所选月份，
         不标出来会让人以为大数对应的是最右边那根。 */
      if (opts.highlight != null) ctx.globalAlpha = opts.highlight === i ? 1 : 0.34;

      ctx.beginPath();
      ctx.moveTo(px, baseline);
      ctx.lineTo(px, top + radius);
      ctx.quadraticCurveTo(px, top, px + radius, top);
      ctx.lineTo(px + barW - radius, top);
      ctx.quadraticCurveTo(px + barW, top, px + barW, top + radius);
      ctx.lineTo(px + barW, baseline);
      ctx.closePath();
      ctx.fillStyle = barGrad;
      ctx.fill();
      if (opts.highlight != null) ctx.globalAlpha = 1;
    });
  } else {
    // 面积渐变（颜色跟随折线，两张图各自成一套色）
    const grad = ctx.createLinearGradient(0, padT, 0, padT + h);
    grad.addColorStop(0, opts.fillTop || 'rgba(28,111,168,.28)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath();
    points.forEach((p, i) => {
      const py = y(p.v ?? min);
      i === 0 ? ctx.moveTo(x(i), py) : ctx.lineTo(x(i), py);
    });
    ctx.lineTo(x(points.length - 1), padT + h);
    ctx.lineTo(x(0), padT + h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // 折线
    ctx.beginPath();
    points.forEach((p, i) => {
      const py = y(p.v ?? min);
      i === 0 ? ctx.moveTo(x(i), py) : ctx.lineTo(x(i), py);
    });
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  /* ── 第二系列（右轴）─────────────────────────────
     量纲不同 ⇒ 必须两套刻度，硬套左轴会把这条线压成一条贴底的直线。
     顶端留 35% 余量：主系列柱顶的数值标注在 ~91% 高度，
     这条线的峰值落在 ~74%，两组数字才不会叠在一起。
     `null` 处断开（MoveTo 重开一段）—— 画成 0 会读成"这个月充得特别快"。 */
  const s2 = opts.series2;
  if (s2 && Array.isArray(s2.values) && s2.values.length === points.length) {
    const nums = s2.values.filter((v) => v !== null && !Number.isNaN(v));
    if (nums.length) {
      ctx.save();
      const max2 = Math.max(...nums, 1) * 1.35;
      const y2 = (v) => padT + h - (v / max2) * h;
      const color2 = s2.color || '#E8A33D';

      ctx.strokeStyle = color2;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      let started = false;
      s2.values.forEach((v, i) => {
        if (v === null || Number.isNaN(v)) { started = false; return; }
        if (started) ctx.lineTo(x(i), y2(v));
        else { ctx.moveTo(x(i), y2(v)); started = true; }
      });
      ctx.stroke();

      ctx.fillStyle = color2;
      s2.values.forEach((v, i) => {
        if (v === null || Number.isNaN(v)) return;
        ctx.beginPath();
        ctx.arc(x(i), y2(v), 2.6, 0, Math.PI * 2);
        ctx.fill();
      });

      // 右轴刻度：与左轴共用同一组网格线，读数才对得上
      ctx.font = '10px -apple-system, sans-serif';
      ctx.fillStyle = color2;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (let i = 0; i <= 3; i += 1) {
        const gy = padT + (h / 3) * i;
        ctx.fillText(((max2 / 3) * (3 - i)).toFixed(s2.decimals ?? 1), padL + w + 6, gy);
      }
      ctx.restore();
    }
  }

  // 数值标注（柱顶 / 点上方共用）
  ctx.font = '9.5px -apple-system, sans-serif';
  points.forEach((p, i) => {
    if (p.v === null || Number.isNaN(p.v)) return;
    const px = x(i);
    const py = y(p.v);

    // 折线模式才画数据点；柱状模式本身就有形状，再加圆点会脏
    if (!opts.bar) {
      ctx.beginPath();
      ctx.arc(px, py, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = stroke;
      ctx.fill();
    }

    if (showValue && (points.length <= 12 || marks.indexOf(i) !== -1)) {
      ctx.fillStyle = stroke;
      ctx.textBaseline = 'bottom';
      ctx.textAlign = i === 0 ? 'left' : (i === points.length - 1 ? 'right' : 'center');
      ctx.fillText(Number(p.v).toFixed(decimals), px, py - 6);
    }
  });

  // X 轴日期（抽稀下标已在上面算好，首尾必标）
  ctx.fillStyle = textColor;
  ctx.textBaseline = 'top';
  ctx.font = '9.5px -apple-system, sans-serif';
  marks.forEach((i) => {
    const label = points[i].label;
    if (!label) return;
    ctx.textAlign = i === 0 ? 'left' : (i === points.length - 1 ? 'right' : 'center');
    ctx.fillText(label, x(i), padT + h + 8);
  });

  /* 可滚动时默认定位到最右：最新一天（今天）始终在视野里，
     不用手动滑到底才看得到当前数据。 */
  if (scrollable && canvas.parentElement) {
    const box = canvas.parentElement;
    box.scrollLeft = box.scrollWidth;
  }
}

   视图：车况
   ═══════════════════════════════════════════════ */
/* ── 车辆位置卡 ────────────────────────────────────────────
   三条底线：
   1. **位置不是实时的**：车静止时网关不更新坐标（实测 15 条快照只有 3 个位置点），
      标题右侧必须写出上报时间，否则会被当成"车现在就在这"。
   2. **没配地图 key ≠ 没有位置**：照常显示上报时间与提示，只是没有地址与地图，
      不要整块消失，也不要拿一句"服务异常"糊过去。
   3. 地图图片取不到就隐藏（onerror），地址仍然可读 —— 位置卡的价值在文字。
   ⚠️ 经纬度不展示：`31.2035, 121.5858` 这类数字对人没有信息量，
      判断"车在哪"只能靠地址与地图；精确坐标摆在屏幕上是多余暴露。 */
function vehicleLocationCard() {
  const loc = state.location;

  if (!loc) {
    return `<div class="card">
      <div class="card-title"><span>车辆位置</span></div>
      <div class="loc-note">正在获取位置…</div>
    </div>`;
  }

  if (!loc.available) {
    return `<div class="card">
      <div class="card-title"><span>车辆位置</span></div>
      <div class="loc-note">${esc(loc.reason || '车辆尚未上报位置')}</div>
    </div>`;
  }

  const addr = loc.address || null;
  /* 优先用 recommend：它是「中钢国际广场」这种好认的描述，
     标准地址（省市区路门牌）放在下面一行补充。 */
  const title = addr ? (addr.recommend || addr.address) : null;
  /* 经纬度**不展示**：31.2035, 121.5858 这种数字对人没有任何信息量，
     想判断"车在哪"只能靠地址与地图；反而把精确坐标摆在屏幕上是多余的暴露。 */

  /* 只有服务端确认"有 key"且当前是真实数据模式才请求图片：
     演示模式不联网，也不该白蹭一次配额。 */
  const showMap = loc.mapAvailable === true && state.mode === 'live';

  return `<div class="card">
    <div class="card-title">
      <span>车辆位置</span>
      <span style="font-size:11px;font-weight:400;color:var(--text-3)">
        ${loc.reportedAt ? '最后上报 ' + esc(fmtTime(loc.reportedAt)) : ''}
      </span>
    </div>
    ${showMap
      ? authImgTag('/api/vehicle/location/map.png?width=600&height=260&zoom=16', 'loc-map', '车辆位置地图')
      : ''}
    <div class="loc-addr">${title ? esc(title) : (loc.mapAvailable === true ? '地址暂时取不到' : '未配置地图服务')}</div>
    ${addr && addr.address && addr.recommend && addr.recommend !== addr.address
      ? `<div class="loc-note">${esc(addr.address)}</div>` : ''}
    ${!addr
      ? `<div class="loc-note">${loc.mapAvailable === true
            ? '地图服务已配置，但这次没取到地址（可能是第三方额度用完或网络问题）。稍后会自动重试。'
            : '尚未配置腾讯地图 key，只显示「最后上报」时间。在服务端 <code>.env</code> 填入 <code>TENCENT_MAP_KEY</code> 并重启，即可显示地址与地图图。'}</div>`
      : ''}
    <div class="loc-note">位置取自车辆最后一次上报，车辆移动后可能不会立即更新。</div>
  </div>`;
}

/* 车控按钮构造器：**必须放顶层**。
   原来它们定义在 renderDashboard 内部，靠闭包拿 `cmdsOn`；
   现在车控页也要用同一份，留在函数里会直接 ReferenceError。 */
  const ctrlBtn = (o) => {
    // 原来靠闭包取 renderDashboard 的局部变量，挪到顶层后自己从 state 取
    const cmdsOn = state.allowCommands;
    const cls = [
      'ctrl',
      `ctrl--${o.kind || 'action'}`,
      o.on ? 'on' : '',
      o.danger ? 'danger' : '',
      o.wide ? 'wide' : '',
    ].filter(Boolean).join(' ');
    const sub = o.sub ? `<span class="ctrl-sub">${o.sub}</span>` : '';
    // 两种禁用来源：① 该指令当前不适用（如未插枪不能开充）；② 车控总开关关闭。
    // 用同一个 `disabled` 属性 —— 视觉（.ctrl[disabled] 半透明）与行为一致，
    // 不必再造一套"半禁用"状态。
    return `
    <button class="${cls}" data-cmd="${o.cmd}" data-label="${o.label}"
            aria-pressed="${o.kind === 'toggle' ? String(!!o.on) : 'false'}"
            ${(o.disabled || !cmdsOn) ? 'disabled' : ''}>
      <span class="ico">${o.icon}</span>
      <span class="ctrl-txt">${o.label}${sub}</span>
      <span class="ctrl-spin" aria-hidden="true"></span>
    </button>`;
  };

  /* 带能力门控的车控按钮：车辆不支持该能力时**整格不渲染**。
     旧版把 18 条指令全列出来（其中 10 条未经真车验证），点了只会静默失败 ——
     先问车支持什么，能一次性消掉这批死按钮。 */
  const capBtn = (key, o) => (cap(key) ? ctrlBtn(o) : '');

/* 快捷车控卡：车况页与「车控」页**共用同一份 markup**。
   两边各写一遍必然漂移 —— 改了启用/禁用文案忘改另一处，是这类卡片最常见的 bug。

   卡内用到的四个状态在这里各自现取，不再依赖 renderDashboard 的局部变量：

function quickControlsCard() {

        })}

/* 车控页：只放快捷车控卡。
   从车况页拆出来的理由 —— 车况页已经有电量 / 胎压 / 车身状态 / 位置四块，
   而车控是高频操作，每次都要滑到最底才能按；给它一个独立入口更直接。 */
function renderControls() {
  if (!state.status) {
    if (state.statusLoading) {
      return `<div class="v2-screen">
        <div class="v2-card"><div class="v2-skel-row" style="width:60%"></div>
          <div class="v2-skel-row" style="width:40%"></div></div></div>`;
    }
    return `<div class="v2-screen">
      <div class="v2-card"><div class="v2-empty">
        <div class="t">车辆数据没有读到</div>
        <div class="d">${esc(state.statusError ? '后端可能正在重启，或登录状态已失效' : '请确认服务已启动、地址配置正确')}</div>
        <button class="v2-btn ghost" id="statusRetryBtn">重试</button>
      </div></div></div>`;
  }

  const st = state.status;
  const cmdsOn = state.allowCommands;
  const charging = st.isCharging === true;
  const locked = st.isLocked === true;
  const climateOn = st.climateOn === true;
  const connected = state.mode === 'live';

  const head = `<div class="v2-head">
      <div class="v2-head-l">
        <span class="${connected ? 'v2-badge-ok' : 'v2-badge-off'}">${connected ? '已连接' : '未连接'}</span>
        ${!cmdsOn ? '<span class="v2-tlabel">已禁用</span>' : ''}
      </div>
      ${v2SourcePill()}
    </div>`;

  const ic = (name, color) => `<svg class="v2-ci" style="color:${color}"><use href="#${name}"/></svg>`;

  const btn = (o) => {
    const cls = ['ctrl', 'v2-ctrl', o.on ? 'on' : '', o.wide ? 'v2-ctrl--wide' : ''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-cmd="${o.cmd}" data-label="${esc(o.label)}"
        aria-pressed="${o.kind === 'toggle' ? String(!!o.on) : 'false'}"
        ${(o.disabled || !cmdsOn) ? 'disabled' : ''}>
        ${ic(o.icon, o.color)}
        <span class="v2-ctrl-t">${esc(o.label)}</span>
        <svg class="v2-ck" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.6l4 4 8-9"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="ctrl-spin" aria-hidden="true"></span>
      </button>`;
  };

  const capBtn = (key, o) => (cap(key) ? btn(o) : '');

  const items = [
    capBtn('doorLock', {
      cmd: locked ? 'unlock' : 'lock', label: '车锁', icon: 'ctrl-lock',
      color: '#6742E8', kind: 'toggle', on: locked,
    }),
    capBtn('climate', {
      cmd: climateOn ? 'climateOff' : 'climateOn', label: '空调', icon: 'ctrl-climate',
      color: '#0E96CE', kind: 'toggle', on: climateOn,
    }),
    capBtn('defrost', { cmd: 'defrost', label: '前除霜', icon: 'ctrl-defrost-front', color: '#C4862A', kind: 'toggle' }),
    capBtn('wheelHeat', { cmd: 'wheelHeat', label: '方向盘加热', icon: 'ctrl-steering-heat', color: '#E0607C', kind: 'toggle' }),
    capBtn('seatHeat', { cmd: 'seatHeat', label: '座椅加热', icon: 'ctrl-seat-heat', color: '#E0607C', kind: 'toggle' }),
    capBtn('seatVent', { cmd: 'ventSeat', label: '座椅通风', icon: 'ctrl-seat-vent', color: '#0E96CE', kind: 'toggle' }),
    btn({ cmd: 'flash', label: '闪灯', icon: 'ctrl-flash', color: '#C4862A', kind: 'action' }),
    btn({ cmd: 'honk', label: '鸣笛', icon: 'ctrl-horn', color: '#C4862A', kind: 'action' }),
    capBtn('window', { cmd: 'closeWindows', label: '关车窗', icon: 'ctrl-window-close', color: '#0E96CE', kind: 'action' }),
    btn({
      cmd: charging ? 'chargeStop' : 'chargeStart',
      label: charging ? '结束充电' : '开始充电', icon: 'ctrl-charge-start', color: '#12A06B',
      kind: 'action', disabled: !charging && !st.isPlugged,
    }),
    capBtn('sentinel', { cmd: 'sentinel', label: '哨兵', icon: 'ctrl-sentry', color: '#C4862A', kind: 'toggle' }),
    capBtn('travelPlan', { cmd: 'tripPlan', label: '出行规划', icon: 'ctrl-trip-plan', color: '#12A06B', kind: 'scene' }),
    btn({ cmd: 'carFinder', label: '寻车', icon: 'ctrl-find-car', color: '#C4862A', kind: 'scene', wide: true }),
    btn({ cmd: 'refresh', label: '立即刷新', icon: 'ctrl-refresh', color: '#6742E8', kind: 'scene' }),
  ].filter(Boolean);

  /* 这一行是「车辆不支持」的能力：按设计画成灰按钮而不是藏掉 ——
     藏掉会让人以为 App 没做，画出来才知道是车不给。点击不出指令。 */
  const offItem = (label, icon) => `<button class="v2-ctrl off" disabled>
      ${ic(icon, '#A8AFBE')}<span class="v2-ctrl-t">${esc(label)}</span>
    </button>`;
  const offRow = `<div class="v2-ctrl-grid--off">
      ${offItem('天窗', 'ctrl-sunroof')}
      ${offItem('后备箱', 'ctrl-trunk')}
      ${offItem('前备箱', 'ctrl-frunk')}
      ${offItem('驾驶模式', 'ctrl-drive-mode')}
