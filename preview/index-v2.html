  const hints = [];
  if (!cmdsOn) hints.push('在「设置」中开启控制指令开关后可用');
  if (cmdsOn && state.health && state.health.allowCommands === false) {
    hints.push('服务端也没有开启车控，即便本开关打开，指令仍会被拒绝');
  }

  return `<div class="v2-screen">${head}
    <div class="v2-ctrl-grid">${items.join('')}</div>
    ${offRow}
    ${hints.map((h) => `<div class="v2-note${h.startsWith('服务端') ? ' warn' : ''}">${esc(h)}</div>`).join('')}
    ${v2Foot('')}
  </div>`;
}
function v2LocCard() {
  const loc = state.location;
  const head = `<div class="v2-loc-head"><span class="t">车辆位置</span>${loc && loc.reportedAt
    ? `<span class="time">最后上报 ${esc(fmtTime(loc.reportedAt))}</span>` : ''}</div>`;

  if (!loc) return `<div class="v2-card v2-loc">${head}<div class="v2-loc-addr">正在获取位置…</div></div>`;
  if (!loc.available) return `<div class="v2-card v2-loc">${head}<div class="v2-loc-addr">${esc(loc.reason || '车辆尚未上报位置')}</div></div>`;

  const addr = loc.address || null;
  const line = addr ? (addr.recommend || addr.address) : null;
  const sub = (addr && addr.recommend && addr.address) ? addr.address : null;
  const showMap = loc.mapAvailable === true && state.mode === 'live';

  /* 规格 §7.4 的四种形态：A 正常 / B 有 key 但没取到地址 / C 没配 key 或非 live / D 图片加载失败 */
  let tip = '位置取自车辆最后一次上报，车辆移动后可能不会立即更新。';
  let mainText = line;
  if (!line) {
    mainText = loc.mapAvailable === true ? '地址暂时取不到' : '未配置地图服务';
    tip = loc.mapAvailable === true
      ? '地图服务已配置，但这次没取到地址（可能是第三方额度用完或网络问题）。稍后会自动重试。'
      : '尚未配置腾讯地图 key，只显示「最后上报」时间。在服务端 .env 填入 TENCENT_MAP_KEY 并重启，即可显示地址与地图图。';
  }

  return `<div class="v2-card v2-loc">${head}
    ${showMap ? authImgTag('/api/vehicle/location/map.png?width=600&height=260&zoom=16', 'v2-loc-map', '车辆位置地图') : ''}
    <div class="v2-loc-addr${line ? '' : ' dim'}">${esc(mainText)}</div>
    ${sub ? `<div class="v2-loc-sub">${esc(sub)}</div>` : ''}
    <div class="v2-loc-tip">${esc(tip)}</div>
  </div>`;
}

/* ── v2 通用件：数据来源 pill（S1）、月份 chip、页脚（S11） ── */
function v2SourcePill() {
  if (!state.mode || state.mode === 'live') return '';   // 真实数据不标，只有非真实才必须标
  let text = '模拟数据', bg = '#FEF3E2', fg = '#8A5A12';
  if (state.mode === 'offline') { text = '离线 · 模拟数据'; bg = '#FFF1F4'; fg = '#B23350'; }
  else if (state.needLogin) { text = '未登录'; bg = '#EEF0F8'; fg = '#5E6775'; }
  return `<span class="v2-pill-src" style="background:${bg};color:${fg}">${text}</span>`;
}

function v2MonthText(ym) {
  if (!ym || ym === 'currentMonth') {
    const d = new Date();
    return `${d.getFullYear()}年${d.getMonth() + 1}月`;
  }
  const m = String(ym).match(/^(\d{4})-(\d{1,2})$/);
  if (!m) return String(ym);
  return `${m[1]}年${Number(m[2])}月`;
}

function v2MonthLabel() {
  return v2MonthText(state.yearMonth);
}

function v2MonthChip() {
  return `<button class="v2-month-chip" id="monthBtn">${esc(v2MonthLabel())}</button>`;
}

function v2Foot(extra, withTime = true) {
  const rows = [];
  if (withTime && state.lastRefresh) rows.push(`更新于 ${esc(state.lastRefresh)}`);
  if (extra) rows.push(extra);
  rows.push('数据来自非官方接口，仅供参考');
  return `<div class="v2-foot">${rows.map((r) => `<div>${r}</div>`).join('')}</div>`;
}

/* 刻度四档：max / 2·max/3 / max/3 / 0（§4.6：由当期最大值现算，不写死） */
function v2NiceMax(v) {
  if (!v || v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
    if (m * mag >= v) return Math.round(m * mag * 100) / 100;
  }
  return 10 * mag;
}

/* 拆分柱：动态在下、静态在上；任一侧没有数据就退回单色柱。
   静态段给 2px 最小高，否则 0.2 kWh 这种小值在 112px 绘图区里根本看不见；
   动态段吃掉剩余高度，保证堆叠总高与「总额单柱」完全一致。 */
function v2BarBody(p, h, cls) {
  const d = p.d == null ? null : Number(p.d);
  const s = p.s == null ? null : Number(p.s);
  if (d == null || s == null || d + s <= 0) {
    return `<div class="b ${cls}" style="height:${h}px"></div>`;
  }
  let hs = s > 0 ? Math.round((s / (d + s)) * h) : 0;
  hs = s > 0 ? Math.max(2, Math.min(h - 1, hs)) : 0;
  const hd = h - hs;
  return `<div class="b split" style="height:${h}px">`
    + (hs > 0 ? `<div class="s-stat" style="height:${hs}px"></div>` : "")
    + (hd > 0 ? `<div class="s-dyn" style="height:${hd}px"></div>` : "")
    + `</div>`;
}

function v2Chart(cfg) {
  const d30 = cfg.days !== 7;
  const vals = cfg.points.map((p) => (p.v == null ? null : Number(p.v))).filter((v) => v != null);
  const max = v2NiceMax(vals.length ? Math.max(...vals) : 0);
  const avail = d30 ? 120 : 112;               // 132 - 数值行 13 - gap 4 - 余量 3
  const ticks = [max, max * 2 / 3, max / 3, 0].map((t) => {
    const r = Math.round(t * 10) / 10;
    return Number.isInteger(r) || max >= 10 ? String(Math.round(r)) : r.toFixed(1);
  });

  const bars = cfg.points.map((p) => {
    const v = p.v == null ? null : Number(p.v);
    const h = v == null ? 0 : Math.max(2, Math.round((v / max) * avail));
    const label = v == null ? '--'
      : (cfg.decimals ? v.toFixed(cfg.decimals) : String(Math.round(v)));
    return `<div class="v2-bar">
      ${d30 ? '' : `<span class="vt">${label}</span>`}
      ${v == null ? '' : `${v2BarBody(p, h, cfg.cls)}`}
    </div>`;
  }).join('');

  // 7 天：节距 56，横向可滚（最右一根被裁，提示可滑）
  // 30 天：等分、不滚，X 轴取 6 个刻度
  // 30 天：每根柱一格，只在刻度位填字，标签中心才能落在柱心上
  const xLabels = d30
    ? (() => {
        const n = cfg.points.length;
        const step = Math.max(1, Math.round(n / 6));
        return cfg.points.map((p, k) => `<span>${k % step === 0 && k < n - step / 2 ? p.label : ""}</span>`).join("");
      })()
    : cfg.points.map((p) => `<span>${p.label}</span>`).join("");

  const width = cfg.points.length * 56 + 46;   // 与规格「7×56+46 = 438」一致

  return `<div class="v2-chart-card">
    <div class="v2-chart-head">
      <span class="v2-chart-title">${cfg.title}</span>
      ${cfg.points.some((q) => q.d != null) ? `<span class="v2-leg"><i class="lg-d"></i>动态<i class="lg-s"></i>静态</span>` : ""}
    </div>
    <div class="v2-chart-row${d30 ? " d30" : ""}">
      <div class="v2-yaxis${d30 ? ' d30' : ''}">${ticks.map((t) => `<span>${t}</span>`).join('')}</div>
      <div class="v2-plot">
        <div class="v2-chart-scroll${d30 ? " d30" : ""}">
          <div style="min-width:${d30 ? 0 : width}px">
            <div class="v2-bars${d30 ? ' d30' : ''}">${bars}</div>
            <div class="v2-xaxis ${d30 ? 'd30' : 'd7'}">${xLabels}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function v2Ring(pct, size = 100, lw = 8) {
  /* soc 缺失不能画成 0%：0% 是「电量耗尽」的正常读数，
     「没读到」必须显示 --，否则用户会以为车趴窝了。 */
  const known = pct !== null && pct !== undefined && Number.isFinite(Number(pct));
  const v = known ? Math.max(0, Math.min(100, Number(pct))) : 0;
  const r = (size - lw) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - v / 100);
  return `<div class="v2-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <defs>
        <linearGradient id="v2SocGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#7CE8B5"/>
          <stop offset="0.5" stop-color="#7EDCEE"/>
          <stop offset="1" stop-color="#B9A5FF"/>
        </linearGradient>
      </defs>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(27,34,51,.05)" stroke-width="${lw}"/>
      ${known ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#v2SocGrad)" stroke-width="${lw}"
              stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"
              transform="rotate(-90 ${size / 2} ${size / 2})"/>` : ''}
    </svg>
    <div class="v2-ring-txt"><b>${known ? Math.round(v) + '%' : '--'}</b></div>
  </div>`;
}

function renderDashboard() {
  const s = state.status;
  if (!s) {
    // §2 S2 加载：卡标题照常显示 + 「加载中」pill + 3 行白 55% 骨架
    if (state.statusLoading) {
      return `<div class="v2-card">
        <div class="v2-cardhead"><span class="v2-card-t">车辆状态</span><span class="v2-chip-mute">加载中</span></div>
        <div class="v2-skel"><i></i><i></i><i></i></div>
      </div>`;
    }
    // §2 S3 读失败：图标 28 + 标题 + 副文 + 「重试」
    if (state.statusError) {
      return `<div class="v2-card"><div class="v2-empty">
        <span class="v2-empty-ico">${SVG.car}</span>
        <div class="t">车辆数据没有读到</div>
        <div class="d">后端可能正在重启，或登录状态已失效</div>
        <button class="btn" id="statusRetryBtn">重试</button>
      </div></div>`;
    }
    // §2 S4 真空态：同结构、不放按钮
    return `<div class="v2-card"><div class="v2-empty">
      <span class="v2-empty-ico">${SVG.car}</span>
      <div class="t">尚未获取到车辆数据</div>
      <div class="d">请确认服务已启动，且地址配置正确</div>
    </div></div>`;
  }

  const charging = s.isCharging === true;

  // S5：有旧数据但本轮失败 —— 保留旧数据，明确告知不是刚拿的
  const staleBanner = state.statusError ? `
    <div class="v2-stale">
      <div class="t">这一轮没读到最新车况，下面是上次读到的数据</div>
      <button class="rt" id="statusRetryBtn">重试</button>
    </div>` : '';

  // S12：充电中卡条件渲染，未充电整张消失
  const chargingCard = charging ? `
    <div class="v2-card v2-charge">
      <div class="v2-charge-title">充电中</div>
      <div class="v2-charge-grid">
        <div class="v2-charge-col"><b>${fmt(s.chargePowerKw, 1)}</b><span class="u">kW</span></div>
        <div class="v2-charge-col"><b>${fmt(s.chargeVoltage, 0)}</b><span class="u">V</span></div>
        <div class="v2-charge-col"><b>${fmt(s.chargeCurrent, 0)}</b><span class="u">A</span></div>
      </div>
      ${s.minutesToFull > 0 ? `<div class="v2-eta">预计 ${fmtDuration(s.minutesToFull)}充满</div>` : ''}
    </div>` : '';

  const tri = (v) => (v === null || v === undefined ? null : v === true);
  const lock3 = tri(s.isLocked);
  const doorOpen3 = anyTrue(...Object.values(s.doors || {}));
  const winOpen3 = anyTrue(...Object.values(s.windows || {}));
  const trunkOpen3 = tri(s.trunkOpen);
  const frunkOpen3 = tri(s.frunkOpen);

  // §7.6：名称「锁车 · 」+ 状态，两段同字号，状态色跟 tone
  const chip = (name, tone, text) =>
    `<div class="v2-status-item ${tone}"><span class="lb">${name} · </span><span class="vl">${text}</span></div>`;

  const item = (name, capKey, v, onText, offText, onTone, offTone) => {
    if (!cap(capKey)) return '';
    if (v === null) return chip(name, '', '—');
    return v ? chip(name, onTone, onText) : chip(name, offTone, offText);
  };

  const metric = (k, v, u) => `<div class="v2-metric"><div class="k">${k}</div><div class="v">${v}${u ? `<span class="u">${u}</span>` : ''}</div></div>`;

  const tyre = (label, v) => {
    const nv = Number(v);
    const badV = v !== null && v !== undefined && Number.isFinite(nv) && (nv < 240 || nv > 320);
    return `<div class="v2-tyre-col${badV ? ' warn' : ''}"><div class="k">${label}</div><div class="v">${fmt(v, 0)}</div></div>`;
  };

  const wt = weatherTemp();
  const odo = s.odometerKm != null ? Number(s.odometerKm).toLocaleString('zh-CN') : null;

  /* 页头右侧只占一行：来源胶囊（仅非真实数据）与更新时间并排。
     2026-10-25 修复：此前「模拟数据」胶囊另起 .v2-srcrow 一行，
     未登录 / 连不上后端时页头下面多出一条 22px 空白带，首卡被顶到 98。 */
  const srcPill = state.mode && state.mode !== 'live' ? v2SourcePill() : '';
  const headRight = (srcPill || state.lastRefresh)
    ? `<div class="v2-head v2-head--end"><div class="v2-head-r">${srcPill}${
        state.lastRefresh ? `<span class="v2-updated">更新于 ${esc(state.lastRefresh)}</span>` : ''
      }</div></div>`
    : "";
  return `
    <div class="v2-screen v2-dash">
      ${headRight}
      ${staleBanner}

      <div class="v2-card v2-soc">
        ${v2Ring(s.soc)}
        <div class="v2-soc-col">
          ${s.plateNo ? `<div class="v2-plate">${esc(s.plateNo)}</div>` : ''}
          <div class="v2-kv">续航 ${Number.isFinite(Number(s.rangeKm)) ? `<span>${Math.round(Number(s.rangeKm))}</span><span class="u">km</span>` : '<span>--</span>'}</div>
          <div class="v2-kv sub">总里程 ${odo ? `<span>${odo}</span><span class="u">km</span>` : '<span>--</span>'}</div>
        </div>
      </div>

      ${chargingCard}

      <div class="v2-card">
        <div class="v2-metric-rows">
          <div class="v2-metric-row">
            ${metric('车内温度', s.interiorTemp != null ? fmt(s.interiorTemp, 1) : '--', s.interiorTemp != null ? '°C' : '')}
            ${metric('当前气温', wt, wt !== '--' ? '°C' : '')}
          </div>
          <div class="v2-metric-row">
            ${metric('平均能耗', s.avgConsumption != null ? fmt(s.avgConsumption, 1) : '--', s.avgConsumption != null ? 'kWh/100km' : '')}
            ${metric('12V 电瓶', s.battery12vVoltage != null ? fmt(s.battery12vVoltage, 1) : '--', s.battery12vVoltage != null ? 'V' : '')}
          </div>
        </div>
      </div>

      ${cap('tyrePressure') ? `
      <div class="v2-card v2-tyre">
        <div class="v2-tyre-head"><span class="t">胎压</span><span class="u">kPa</span></div>
        <div class="v2-tyre-grid">
          ${tyre('左前', s.tyreFrontLeft)}
          ${tyre('右前', s.tyreFrontRight)}
          ${tyre('左后', s.tyreRearLeft)}
          ${tyre('右后', s.tyreRearRight)}
        </div>
      </div>` : ''}

      <div class="v2-card v2-status">
        <div class="v2-status-head">车身状态</div>
        <div class="v2-status-grid">
          <div class="v2-status-row">
            ${item('锁车', 'doorLock', lock3, '已锁', '未锁', 'good', 'bad')}
            ${item('车门', 'doorLock', doorOpen3, '有门未关', '全部关闭', 'bad', 'good')}
            ${item('空调', 'climate', tri(s.climateOn), '开启', '关闭', 'mid', 'off')}
          </div>
          <div class="v2-status-row">
            ${item('车窗', 'window', winOpen3, '有窗未关', '全部关闭', 'bad', 'good')}
            ${item('后备箱', 'trunk', trunkOpen3, '开启', '已关', 'bad', 'good')}
            ${item('前备箱', 'frunk', frunkOpen3, '开启', '已关', 'bad', 'good')}
          </div>
        </div>
      </div>

      ${v2LocCard()}
      ${v2Foot('', false)}
    </div>`;
}

/* ═══════════════════════════════════════════════
   能力集与三态判断
   ═══════════════════════════════════════════════ */

/* 先问车支持什么，再决定 UI 显示什么。
   `cap(key)` 的三态语义：
     true  —— 车辆明确支持
     false —— 车辆明确不支持 → UI 隐藏该功能
     能力集未拿到（null）→ 一律 true（保守显示）

   刻意不做"拿不到就隐藏"：网络抖动不该让整页功能凭空消失。
   而"某个字段网关没给"是另一回事，由 chip 的 unknown 态表达 ——
   两者职责分开，不要混用。 */
/* 当地气温。
   车端 `climateStatus.exteriorTemp` 实测非空率 0/15 —— 这版固件根本不上报，
   所以只能按车辆位置查天气。**标签必须写「当地气温」而不是「车外温度」**：
   暴晒、地下车库时两者能差十几度，标成"车外温度"就是谎报。
   取不到就 `--`，不拿 0 顶替（0℃ 是个具体的气温，会被当真）。 */
function weatherTemp() {
  const w = state.weather;
  if (!w || w.available !== true || w.temperature == null) return '--';
  return String(Math.round(w.temperature));
}

function cap(key) {
  const c = state.capabilities;
  if (!c || c[key] === undefined) return true;
  return c[key] !== false;
}

/* 三态归并：任一为 true → true；全为 null/undefined → null（未知）；否则 false。
   用于把四门 / 四窗归并成一个"有没有开"。
   返回 null 而不是 false 是关键 —— 后者会把"没数据"谎报成"已关好"。 */
function anyTrue(...vals) {
  const meaningful = vals.filter((v) => v !== null && v !== undefined);
  if (!meaningful.length) return null;
  return meaningful.some((v) => v === true);
}

function hasOpenWindow(s) {
  return anyTrue(...Object.values(s.windows || {})) === true;
}

/* 行程轨迹缩略图：把 trackpoint 序列画成一条折线。
   经纬度跨度可能极小，故按自身包围盒归一化，不依赖地图。 */
function trackSvg(points) {
  if (!Array.isArray(points) || points.length < 2) return '';
  const W = 300, H = 52, PAD = 4;
  const lngs = points.map((p) => p[0]);
  const lats = points.map((p) => p[1]);
  const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const spanLng = maxLng - minLng || 1e-9;
  const spanLat = maxLat - minLat || 1e-9;
  const x = (lng) => PAD + ((lng - minLng) / spanLng) * (W - PAD * 2);
  const y = (lat) => H - PAD - ((lat - minLat) / spanLat) * (H - PAD * 2);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
  const s = points[0], e = points[points.length - 1];
  return `
    <div class="track">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="行程轨迹">
        <path d="${d}" fill="none" stroke="var(--tian-qing)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
        <circle cx="${x(s[0]).toFixed(1)}" cy="${y(s[1]).toFixed(1)}" r="3.2" fill="var(--qing-bi)"/>
        <circle cx="${x(e[0]).toFixed(1)}" cy="${y(e[1]).toFixed(1)}" r="3.2" fill="var(--zhu-sha)"/>
      </svg>
      <div class="tk-legend"><span>起点</span><span>${points.length} 个轨迹点</span><span>终点</span></div>
    </div>`;
}

/* ═══════════════════════════════════════════════
   视图：行程
   ═══════════════════════════════════════════════ */
function tripStat(icon, title, value, unit) {
  return `<div class="stat">
      <div class="head">${icon} ${title}</div>
      <div class="val">${value}<span class="u">${unit}</span></div>
    </div>`;
}

function renderTrips() {
  const month = state.energy;
  const windowStats = state.energyWindow || month;
  const isCurrent = !state.yearMonth || state.yearMonth === 'currentMonth';
  const demo = state.mode !== 'live';

  const shell = (inner, head) => `<div class="v2-screen">${head}${inner}${v2Foot('')}</div>`;
  // §2 S1：数据来源 pill 在页标题右侧同一行，右对齐；只有非真实才标
  const head = `<div class="v2-head v2-head--end">
      <div class="v2-head-r">${demo ? v2SourcePill() : ''}${v2MonthChip()}</div>
    </div>`;

  // S2 加载骨架
  if (!month || !windowStats) {
    if (state.energyLoading) {
      return shell(`<div class="v2-card"><div class="v2-cardhead"><span class="v2-card-t">本月里程</span><span class="v2-chip-mute">加载中</span></div><div class="v2-skel"><i></i><i></i><i></i></div></div>`, head);
    }
    // S3 读失败 + 重试
    if (state.energyError) {
      return shell(`<div class="v2-card"><div class="v2-empty">
          ${SVG.chart}
          <div class="t">能耗数据没有读到</div>
          <div class="d">后端可能正在重启，或登录状态已失效</div>
          <button class="btn" id="energyRetryBtn">重试</button>
        </div></div>`, head);
    }
    // S4 真空态
    return shell(`<div class="v2-card"><div class="v2-empty">
        ${SVG.chart}
        <div class="t">这个时间段没有行程</div>
        <div class="d">换个月份或切到 30 天看看</div>
      </div></div>`, head);
  }

  const series = (windowStats && windowStats.series) || [];
  const days = state.days === 7 ? 7 : 30;
  /* 日期缺失/格式不对时，别让 X 轴渲染出 "NaN/NaN"。 */
  const dayLabel = (raw) => {
    const t = String(raw || '');
    const mo = Number(t.slice(5, 7));
    const dd = Number(t.slice(8, 10));
    if (!Number.isFinite(mo) || !Number.isFinite(dd) || !mo || !dd) return '';
    return days === 7 ? String(dd) : `${mo}/${dd}`;
  };
  const points = series.map((p) => ({ v: p.distanceKm, label: dayLabel(p.date) }));
  const ePoints = series.map((p) => ({
    v: p.energyKwh,
    d: p.dynamicKwh,
    s: p.staticKwh,
    label: points[series.indexOf(p)].label,
  }));

  // 历史月份不渲染 7/30 段（§4.6）
  const distRow = `<div class="v2-dist">
      <span class="l">每日分布</span>
      ${isCurrent ? `<span class="v2-seg" id="daysSeg">
        <button data-days="7" class="${days === 7 ? 'on' : ''}">7天</button>
        <button data-days="30" class="${days !== 7 ? 'on' : ''}">30天</button>
      </span>` : ''}
    </div>`;

  return shell(`
    <div class="v2-card">
      <div class="v2-sum-grid">
        <div class="v2-sum-row">
          <div class="v2-sum-cell"><div class="k">本月里程</div><div class="v">${fmt(month.distanceKm, 0)}<span class="u">km</span></div></div>
          <div class="v2-sum-cell"><div class="k">总电耗</div><div class="v">${fmt(month.energyKwh, 1)}<span class="u">kWh</span></div></div>
        </div>
        <div class="v2-sum-row">
          <div class="v2-sum-cell"><div class="k">动态电耗</div><div class="v">${fmt(month.dynamicEnergyKwh, 1)}<span class="u">kWh</span></div></div>
          <div class="v2-sum-cell"><div class="k">静态电耗</div><div class="v">${fmt(month.staticEnergyKwh, 1)}<span class="u">kWh</span></div></div>
        </div>
        <div class="v2-sum-row">
          <div class="v2-sum-cell"><div class="k">平均动态电耗</div><div class="v">${fmt(month.avgDynamicConsumption, 1)}<span class="u">kWh/100km</span></div></div>
          <div class="v2-sum-cell"><div class="k">平均电耗</div><div class="v">${fmt(month.avgConsumption, 1)}<span class="u">kWh/100km</span></div></div>
        </div>
      </div>
    </div>
    ${distRow}
    ${v2Chart({ title: '每日里程 (km)', points, days, decimals: 0, cls: 'mileage' })}
    ${v2Chart({ title: '每日电耗 (kWh)', points: ePoints, days, decimals: 1, cls: 'energy' })}
  `, head);
}

/* ── 月份选择：iOS 风格底部弹层 ──
   用按钮 + 弹层而不是 <select>：原生下拉在移动端观感与 iOS 相差太远。
   弹层挂在 body 上（不随视图重绘销毁），选择后重新取数并整页渲染。

   参数化是必须的：行程页与充电页各有一套月份清单和选中项，
   共用同一个弹层但不能共用一个 state —— 否则在充电页选月份会把行程页也带走。 */
function openMonthSheet(cfg) {
  const months = (cfg && cfg.months && cfg.months.length)
    ? cfg.months
    : [{ yearMonth: 'currentMonth', label: '本月' }];
  const current = (cfg && cfg.current) || 'currentMonth';
  const title = (cfg && cfg.title) || '选择月份';

  let root = document.getElementById('sheetRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'sheetRoot';
    root.className = 'sheet-root hidden';
    document.body.appendChild(root);
  }

  /* 官方给的是「本月 + 各个月份」，这里拆成年份与月份两段：
     年份竖排、月份按 3 列网格；没有数据的月份置灰不可点。 */
  const now = new Date();
  // 键统一成 "YYYY-MM"（两位月份）—— 接口返回的是 2026-09，
  // 自己拼成 2026-9 会永远匹配不上，整月列表就会全部置灰
  const pad2 = (v) => String(v).padStart(2, '0');
  const map = {};
  months.forEach((m) => {
    if (m.yearMonth === 'currentMonth') {
      map[`${now.getFullYear()}-${pad2(now.getMonth() + 1)}`] = 'currentMonth';
    } else {
      map[m.yearMonth] = m.yearMonth;
    }
  });

  const years = Array.from(new Set(Object.keys(map)
    .map((k) => Number(String(k).split('-')[0]))
    .filter((y) => Number.isFinite(y) && y > 0)))
    .sort((a, b) => b - a);

  const currentKey = current === 'currentMonth'
    ? `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`
    : current;
  let pickYear = Number(String(currentKey).split('-')[0]) || now.getFullYear();

  const body = () => {
    const yearRow = years
      .map((y) => `<button class="sheet-year${y === pickYear ? ' on' : ''}" data-year="${y}">${y}</button>`)
      .join('');

    const monthCells = Array.from({ length: 12 }, (_, i) => i + 1)
      .map((m) => {
        const key = `${pickYear}-${pad2(m)}`;
        const value = map[key];
        const active = value && value === current;
        return `<button class="sheet-mon${active ? ' on' : ''}" data-mon="${m}"${value ? '' : ' disabled'}>${m}</button>`;
      })
      .join('');

    return `
      <div class="sheet-title">${esc(title)}</div>
      <div class="sheet-cols">
        <div class="sheet-col">
          <div class="sheet-sec">年份</div>
          <div class="sheet-years">${yearRow}</div>
        </div>
        <div class="sheet-col">
          <div class="sheet-sec">月份</div>
          <div class="sheet-months">${monthCells}</div>
        </div>
      </div>
      <button class="sheet-cancel" data-sheet-close>取消</button>`;
  };

  /* 选中项滚到列表中间，打开就能看到当前年月 */
  const centerSelected = () => {
    const sheet = root.querySelector('.sheet');
    if (!sheet) return;
    ['sheet-mon', 'sheet-year'].forEach((cls) => {
      const active = sheet.querySelector(`.${cls}.on`);
      const list = active && active.parentElement;
      if (!active || !list) return;
      list.scrollTop = Math.max(
        0,
        active.offsetTop - list.offsetTop - list.clientHeight / 2 + active.offsetHeight / 2
      );
    });
  };

  root.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">${body()}</div>`;
  root.classList.remove('hidden');
  requestAnimationFrame(() => {
    root.classList.add('show');
    centerSelected();
  });

  // 用 onclick 赋值而不是 addEventListener：弹层节点复用，避免重复绑定
  root.onclick = (e) => {
    if (e.target === root) { closeMonthSheet(); return; }
    if (e.target.closest('[data-sheet-close]')) { closeMonthSheet(); return; }

    const yearBtn = e.target.closest('[data-year]');
    if (yearBtn) {
      pickYear = Number(yearBtn.dataset.year);
      root.querySelector('.sheet').innerHTML = body();
      requestAnimationFrame(centerSelected);
      return;
    }

    const monthBtn = e.target.closest('[data-mon]');
    if (monthBtn && !monthBtn.disabled) {
      const value = map[`${pickYear}-${pad2(Number(monthBtn.dataset.mon))}`];
      if (!value) return;
      closeMonthSheet();
      cfg.onPick(value);
    }
  };
}

function closeMonthSheet() {
  const root = document.getElementById('sheetRoot');
  if (!root) return;
  root.classList.remove('show');
  setTimeout(() => root.classList.add('hidden'), 180);
}

function tripItem(t) {
  /* 轨迹回放：仅在车辆具备该能力（cap('tripTrack')）且本行程确实带回轨迹点时渲染。
     数据来自 /ms-vehicle-trail/api/v1.0/journalLog/trackpoint/list。 */
  const track = (cap('tripTrack') && t.trackpoints) ? trackSvg(t.trackpoints) : '';

  return `
    <div class="item">
      <div class="item-top">
        <span class="item-time">${fmtTime(t.startTime)}</span>
        <span class="item-amt">${fmt(t.distanceKm, 1)} km</span>
      </div>
      <div class="item-main">${esc(t.startPlace || '起点')} → ${esc(t.endPlace || '终点')}</div>
      <div class="item-tags">
        <span class="tag a">${fmt(t.energyKwh, 2)} kWh</span>
        <span class="tag w">${fmt(t.consumption, 1)} kWh/100km</span>
        ${t.durationMinutes ? `<span class="tag">${fmtDuration(t.durationMinutes)}</span>` : ''}
        ${t.avgSpeedKmh != null ? `<span class="tag">均速 ${fmt(t.avgSpeedKmh, 0)} km/h</span>` : ''}
        ${t.maxSpeedKmh != null ? `<span class="tag">最高 ${fmt(t.maxSpeedKmh, 0)} km/h</span>` : ''}
      </div>
      ${track}
    </div>`;
}

/* ═══════════════════════════════════════════════
   视图：充电
   ═══════════════════════════════════════════════ */
function renderCharges() {
  const nearby = nearbyStationsCard();
  const c = state.charge;
  const months = state.chargeMonths.length
    ? state.chargeMonths
    : [{ yearMonth: 'currentMonth', label: '本月' }];
  const selected = months.find((m) => m.yearMonth === state.chargeMonth) || months[0];
  const isCurrent = state.chargeMonth === 'currentMonth';
  const monthLabel = v2MonthText(state.chargeMonth);

  const totalAmount = (() => {
    const sum = state.chargeMonths.reduce((acc, m) => acc + (Number(m.amount) || 0), 0);
    return sum > 0 ? sum : null;
  })();

  const demo = state.mode !== 'live';

  const head = `<div class="v2-head v2-head--end">
      <div class="v2-head-r">${demo ? v2SourcePill() : ''}
        <button class="v2-month-chip" id="chargeMonthBtn">${esc(monthLabel)}</button></div>
    </div>`;

  /* 标题跟的是 chargeMonth，数字跟的是 state.charge —— 切月期间（请求在飞）
     以及「该月读失败」时两者会对不上，不能让旧数字挂在新标题下。 */
  const ymMismatch = !!c && !!state.chargeYm && state.chargeYm !== state.chargeMonth;
  const ymFailed = !!c && state.chargeYmFailed === state.chargeMonth;

  if (!c || ymMismatch || ymFailed) {
    /* ymFailed：标题已是新月份、数字没拿到，显示「读不到」比显示别人的数字诚实。
       ymMismatch：请求还在飞，先给骨架。 */
    const body = (state.chargeLoading || (ymMismatch && !ymFailed))
      ? `<div class="v2-card"><div class="v2-cardhead"><span class="v2-card-t">本月充入电量</span><span class="v2-chip-mute">加载中</span></div>
           <div class="v2-skel-row" style="width:70%"></div>
           <div class="v2-skel-row" style="width:35%"></div>
           <div class="v2-skel-row" style="width:55%"></div></div>`
      : (state.chargeLoadError || ymFailed)
        ? `<div class="v2-card"><div class="v2-empty">
             <div class="t">充电流水没有读到</div>
             <div class="d">后端可能正在重启，或登录状态已失效</div>
             <button class="btn" id="chargeRetryBtn">重试</button>
           </div></div>`
        : `<div class="v2-card"><div class="v2-empty">
             <div class="t">${esc(monthLabel)}没有充电记录</div>
             <div class="d">换个月份看看；新流水会在充完电或跨天后的同步里出现</div>
           </div></div>`;
    return `<div class="v2-screen">${head}${body}${nearby}${v2Foot('')}</div>`;
  }

  if (!c.count) {
    return `<div class="v2-screen">${head}
      <div class="v2-card"><div class="v2-empty">
        <div class="t">${esc(monthLabel)}没有充电记录</div>
        <div class="d">换个月份看看；新流水会在充完电或跨天后的同步里出现</div>
      </div></div>${nearby}${v2Foot('')}</div>`;
  }

  const amountText = c.amountTotal == null
    ? '<span class="v2-cc-amt na">未补录</span>'
    : `<span class="v2-cc-amt">¥${fmt(c.amountTotal, 2)}</span>`;

  const sumCard = `<div class="v2-card">
      <div class="v2-cc-row">
        <div class="v2-cc-l">
          <div class="v2-k">本月充入电量</div>
          <div class="v2-cc-hero">${fmt(c.totalKwh, 1)}<span class="v2-u">kWh</span></div>
        </div>
        <div class="v2-cc-r">
          <div class="v2-cc-line"><span class="v2-k">本月金额</span>${amountText}</div>
          <div class="v2-cc-line"><span class="v2-k">累计</span>
            <span class="v2-cc-total">${totalAmount == null ? '--' : '¥' + fmt(totalAmount, 2)}</span></div>
          ${(c.amountCount && c.unpricedCount) ? `<div class="v2-cc-mix">含 ${c.unpricedCount} 笔未补录</div>` : ''}
        </div>
      </div>
      <div class="v2-cc-stats">
        <span class="a">${c.count} 次充电</span>
        <span class="b">均值 ${c.avgPowerKw == null ? '--' : fmt(c.avgPowerKw, 1)} kW</span>
      </div>
    </div>`;

  const listCard = `<div class="v2-card">
      <div class="v2-cardhead"><span class="v2-card-t">充电记录</span></div>
      <div class="v2-rec-list">${(Array.isArray(c.records) ? c.records : []).map(chargeSessionItem).join('')}</div>
    </div>`;

  return `<div class="v2-screen">${head}${sumCard}${nearby}${listCard}${costCard(c)}${v2Foot('')}</div>`;
}
function costCard(c) {
  const writable = canWriteCharges();
  const priced = c.amountCount || 0;
  const unpriced = c.unpricedCount || 0;

  /* 分母要含估算笔：`unpricedCount` 是"既没金额也不是估算"的笔数，
     漏掉 estimatedCount 会出现"已补全"和"另有 N 笔估算"同屏打架。 */
  const estimated = c.estimatedCount || 0;
  const totalBills = priced + unpriced + estimated;
  const badge = !priced
    ? '未补录'
    : (totalBills > priced ? `已补录 ${priced}/${totalBills} 笔` : '已补全');

  const notes = [];
  if (!priced) {
    notes.push('极氪只给电量，不给金额 —— 车不知道电价，站点也不在充电记录里。'
      + '补录后上面的「当月金额 / 累计」才会有数。');
  } else {
    const unit = c.unitPrice == null ? '' : `，每度约 ¥${fmt(c.unitPrice, 2)}`;
    notes.push(unpriced
      ? `已补录 ${priced} 笔${unit}；还有 ${unpriced} 笔（${fmt(c.unpricedKwh, 1)} 度）没补，单价只按已补录的算。`
      : `已补录 ${priced} 笔，全部有金额${unit}。`);
  }
  if (c.estimatedCount) {
    notes.push(`另有 ${c.estimatedCount} 笔为电价估算，未计入合计与单价。`);
  }
  const pending = (c.pendingPayments || 0) + (c.unmatchedPayments || 0);
  if (pending) {
    notes.push(`有 ${pending} 笔金额配不上充电流水，在「待确认」里等你指定。`);
  }
  if (!writable) {
    notes.push('当前是演示/离线数据，补录入口不可用（没有真实流水可配对）。');
  } else if (state.ocrConfigured === false) {
    notes.push('截图识别未开启：服务端 .env 填 DEEPSEEK_API_KEY 并重启后可用；'
      + '在那之前先用手写录入。');
  }

  /* 三个入口。
     「截图识别」不是"识别完就完事"：识别结果会弹出核对框，
     金额 / 电量 / 归属哪次充电都能改 —— 模型把服务费原价当金额是常事。 */
  const actions = `<div class="cost-actions">
      <button class="cost-btn primary" id="ocrPickBtn"${writable && !state.ocrBusy ? '' : ' disabled'}>
        ${state.ocrBusy ? '<i class="v2-spin"></i>识别中…' : `${SVG.scan} 截图识别`}
      </button>
      <button class="cost-btn" id="manualPayBtn"${writable ? '' : ' disabled'}>${SVG.money} 手写录入</button>
      ${pending
        ? `<button class="cost-btn" id="pendingPayBtn"${writable ? '' : ' disabled'}>待确认 ${pending}</button>`
        : ''}
    </div>`;

  return `<div class="v2-card">
      <div class="v2-cardhead">
        <span class="v2-card-t">金额补录</span>
        <span class="v2-chip-a">${badge}</span>
      </div>
      ${notes.length ? `<div class="v2-cost-note">${notes.map(esc).join('<br>')}</div>` : ''}
      ${state.ocrError ? `<div class="v2-cost-err">识别失败：${esc(state.ocrError)}，可以手写录入</div>` : ''}
      <div class="v2-cost-actions">
        <button class="v2-btn primary" id="ocrPickBtn"${writable && !state.ocrBusy ? '' : ' disabled'}>
          ${state.ocrBusy ? '<i class="v2-spin"></i>识别中…' : `${SVG.scan} 截图识别`}
        </button>
        <button class="v2-btn ghost" id="manualPayBtn"${writable ? '' : ' disabled'}>${SVG.money} 手写录入</button>
        ${pending
          ? `<button class="v2-btn warn" id="pendingPayBtn"${writable ? '' : ' disabled'}>• 待确认 ${pending}</button>`
          : ''}
      </div>
    </div>`;
}
function canWriteCharges() {
  return state.mode === 'live' && isLoggedIn();
}

/* 站名归一：「极氪超充·上海中心」与「极氪超充上海中心（B2）」视为同一个站。
   只用来判断"是不是同一笔"，不参与任何展示。 */
function normStation(s) {
  return String(s || '').toLowerCase()
    .replace(/[^\u4e00-\u9fa5a-z0-9]/g, '')
    .replace(/(充电站|充电桩|超充站)$/, '');
}

/* 识别完比对一遍：本次小票的「金额 + 站点」是否已经补录过。
   命中就记下 sessionId，充电记录那行右侧的金额 chip 变成绿勾。
   只做标记 —— 静默、不弹提示、不可点，撤回仍走「金额记录」里的解绑。 */
function detectDupReceipts(rows) {
  const recs = (state.charge && state.charge.records) || [];
  const hits = {};
  (rows || []).forEach((row) => {
    const amt = Number(row.amount);
    const st = normStation(row.stationName);
    if (!Number.isFinite(amt) || amt <= 0 || !st) return;
    recs.forEach((r) => {
      if (hits[r.sessionId]) return;
      if (r.amount == null || r.amountSource === 'estimate') return;
      if (Math.abs(Number(r.amount) - amt) > 0.005) return;
      if (normStation(r.stationName) !== st) return;
      hits[r.sessionId] = { amount: amt };
    });
  });
  state.ocrHits = hits;
}

/* 一条充电流水。
   官方记录里没有站点名，所以标题位写"直流快充 / 交流慢充"；
   将来 OCR 补上站点名后，这里会自动换成站点名（`stationName` 有值就用）。 */
function chargeSessionItem(r) {
  const isDc = r.chargeType === 'dc';
  const isAc = r.chargeType === 'ac';
  const kind = isDc ? '直流快充' : (isAc ? '交流慢充' : '充电');
  const station = r.stationName ? `${esc(r.stationName)}<span class="dot">·</span><span class="ty">${kind}</span>` : `<span class="ty">${kind}</span>`;

  /* durationMin 是分钟数：为 0 或非数字时这个除法会给出 Infinity / NaN，
     直接 fmt 出来就是「均 Infinity kW」。 */
  const rawPower = (r.energyKwh && r.durationMin)
    ? (Number(r.energyKwh) / (Number(r.durationMin) / 60))
    : null;
  const power = Number.isFinite(rawPower) && rawPower > 0 ? rawPower : null;

  const when = `${fmtTime(r.startTime)}${r.durationMin ? ' · ' + fmtDuration(r.durationMin) : ''}`;
  const chips = [
    power ? `<span class="v2-chip">均 ${fmt(power, 0)} kW</span>` : '',
    r.amount != null
      ? `<span class="v2-chip">¥${fmt(r.amount, 2)}${r.amountSource === 'estimate' ? ' 估算' : ''}</span>`
      : '',
  ].filter(Boolean).join('');

  return `<div class="v2-rec">
      <div class="v2-rec-top">
        <span class="t">${when}</span>
        <span class="e">${fmt(r.energyKwh, 1)}<span class="u">kWh</span></span>
      </div>
      <div class="v2-rec-bot">
        <span class="s">${station}</span>
        <span class="chips">${chips}</span>
      </div>
    </div>`;
}
function ocrRootEl() {
  let root = document.getElementById('ocrRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'ocrRoot';
    root.className = 'sheet-root hidden';
    document.body.appendChild(root);
  }
  return root;
}

function openSheetRoot(root, html) {
  root.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  root.classList.remove('hidden');
  requestAnimationFrame(() => root.classList.add('show'));
}

function closeSheetRoot(root) {
  if (!root) return;
  root.classList.remove('show');
  setTimeout(() => root.classList.add('hidden'), 180);
}

/* ── ① 截图识别 ── */

function pickReceiptImage() {
  if (!canWriteCharges()) {
    toast('当前是演示/离线数据，不能补录金额');
    return;
  }
  let input = document.getElementById('ocrFileInput');
  if (!input) {
    input = document.createElement('input');
    input.type = 'file';
    input.id = 'ocrFileInput';
    input.accept = 'image/*';
    input.style.display = 'none';
    document.body.appendChild(input);
    // 清空 value 才能连续选同一张图（否则第二次 change 不触发）
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (file) runReceiptOcr(file);
    });
  }
  input.click();
}

async function runReceiptOcr(file) {
  if (state.ocrBusy) return;
  state.ocrBusy = true;
  render();
  try {
    const form = new FormData();
    form.append('file', file, file.name || 'receipt.png');
    const data = await api('/api/charges/receipts/ocr', { method: 'POST', body: form });
    const rows = (data && data.rows) || [];
    if (!rows.length) {
      toast('没从这张图里读到金额，换一张带金额的订单截图试试');
      return;
    }
    state.ocrRows = rows;
    state.ocrError = '';
    state.ocrAt = Date.now();   // 设计稿 18:167 副标题「已识别 1 张 · 11:04」
    state.ocrImageSha = data.imageSha8 || '';
    /* 默认归属：只有**唯一候选**时才预选；
       多候选一律留空让人挑 —— 替用户拍板的那一次，往往就是错的那一次。 */
    state.ocrPick = {};
    /* 记下哪些行是**用户自己点的**：用户改过时间/电量后，自动预选就不作数了，
       但用户亲手选的要尊重（他可能知道截图识别错了）。 */
    state.ocrUserPicked = {};
    rows.forEach((r, i) => {
      const cands = r.candidates || [];
      if (cands.length === 1) state.ocrPick[i] = cands[0].sessionId;
    });
    /* 先比对再开弹层：候选行里要标「已补录」，开完弹层再比对就赶不上这次渲染了。
       只打标记，不弹提示 —— 分神漏看的提示等于没提示。 */
    detectDupReceipts(rows);
    openOcrSheet();
  } catch (e) {
    state.ocrError = (e && e.message) ? e.message : '截图识别失败';
    toast(state.ocrError);
  } finally {
    state.ocrBusy = false;
    render();
  }
}

const CAND_KIND = { strong: '电量对得上', weak: '仅时间接近' };

/* 设计稿 18:167：站点行右侧「置信度 92%」—— 后端给 0~1 或 0~100 都兼容 */
function ocrConf(v) {
  if (v == null || v === '') return '';
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  const pct = Math.round(n <= 1 ? n * 100 : n);
  return `<span class="ocr-conf">置信度 ${pct}%</span>`;
}

function ocrRowHtml(row, i) {
  const cands = row.candidates || [];
  /* 默认绑后端匹配到的第一笔（后端按时间窗排好序，第一条就是最像的）。
     用户一旦手动点过（含点「暂不绑定」），就再也不覆盖他的选择。 */
  if (cands.length && !(state.ocrUserPicked || {})[i] && state.ocrPick[i] == null) {
    state.ocrPick[i] = cands[0].sessionId || '';
  }
  const picked = state.ocrPick[i] || '';
  const when = row.startAt || row.paidAt || '';

  /* 设计稿 18:167 候选行带「差 6 天」：拿小票时间与候选时间比，差多少天一眼看出 */
  const asDay = (t) => {
    if (!t) return null;
    const d = new Date(String(t).replace(/-/g, '/'));
    return Number.isNaN(d.getTime()) ? null : Math.floor(d.getTime() / 86400000);
  };
  const diffTxt = (t) => {
    const a = asDay(when), b = asDay(t);
    if (a == null || b == null) return '';
    const n = Math.abs(b - a);
    return n === 0 ? '同一天' : '差 ' + n + ' 天';
  };
  /* 设计稿 18:167：候选行左侧「时间 · 电量 kWh」，右侧只在未选中时写「差 N 天」，
     选中项右侧是对勾 —— 选中的不用再提醒它差几天。 */
  const candBtns = cands.map((c) => {
    const on = c.sessionId === picked;
    /* 这条流水已经有金额、且和小票的金额+站点都对得上 → 在勾左边标「已补录」 */
    const dupHit = (state.ocrHits || {})[c.sessionId];
    return `
    <button class="ocr-cand${on ? ' on' : ''}" data-cand="${esc(c.sessionId)}">
      <span class="c-main">${fmtTime(c.startTime)} · ${fmt(c.energyKwh, 1)} kWh</span>
      <span class="c-side">${dupHit ? '<span class="c-dup">已补录</span>' : ''}${on ? '✓' : diffTxt(c.startTime)}</span>
    </button>`;
  }).join('');

  return `<div class="ocr-row" data-idx="${i}">
      <div class="ocr-row-top">
        ${(state.ocrRows || []).length > 1
          ? `<span>第 ${i + 1} 笔${row.payStatus ? ` · ${esc(row.payStatus)}` : ''}</span>`
          : '<span></span>'}
        <b>${row.stationName ? esc(row.stationName) : '未识别到站点'}</b>
        ${ocrConf(row.confidence)}
      </div>
      ${row.needsReview
        ? `<div class="ocr-warn">需要核对：${esc(row.reviewNote || '这一项读得不准')}。
             金额请按「实付」填，别填服务费原价。</div>`
        : ''}
      <div class="ocr-fields">
        <div class="ocr-field">
          <label>金额</label>
          <div class="ocr-wrap"><input class="ocr-input" data-f="amount" type="number" inputmode="decimal" step="0.01"
                 value="${row.amount == null ? '' : fmt(row.amount, 2)}"><span class="ocr-unit">元</span></div>
        </div>
        <div class="ocr-field">
          <label>充电量</label>
          <div class="ocr-wrap"><input class="ocr-input" data-f="energyKwh" type="number" inputmode="decimal" step="0.001"
                 value="${row.energyKwh == null ? '' : fmt(row.energyKwh, 3)}"><span class="ocr-unit">kWh</span></div>
        </div>
        <div class="ocr-field">
          <label>开始时间</label>
          <input class="ocr-input" data-f="startAt" value="${esc(when)}" placeholder="2026-10-16 22:10">
        </div>
        <div class="ocr-field">
          <label>站点名</label>
          <input class="ocr-input" data-f="stationName" value="${esc(row.stationName || '')}" placeholder="选填">
        </div>
      </div>
      ${cands.length ? '' : `<div class="ocr-nocand">
        <div class="t">没匹配到充电流水</div>
        <div class="d">可以先记下金额放进「待确认」，之后再指定属于哪次充电。</div>
        <div class="btns">
          <button class="ocr-act" data-ocr-again="1">重选截图</button>
          <button class="ocr-act" data-ocr-manual="1">手写录入</button>
        </div>
      </div>`}
      ${cands.length ? '<div class="ocr-sec">对应哪次充电</div>' : ''}
      <div class="ocr-cands">
        ${candBtns}
        <button class="ocr-cand${cands.length && !picked ? ' on' : ''}" data-cand="">
          <span class="c-main">${cands.length ? '暂不绑定（放进待确认）' : '仍要保存这笔金额'}</span>
          <span class="c-side">${cands.length && !picked ? '✓' : ''}</span>
        </button>
      </div>
      <div class="ocr-warn ocr-rebind" hidden>
        时间和电量改过了，原来那次自动匹配不再作数 —— 请重新选一次对应哪次充电
      </div>
    </div>`;
}

function openOcrSheet() {
  const rows = state.ocrRows || [];
  const root = ocrRootEl();
  openSheetRoot(root, `
    <div class="ocr-head">
      <div class="ocr-title">识别充电小票</div>
      <div class="ocr-sub">已识别 ${rows.length} 张 · ${state.ocrAt ? clockOf(state.ocrAt) : "--"}</div>
    </div>
    <div class="ocr-body">${rows.map(ocrRowHtml).join('')}</div>
    <div class="ocr-actions">
      <button class="sheet-cancel" data-ocr-close>取消</button>
      <button class="ocr-primary" id="ocrCommitBtn">确认补录</button>
    </div>`);

  root.onclick = (e) => {
    if (e.target === root || e.target.closest('[data-ocr-close]')) { closeOcrSheet(); return; }

    const cand = e.target.closest('[data-cand]');
    if (cand) {
      const rowEl = cand.closest('.ocr-row');
      if (!rowEl) return;
      state.ocrPick[Number(rowEl.dataset.idx)] = cand.dataset.cand || '';
      state.ocrUserPicked[Number(rowEl.dataset.idx)] = true;
      // 只重绘候选区的选择态 —— 整块重绘会让正在输入的金额被清掉
      rowEl.querySelectorAll('.ocr-cand').forEach((b) => {
        b.classList.toggle('on', (b.dataset.cand || '') === (cand.dataset.cand || ''));
      });
      rowEl.querySelectorAll('.ocr-rebind').forEach((n) => { n.hidden = true; });
      return;
    }

    const againBtn = e.target.closest('[data-ocr-again]');
    if (againBtn) { closeOcrSheet(); const b = document.getElementById('ocrPickBtn'); if (b && !b.disabled) b.click(); return; }
    const manualBtn = e.target.closest('[data-ocr-manual]');
    if (manualBtn) { closeOcrSheet(); const b = document.getElementById('manualPayBtn'); if (b && !b.disabled) b.click(); return; }

    if (e.target.closest('#ocrCommitBtn')) commitOcr();
  };
}

function closeOcrSheet() {
  closeSheetRoot(document.getElementById('ocrRoot'));
  state.ocrRows = null;
  state.ocrPick = {};
  state.ocrImageSha = '';
}

/* 从核对框里读回用户改过的数。
   **金额为空的行直接跳过**：那多半是模型把标题行当成了记录，
   存一条 0 元的支付进去只会污染待确认列表。 */
function collectOcrRows() {
  const root = document.getElementById('ocrRoot');
  return (state.ocrRows || []).map((row, i) => {
    const el = root && root.querySelector(`.ocr-row[data-idx="${i}"]`);
    const val = (f) => {
      const node = el && el.querySelector(`[data-f="${f}"]`);
      return node ? String(node.value || '').trim() : '';
    };
    const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
    return {
      amount: num(val('amount')),
      energyKwh: num(val('energyKwh')),
      startAt: val('startAt') || null,
      stationName: val('stationName') || null,
      // 空字符串表示"不绑定"，后端会放进待确认而不是丢掉
      sessionId: state.ocrPick[i] || '',
      confidence: row.confidence,
    };
  }).filter((r) => r.amount && r.amount > 0);
}

async function commitOcr() {
  const rows = collectOcrRows();
  if (!rows.length) { toast('至少填一笔金额'); return; }

  const btn = document.getElementById('ocrCommitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '补录中…'; }

  try {
    const data = await api('/api/charges/receipts/commit', {
      method: 'POST',
      body: JSON.stringify({ imageSha8: state.ocrImageSha, rows }),
    });
    closeOcrSheet();
    toast(ocrResultText(data));
    await refreshChargeBills();
    render();
  } catch (e) {
    toast((e && e.message) ? e.message : '补录失败');
    if (btn) { btn.disabled = false; btn.textContent = '确认补录'; }
  }
}

function ocrResultText(d) {
  const parts = [];
  if (d.linked) parts.push(`已绑定 ${d.linked} 笔`);
  if (d.pending) parts.push(`${d.pending} 笔待确认`);
  if (d.unmatched) parts.push(`${d.unmatched} 笔未配对`);
  if (d.skipped) parts.push(`${d.skipped} 笔重复已跳过`);
  return parts.length ? parts.join(' · ') : '没有需要补录的新记录';
}

/* ── ② 手写录入（零依赖兜底）── */

function openManualSheet() {
  if (!canWriteCharges()) { toast('当前是演示/离线数据，不能补录金额'); return; }
  const now = new Date();
  const pad = (v) => String(v).padStart(2, '0');
  const defAt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} `
    + `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const root = ocrRootEl();
  openSheetRoot(root, `
    <div class="sheet-title">手写录入一笔金额</div>
    <div class="ocr-body">
      <div class="ocr-row">
        <div class="ocr-fields">
          <div class="ocr-field">
            <label>实付金额（元）</label>
            <input class="ocr-input" id="mpAmount" type="number" inputmode="decimal" step="0.01" placeholder="28.85">
          </div>
          <div class="ocr-field">
            <label>电量（度，选填）</label>
            <input class="ocr-input" id="mpKwh" type="number" inputmode="decimal" step="0.001" placeholder="80.1">
          </div>
          <div class="ocr-field wide">
            <label>支付时间（用来配对充电流水）</label>
            <input class="ocr-input" id="mpAt" value="${defAt}" placeholder="2026-10-16 22:10">
          </div>
          <div class="ocr-field wide">
            <label>站点（选填）</label>
            <input class="ocr-input" id="mpStation" placeholder="如：极充站">
          </div>
        </div>
      </div>
      <div class="st-note">填上电量能自动配对到那次充电；只填金额 + 时间也能存，
        配不上的会进「待确认」，不会被丢掉。</div>
    </div>
    <div class="ocr-actions">
      <button class="sheet-cancel" data-ocr-close>取消</button>
      <button class="ocr-primary" id="mpSaveBtn">保存</button>
    </div>`);

  root.onclick = (e) => {
    if (e.target === root || e.target.closest('[data-ocr-close]')) {
      closeSheetRoot(root);
      return;
    }
    if (e.target.closest('#mpSaveBtn')) submitManualPayment();
  };
}

async function submitManualPayment() {
  const amount = parseFloat((document.getElementById('mpAmount') || {}).value || '');
  if (!Number.isFinite(amount) || amount <= 0) { toast('金额必须是正数'); return; }

  const kwhRaw = parseFloat((document.getElementById('mpKwh') || {}).value || '');
  const paidAt = ((document.getElementById('mpAt') || {}).value || '').trim();
  const station = ((document.getElementById('mpStation') || {}).value || '').trim();
  if (!paidAt) { toast('请填支付时间'); return; }

  const btn = document.getElementById('mpSaveBtn');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }

  try {
    const data = await api('/api/charges/payments/manual', {
      method: 'POST',
      body: JSON.stringify({
        amount,
        energyKwh: Number.isFinite(kwhRaw) ? kwhRaw : null,
        paidAt,
        stationName: station || null,
      }),
    });
    closeSheetRoot(document.getElementById('ocrRoot'));
    toast(ocrResultText(data));
    await refreshChargeBills();
    render();
  } catch (e) {
    toast((e && e.message) ? e.message : '保存失败');
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
  }
}

/* ── ③ 待确认 / 未配对的支付 ──
   这些钱**已经花了**，只是不知道该挂到哪次充电上。
   全部列出来让人点一下 —— 删掉它们等于把支出抹了。 */

async function loadPayments() {
  try {
    const data = await api('/api/charges/payments');
    /* **不筛掉已绑定的**：绑错了要能撤。只留"待处理"的话，
       用户改不了自己刚点错的那一笔。 */
    state.payments = (data && data.payments) || [];
  } catch (e) {
    console.warn('待确认支付加载失败', e);
    state.payments = [];
  }
}

function openPaymentsSheet() {
  const list = state.payments || [];
  const todo = list.filter((p) => p.status !== 'matched').length;
  const root = ocrRootEl();
  const body = list.length
    ? list.map(paymentRowHtml).join('')
    : '<div class="st-note">还没有补录过金额。</div>';

  openSheetRoot(root, `
    <div class="sheet-title">金额记录 · ${todo ? `待确认 ${todo} 笔` : '全部已绑定'}</div>
    <div class="ocr-body">${body}</div>
    <div class="ocr-actions">
      <button class="sheet-cancel" data-ocr-close>关闭</button>
    </div>`);

  root.onclick = async (e) => {
    if (e.target === root || e.target.closest('[data-ocr-close]')) { closeSheetRoot(root); return; }

    const cand = e.target.closest('[data-bind]');
    if (cand) {
      const pid = cand.dataset.pid;
      const sid = cand.dataset.bind;
      cand.disabled = true;
      try {
        await api(`/api/charges/payments/${encodeURIComponent(pid)}/link`, {
          method: 'POST', body: JSON.stringify({ sessionId: sid }),
        });
        toast('已绑定到那次充电');
        await refreshChargeBills();
        openPaymentsSheet();     // 重开：列表短了一行，顺便刷新候选
        render();
      } catch (err) {
        toast((err && err.message) ? err.message : '绑定失败');
        cand.disabled = false;
      }
      return;
    }

    const drop = e.target.closest('[data-unbind]');
    if (drop) {
      drop.disabled = true;
      try {
        await api(`/api/charges/payments/${encodeURIComponent(drop.dataset.unbind)}/link`,
          { method: 'DELETE' });
        toast('已解绑，金额退回待确认');
        await refreshChargeBills();
        openPaymentsSheet();
        render();
      } catch (err) {
        toast((err && err.message) ? err.message : '解绑失败');
        drop.disabled = false;
      }
    }
  };
}

const PAY_STATUS = { matched: '已绑定', pending: '待确认', unmatched: '未配对' };

function paymentRowHtml(p) {
  /* 已绑定的只给**解绑**：绑错了要能撤回来。
     解绑不删证据 —— 金额退回待确认，充电流水的金额清空。 */
  if (p.status === 'matched') {
    return `<div class="ocr-row">
      <div class="ocr-row-top">
        <span>¥${fmt(p.amount, 2)} · ${esc(p.paidAt || '时间未知')}</span>
        <b>已绑定</b>
      </div>
      <div class="ocr-cands">
        <button class="ocr-cand" data-unbind="${esc(p.paymentId)}">解绑（绑错了就撤回来）</button>
      </div>
    </div>`;
  }

  const cands = p.candidates || [];
  const statusText = p.status === 'unmatched' ? '没找到对应充电' : '有多条候选';
  return `<div class="ocr-row">
      <div class="ocr-row-top">
        <span>¥${fmt(p.amount, 2)} · ${esc(p.paidAt || '时间未知')}</span>
        <b>${p.stationName ? esc(p.stationName) : (PAY_STATUS[p.status] || statusText)}</b>
      </div>
      <div class="ocr-sec">${statusText} —— 指定它属于哪次充电</div>
      <div class="ocr-cands">
        ${cands.map((c) => `
          <button class="ocr-cand" data-bind="${esc(c.sessionId)}" data-pid="${esc(p.paymentId)}">
            ${fmtTime(c.startTime)} · ${fmt(c.energyKwh, 1)} 度 · ${CAND_KIND[c.kind] || c.kind}
          </button>`).join('')}
        ${cands.length ? '' : '<div class="st-note">时间附近没有充电流水，'
          + '可能是停车费 / 占位费，或这笔是别人付的。先留着，别删。</div>'}
      </div>
    </div>`;
}

/* 补录完 / 配对完都要重新读这三样：
   月份统计（金额的合计与单价会变）、支付队列、识别能力状态。 */
async function refreshChargeBills() {
  /* 月份清单必须一起刷：大数区的「累计」是各月 amount 相加，
     只刷当月流水会让「本月金额」变了、「累计」还是补录前的旧值。 */
  await Promise.all([loadChargeMonths(), loadChargeSessions(), loadPayments(), loadOcrStatus()]);
}

/* ═══════════════════════════════════════════════
   附近充电站
   ───────────────────────────────────────────────
   数据由**服务端**合并两跳后下发：极氪给坐标与枪数，第三方网关给站名与电价。
   前端只吃结构化结果 —— 既不接触签名，也接触不到渠道号，更不会把
   用户坐标发给第三方（服务端只把 stationId 转出去）。

   位置来源是**手机定位**，刻意不用车辆位置：车况接口虽然也带经纬度，
   但人车分离时"车停哪儿"对"我现在要去哪充"毫无帮助，而它又属于隐私数据。
   ═══════════════════════════════════════════════ */

/* 排序：距离升序；价格缺失的站点永远排最后。
   把"没有价格"当 0 排到首位，是这里最典型也最危险的排序错误。 */
function sortStations(list) {
  const copy = list.slice();
  if (state.stationSort === 'price') {
    copy.sort((a, b) => {
      const pa = a.price && a.price.totalPrice != null ? a.price.totalPrice : Infinity;
      const pb = b.price && b.price.totalPrice != null ? b.price.totalPrice : Infinity;
      return (pa - pb) || ((a.distanceKm || 0) - (b.distanceKm || 0));
    });
  } else {
    copy.sort((a, b) => (a.distanceKm || 0) - (b.distanceKm || 0));
  }
  return copy;
}

function stationRow(s) {
  const p = s.price || null;
  const open = state.stationOpen === s.stationId;
  const total = s.totalCount || 0;
  const avail = s.availableCount || 0;

  /* 枪数按快慢充分开显示。上游没给总枪数时**不显示 0/x** ——
     "0 个可用"和"不知道几个可用"是两回事，前者会让人白白放弃一个站。 */
  const guns = [];
  if (s.dcCount) guns.push(`快充 ${s.ableDcCount == null ? '--' : s.ableDcCount}/${s.dcCount}`);
  if (s.acCount) guns.push(`慢充 ${s.ableAcCount == null ? '--' : s.ableAcCount}/${s.acCount}`);
  if (!guns.length && total) guns.push(`可用 ${avail}/${total}`);
  const gunClass = (total && avail === 0) ? 'gone' : 'ok';

  const hasPrice = p && p.totalPrice != null;
  const priceHtml = hasPrice
    ? `${fmt(p.totalPrice, 2)}<span class="u">/度</span>`
    : '<span class="u">价格 --</span>';

  const tags = (s.tags || []).slice(0, 2)
    .map((t) => `<span class="st-tag t">${esc(t)}</span>`).join('');

  return `<div class="st" data-sid="${esc(s.stationId)}">
    <div class="st-head">
      <div class="st-name">${esc(s.name || '未命名站点')}</div>
      <div class="st-price${hasPrice ? '' : ' na'}">${priceHtml}</div>
    </div>
    <div class="st-meta">
      <span>${s.distanceKm == null ? '--' : fmt(s.distanceKm, 2) + ' km'}</span>
      ${guns.length ? `<span class="${gunClass}">${guns.join(' · ')}</span>` : ''}
      ${stationScore(s.score)}
      ${s.selfOperate ? '<span class="st-tag">自营</span>' : ''}
      ${tags}
    </div>
    ${open ? stationDetail(s) : ''}
  </div>`;
}

/* 评分：浩汉 detail 的 peaseScore 对**所有**站点一律返回 "3.8"（抽 20 站验证过，
   滴滴 / 特来电 / 逸安启 / 国网 / 星星 / 吉利浩瀚全一样），是上游的兜底分，不是真实评价。
   一个所有站都相同的分数信息量是零，还会让人以为整张卡的数据都是编的，所以 3.8 不显示；
   哪天真出现差异化评分（4.6 / 4.1 之类）照常显示，不至于把路堵死。 */
function stationScore(v) {
  const n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return '';
  if (n === 3.8) return '';
  return `<span>评分 ${v}</span>`;
}

/* 展开区：分时电价表 + 停车 / 占位费 + 导航。
   当前时段**必须指认出来** —— 用户看这张卡就是为了知道"现在充多少钱"，
   把 7 段电价平铺而不标出当前段，等于让他自己算。 */
function stationDetail(s) {
  const p = s.price;
  if (!p) {
    return `<div class="st-periods">
      <div class="st-period"><span>该站点暂时取不到价格</span><span>--</span></div>
    </div>`;
  }

  const periods = (p.periods || []).map((f) => {
    const now = !!f.timeFrame && f.timeFrame === p.currentPeriod;
    return `<div class="st-period${now ? ' now' : ''}">
      <span>${esc(f.timeFrame || '--')}${now ? ' · 当前' : ''}</span>
      <span>${f.total == null ? '--' : fmt(f.total, 2)} 元/度</span>
    </div>`;
  }).join('');

  /* 设计稿 54:448：展开区补一行枪数 + 一行地址（列表行放不下地址） */
  const g2 = [];
  if (s.dcCount) g2.push(`快充 ${s.ableDcCount == null ? '--' : s.ableDcCount}/${s.dcCount}`);
  if (s.acCount) g2.push(`慢充 ${s.ableAcCount == null ? '--' : s.ableAcCount}/${s.acCount}`);
  const infoRows = [];
  if (g2.length) infoRows.push(`<div class="st-info-l">${g2.join(' · ')}</div>`);
  if (s.address) infoRows.push(`<div class="st-info-l">${esc(s.address)}</div>`);
  const infoHtml = infoRows.length ? `<div class="st-info">${infoRows.join('')}</div>` : '';

  const notes = [];
  if (p.feeDesc) notes.push(esc(p.feeDesc));
  if (p.parkingFee) notes.push(`停车：${esc(p.parkingFee)}${p.parkFree ? '（免费）' : ''}`);
  if (p.holdFee) notes.push('超时占用另收占位费');

  return `
    <div class="st-periods">${periods
      || '<div class="st-period"><span>分时电价未提供</span><span>--</span></div>'}</div>
    ${infoHtml}
    ${notes.length ? `<div class="st-note">${notes.join('<br>')}</div>` : ''}
    <div class="st-actions">
      <button class="st-btn" data-nav="${esc(s.stationId)}">导航到这里</button>
    </div>`;
}

/* 附近充电站：收起态严格按设计（1 条高亮 + 2 条简行），
   展开态沿用原有筛选 / 排序 / 分页列表 —— 功能不丢，视觉按设计。 */
function toggleStations() {
  state.stationsOpen = !state.stationsOpen;
  // 每次开合都重新量一次自然高度（见 render 里的锁高逻辑）
  state.stSheetMinH = 0;
  render();
}

function v2StationRich(s, label, key) {
  const p = s.price || null;
  const hasPrice = p && p.totalPrice != null;
  const guns = [];
  if (s.dcCount) guns.push(`快充 ${s.ableDcCount == null ? '--' : s.ableDcCount}/${s.dcCount}`);
  if (s.acCount) guns.push(`慢充 ${s.ableAcCount == null ? '--' : s.ableAcCount}/${s.acCount}`);
  const meta = [
    s.distanceKm == null ? '--' : fmt(s.distanceKm, 2) + ' km',
    guns.join(' · '),
  ].filter(Boolean).join(' · ');

  return `<div class="v2-st" data-sid="${esc(s.stationId)}" data-pick="${label ? key : ''}">
      <div class="v2-st-h">
        <span class="n">${label ? `<i class="v2-st-pick">${label}</i>` : ''}${esc(s.name || '未命名站点')}</span>
        ${s.selfOperate && label !== '最近自营' ? '<span class="badge">自营</span>' : ''}
      </div>
      <div class="v2-st-m">
        <span class="m">${meta}</span>
        <span class="r">
          ${hasPrice ? `<span class="p">¥${fmt(p.totalPrice, 2)}<span class="u">/kWh</span></span>`
                     : '<span class="p" style="color:#666F7E">价格 --</span>'}
          <button class="v2-btn primary sm"
            onclick="event.stopPropagation();openStationNav('${esc(s.stationId)}')">导航</button>
        </span>
      </div>
    </div>`;
}

function v2StationLine(s, label, key) {
  const p = s.price || null;
  const hasPrice = p && p.totalPrice != null;
  const guns = [];
  if (s.dcCount) guns.push(`快充 ${s.ableDcCount == null ? '--' : s.ableDcCount}/${s.dcCount}`);
  if (s.acCount) guns.push(`慢充 ${s.ableAcCount == null ? '--' : s.ableAcCount}/${s.acCount}`);

  return `<div class="v2-st-line" data-sid="${esc(s.stationId)}" data-pick="${label ? key : ''}">
      <span class="n">${label ? `<i class="v2-st-pick">${label}</i>` : ''}${esc(s.name || '未命名站点')}${guns.length ? `<em>${guns.join(' · ')}</em>` : ''}</span>
      <span class="r">
        <span class="d">${s.distanceKm == null ? '--' : fmt(s.distanceKm, 2) + ' km'}</span>
        <span class="p">${hasPrice ? '¥' + fmt(p.totalPrice, 2) : '--'}</span>
      </span>
    </div>`;
}

function firstOf(list) { return (list && list.length) ? list[0] : null; }

/* 收起态三行：三个不同站点回答三个问题 ——
   最近的自营站（品牌与权益）、最便宜的快充站（省钱）、空闲枪最多的站（不用排队）。
   挑过的站不再给下一行：同一站出现两行会让人以为列表坏了。 */
function pickNearby(sorted) {
  const used = new Set();
  const freeOf = (s) => (s.ableDcCount || 0) + (s.ableAcCount || 0);
  const mark = (s) => { if (s) used.add(s.stationId); return s || null; };

  const self = mark(sorted.find((s) => !used.has(s.stationId) && s.selfOperate));
  /* 最便宜的快充：必须有价、必须是快充；缺价的站不能当 0 元排到第一 */
  const cheap = mark(sorted
    .filter((s) => !used.has(s.stationId) && (s.dcCount || 0) > 0 && s.price && s.price.totalPrice != null)
    .sort((a, b) => (a.price.totalPrice - b.price.totalPrice) || ((a.distanceKm || 0) - (b.distanceKm || 0)))[0]);
  const idle = mark(sorted
    .filter((s) => !used.has(s.stationId) && freeOf(s) > 0)
    .sort((a, b) => (freeOf(b) - freeOf(a)) || ((a.distanceKm || 0) - (b.distanceKm || 0)))[0]);

  return { self, cheap, idle };
}

/* 收起态三行 HTML。收起态与「展开成 Sheet 后的卡片」两处共用 ——
   否则展开一次再收起，三行会退回旧排序。 */
function stationPickRows(sorted) {
  const picks = pickNearby(sorted);
  const rows = [
    { key: 'self',  label: picks.self ? '最近自营' : '最近', site: picks.self || firstOf(sorted) },
    { key: 'cheap', label: '最便宜快充', site: picks.cheap },
    { key: 'idle',  label: '空闲最多',  site: picks.idle },
  ].filter((r) => r.site);
  /* 点的行可能被筛选掉了（比如筛成只有慢充），这时把高亮退回第一行 */
  const activeKey = rows.some((r) => r.key === state.pickKey) ? state.pickKey : 'self';
  return rows
    .map((r) => (r.key === activeKey ? v2StationRich(r.site, r.label, r.key) : v2StationLine(r.site, r.label, r.key)))
    .join('');
}

/* 充电站底部 Sheet（设计 §6.1–6.8，帧 `54:1` / 详情 `54:264`）。
   行、筛选 chip、排序分段都沿用原有 class，事件委托不用改。 */
function v2StationSheet(sorted, countText, filterRow, innerMore) {
  const seg = `<div class="seg v2-seg">
      <button class="${state.stationSort === 'distance' ? 'on' : ''}" data-sort="distance">距离</button>
      <button class="${state.stationSort === 'price' ? 'on' : ''}" data-sort="price">价格</button>
    </div>`;
  const hint = state.stationsPriceOk
    ? '点卡片看分时电价'
    : '价格服务暂时不可用，以下仅显示距离与枪数。';
  const hasFilter = hasStationFilter();

  return `<div class="v2-mask" id="stMask">
    <div class="v2-sheet" role="dialog" aria-label="附近充电站">
      <div class="v2-grip"><i></i></div>
      <div class="v2-sh">
        <span class="t">附近充电站</span>
        <span class="r"><span>${countText}</span><button type="button" onclick="toggleStations()">收起</button></span>
      </div>
      <div class="v2-row2"><span class="m">${hint}</span>${seg}</div>
      <div class="v2-sheet-f">${filterRow}${hasFilter ? '' : ''}</div>
      <div class="v2-sheet-list${state.stationsLoading ? ' is-busy' : ''}" id="stList">${sorted.map(stationRow).join('')}${innerMore}</div>
      <div class="v2-sheet-foot">位置仅用于本次查询，不落盘、不发给第三方。</div>
    </div>
  </div>`;
}

function nearbyStationsCard() {
  // 未登录时服务端会拒绝 /api/stations —— 放出卡片只会诱导用户点一个
  // 必然失败的按钮，那比不显示更糟。
  if (state.mode === 'needLogin') return '';

  const title = (right) => `
    <div class="card-title">
      <span>附近充电站</span>
      <span class="cap-badge">${right}</span>
    </div>`;

  // ① 定位失败 / 环境不支持：**给出具体原因**，否则用户只会以为页面坏了
  if (!state.loc && ['denied', 'error', 'unsupported'].includes(state.locStatus)) {
    return `<div class="card">
      ${title('需定位')}
      <div class="st-note">${esc(state.locError || '无法获取位置')}</div>
      <div class="st-actions">
        <button class="st-btn" onclick="locate(true)">重试定位</button>
      </div>
      <div class="st-actions">
        <input class="st-input" id="manualLoc" placeholder="或手动输入：纬度, 经度">
        <button class="st-btn ghost" style="flex:0 0 62px" onclick="useManualLoc()">使用</button>
      </div>
    </div>`;
  }

  // ② 尚未定位 / 定位中
  if (!state.loc) {
    const busy = state.locStatus === 'locating';
    return `<div class="card">
      ${title(busy ? '定位中' : '待定位')}
      <div class="st-note">${busy
        ? '正在获取当前位置…'
        : '查找充电站需要手机定位。位置只用于本次查询 —— 不落盘，也不会发给第三方。'}</div>
      ${busy ? '' : `<div class="st-actions">
        <button class="st-btn" onclick="locate(true)">获取附近充电站</button>
      </div>`}
    </div>`;
  }

  // ③ 已定位但还没拿到站点
  const list = state.stations || [];

  /* 首次加载：骨架屏。
     **只在一条数据都没有时用** —— 已经有列表时换成骨架，会让内容闪一下再回来，
     那种"闪"比不动还难受；有数据时走下面的 `is-busy` 压暗方案。 */
  if (!list.length && state.stationsLoading) {
    return `<div class="card">
      ${title('加载中')}
      <div class="st-skel">
        ${'<div class="skel-row"><div class="skel-line w70"></div><div class="skel-line w35"></div></div>'
          .repeat(3)}
      </div>
      <div class="st-note">正在查找附近充电站…</div>
    </div>`;
  }

  if (!list.length) {
    /* 有筛选时的空结果**不能**说成"附近没有充电站" —— 那是在撒谎：
       站是有的，只是不符合条件。必须给「清除筛选」，否则用户会以为这地方荒无人烟。 */
    const activeFilter = hasStationFilter();
    return `<div class="card">
      ${title('无数据')}
      <div class="st-note">${activeFilter
        ? '附近没有符合当前筛选条件的站。放宽条件或清除筛选再看看。'
        : (state.locError ? esc(state.locError) : '附近没有查到充电站。')}</div>
      <div class="st-actions">
        ${activeFilter
          ? '<button class="st-btn" data-streset="empty">清除筛选</button>'
          : '<button class="st-btn ghost" onclick="locate(true)">重新定位</button>'}
      </div>
    </div>`;
  }

  const sorted = sortStations(list);
  if (QUERY_OPEN === 'station' && !state.stationOpen && sorted.length) {
    state.stationOpen = sorted[0].stationId;
  }
  /* 头部写「已加载 / 总数」而不是只写总数 ——
     否则「50 站」配着 10 条列表，会被当成"剩下的没加载出来"。
     用价格类条件（停车费）筛时**不能**写分母：那种筛选要先取价才知道结果，
     服务端只扫固定范围，total 是候选数而不是匹配总数。
     ⚠️ 文案不要写「按电价筛选」—— 现在唯一的价格类筛选入口是「停车免费」。 */
  const countText = state.stationsPriceFiltered
    ? `${state.stations.length} 站 · 已筛选`
    : (state.stationsHasMore || state.stations.length < state.stationsTotal
        ? `${state.stations.length} / ${state.stationsTotal} 站`
        : `${state.stationsTotal} 站`);

  /* 筛选 chip。两组互斥（枪型 / 电价上限）用"点已选中的即取消"实现，
     不加「不限」按钮 —— 少一个按钮就少一次误点。 */
  const f = state.stationFilter || {};
  const chip = (label, on, attr) =>
    `<button class="st-chip${on ? ' on' : ''}" ${attr}>${label}</button>`;
  const filterRow = `<div class="st-filter">
    ${chip('快充', f.connector === 'dc', 'data-f="connector" data-v="dc"')}
    ${chip('极氪自营', !!f.selfOnly, 'data-f="selfOnly"')}
    ${chip('停车免费', !!f.parkFree, 'data-f="parkFree"')}
    ${hasStationFilter() ? '<button class="st-chip reset" id="stFilterReset">清除</button>' : ''}
  </div>`;

  /* 列表固定高度、自己滚（见 CSS `.st-list`）。
     没有"展开全部"——卡片高度一开始就是最终高度，位置不再跳。
     分页由**内层列表**滚到底触发（见文件末尾），页面滚动不参与。 */
  /* 分页只靠滑动：列表内层滚到底自动取下一页（见 watchStationsSentinel 与文件末尾的 scroll 兜底），
     底部只留一行状态，不做成按钮 —— 有个按钮就让「再点一次」变成默认动作，
     而这张卡本身已经能滚，按钮纯属多此一举。 */
  const innerMore = state.stationsLoadingMore
    ? '<div class="st-more">正在加载更多…</div>'
    : (state.stationsHasMore
        ? '<div class="st-more" id="stMoreSentinel">上滑加载更多</div>'
        : (sorted.length ? '<div class="st-more">已全部显示</div>' : ''));

  const open = !!state.stationsOpen;
  const headRow = (right) => `<div class="v2-cardhead">
      <span class="v2-card-t">附近充电站</span>
      <button class="v2-link" onclick="toggleStations()">${right}</button>
    </div>`;

  if (!open) {
    return `<div class="card">
      ${headRow(state.stationsLoading ? '更新中 ›' : `${countText} ›`)}
      ${stationPickRows(sorted)}
    </div>`;
  }

  /* 展开态按「设计规格.md §6」改成底部 Sheet（`54:1`）：
     卡本身退回收起态外观，完整列表浮在 Sheet 里，明细就地展开。 */
  /* 三行各是一类推荐位；点某行 → 它换成高亮行，其余两行退成简行。
     没有自营站时第一行退化为「最近的站」—— 空着比退一步更糟。 */
  return `<div class="card">
    ${headRow(`${countText} ›`)}
    ${stationPickRows(sorted)}
  </div>` + v2StationSheet(sorted, countText, filterRow, innerMore);
}

/* 一键导航：交给系统/地图 App，不在本页画地图 ——
   画地图要引入瓦片、手势与坐标系纠偏，成本远高于收益。

   两个参数缺一不可：
   · `navigation` 而不是 `marker` —— 用户点的是「导航到这里」，要的是路线；
     `marker` 只会在地图上戳一个点，没有规划。
   · `callnative=1` —— 高德官方文档写明该参数**默认 0**，不传就只在浏览器里
     打开 H5 网页版。这正是此前"跳到浏览器高德"的原因。
   不传 `from`：高德移动端会自动用「我的位置」作起点（PC 端无效，但本页是手机用）。
   坐标用 `coordinate=gaode`，因为站点坐标本身就是 GCJ-02。 */
function openStationNav(stationId) {
  const s = (state.stations || []).find((x) => x.stationId === stationId);
  if (!s || s.lat == null || s.lng == null) { toast('该站点缺少坐标，无法导航'); return; }
  askNavConfirm(s);
}

/* 跳外部地图 App 前先确认：列表行高 42、按钮就在拇指落点附近，误触会直接离开本页。
   结构照 iOS alert（标题 / 说明 / 取消 + 主按钮），默认焦点放在「取消」，
   回车不会误跳；Esc 与点遮罩同样取消。 */
function askNavConfirm(s) {
  const host = document.createElement('div');
  host.className = 'v2-alert-mask';
  const box = document.createElement('div');
  box.className = 'v2-alert';
  box.setAttribute('role', 'alertdialog');
  box.setAttribute('aria-modal', 'true');
  const t = document.createElement('div'); t.className = 't';
  t.textContent = '用地图导航？';
  const m = document.createElement('div'); m.className = 'm';
  m.textContent = '将打开地图 App 规划到「' + (s.name || '充电站') + '」的驾车路线，会离开 ZeekrDash。';
  const acts = document.createElement('div'); acts.className = 'acts';
  const no = document.createElement('button'); no.className = 'v2-btn ghost'; no.textContent = '取消';
  const yes = document.createElement('button'); yes.className = 'v2-btn primary'; yes.textContent = '打开地图';
  acts.append(no, yes); box.append(t, m, acts); host.append(box);
  document.body.append(host);
  const onKey = (ev) => { if (ev.key === 'Escape') close(); };
  const close = () => { host.remove(); document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  host.addEventListener('click', (ev) => { if (ev.target === host) close(); });
  no.addEventListener('click', close);
  yes.addEventListener('click', () => { close(); doStationNav(s); });
  requestAnimationFrame(() => no.focus());
}

function doStationNav(s) {
  const name = encodeURIComponent(s.name || '充电站');
  const url = `https://uri.amap.com/navigation?to=${s.lng},${s.lat},${name}`
    + '&mode=car&policy=0&coordinate=gaode&callnative=1&src=zeekrdash';
  window.open(url, '_blank');
}

/* ── 定位 ──
   唯一的位置来源是手机定位。坐标只在内存里活到本次查询结束：
   不写 localStorage、不进日志、不随请求发给第三方网关。 */
function locate(force) {
  if (state.mode === 'mock' || state.mode === 'offline') {
    // 预览兜底数据已经带了位置，无需（也做不到）真去定位
    state.locStatus = 'ok';
    render();
    return;
  }
  // 未登录时连 /api/stations 都调不了，此时弹权限框纯属骚扰
  if (state.mode === 'needLogin') return;
  if (!navigator.geolocation) {
    state.locStatus = 'unsupported';
    state.locError = '当前环境不支持定位：浏览器只在 HTTPS 或 localhost 下提供定位能力。';
    render();
    return;
  }
  if (state.locStatus === 'locating' && !force) return;

  state.locStatus = 'locating';
  state.locError = '';
  render();

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.locStatus = 'ok';
      loadStations().then(render);
    },
    (err) => {
      // 1 = 用户拒绝；2 = 位置不可用；3 = 超时
      state.locStatus = err.code === 1 ? 'denied' : 'error';
      state.locError = err.code === 1
        ? '定位权限被拒绝。可在浏览器地址栏左侧重新允许，或手动输入坐标。'
        : `定位失败（${err.message || '超时或位置不可用'}）。可重试，或手动输入坐标。`;
      render();
    },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 },
  );
}

/* 手动兜底：坐标只留在前端内存，与定位结果走同一条加载路径。
   存在意义：局域网 HTTP 访问时浏览器**不提供**定位能力，
   没有这条退路，那种环境下的充电页永远是空的。 */
function useManualLoc() {
  const el = document.getElementById('manualLoc');
  const parts = ((el && el.value) || '').split(/[\s,，]+/).filter(Boolean).map(Number);
  if (parts.length !== 2 || !parts.every(Number.isFinite)) {
    toast('请输入「纬度, 经度」，例如 31.2304, 121.4737');
    return;
  }
  const [lat, lng] = parts;
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) { toast('坐标超出有效范围'); return; }
  state.loc = { lat, lng };
  state.locStatus = 'ok';
  state.locError = '';
  loadStations().then(render);
}

/* 每页条数。
   为什么是 10 而不是 20：取价格是**按站请求**第三方网关的（并发 6），
   首屏 10 个只要 2 轮，20 个要 4 轮 —— 这正是"充电桩加载慢"的主因。
   而用户通常只看最前面几个，剩下的滑到再取更划算。 */
const STATIONS_PAGE_SIZE = 10;

/* 是否启用了任一筛选 */
function hasStationFilter() {
  const f = state.stationFilter || {};
  return !!(f.connector || f.maxPrice != null || f.selfOnly || f.parkFree);
}

/* 筛选条件 → query 串（未设置的不拼）。
   **筛选由服务端执行**，因为它必须在切片之前生效：
   只在前端过滤已加载的 10 条，会把"筛出 2 个"说成"附近只有 2 个"。 */
function stationFilterQuery() {
  const f = state.stationFilter || {};
  let query = '';
  if (f.connector) query += `&connector=${encodeURIComponent(f.connector)}`;
  if (f.maxPrice != null) query += `&max_price=${encodeURIComponent(f.maxPrice)}`;
  if (f.selfOnly) query += '&self_only=true';
  if (f.parkFree) query += '&park_free=true';
  return query;
}

/* 切换某个筛选项。
   「快充」是单选：再点一次＝取消（不额外加「不限」按钮，少一个控件少一次误点）。
   自营 / 停车免费直接取反。
   ⚠️ `maxPrice` 字段仍然保留在 state 与后端参数里，只是**界面上不再给入口** ——
      三个电价档位 chip 长得太占地方。要恢复只需在 `filterRow` 里加回 chip。 */
function toggleStationFilter(field, value) {
  const f = { ...(state.stationFilter || {}) };
  if (field === 'connector') {
    f.connector = f.connector === value ? '' : value;
  } else {
    f[field] = !f[field];
  }
  state.stationFilter = f;
  // 条件变了就从头查：接着用旧 offset 会把上一组条件的结果混进来
  // 必须 .then(render)：loadStations 只在**请求前**渲染一次 loading，
  // 响应回来只写 state、不重绘。少了这一句，筛选结果要等下一次交互才出现在屏幕上。
  loadStations().then(render);
}

/* 演示 / 离线模式下没有后端可查，筛选只能在本地对 MOCK 全量做。
   规则**必须与后端一致**（枪型/自营看气泡字段，电价/停车看 price），
   否则会出现"演示里能筛、真机筛不了"的假象。 */
function applyMockStationFilters() {
  const f = state.stationFilter || {};
  const filtered = (MOCK.stations || []).filter((s) => {
    if (f.connector === 'dc' && !(s.dcCount > 0)) return false;
    if (f.connector === 'ac' && !(s.acCount > 0)) return false;
    if (f.selfOnly && s.selfOperate !== true) return false;
    if (f.maxPrice != null) {
      const price = s.price && s.price.totalPrice;
      // 没价格不算"低于 X 元" —— 与后端同一条原则：拿不到就不猜
      if (typeof price !== 'number' || price > f.maxPrice) return false;
    }
    if (f.parkFree && !(s.price && s.price.parkFree === true)) return false;
    return true;
  });

  state.stations = filtered;
  state.stationsTotal = filtered.length;
  state.stationsOffset = filtered.length;
  state.stationsNextOffset = filtered.length;
  state.stationsHasMore = false;
  state.stationsPriceFiltered = f.maxPrice != null || f.parkFree === true;
}

async function loadStations() {
  if (!state.loc) return false;
  if (state.mode === 'mock' || state.mode === 'offline') {
    // 也要推进序号：切换到演示数据时，把还在飞的真实请求作废掉
    state.stationsSeq += 1;
    applyMockStationFilters();
    render();
    return true;
  }
  /* 先占序号，再发请求。`await` 之后凡是"序号已经不是最新"的响应一律丢弃。 */
  state.stationsSeq += 1;
  const seq = state.stationsSeq;
  state.stationsLoading = true;
  state.stationsOffset = 0;
  state.stationsNextOffset = 0;
  state.stationsHasMore = false;
  render();
  try {
    const data = await api(
      `/api/stations/nearby?lat=${state.loc.lat}&lng=${state.loc.lng}`
      + `&limit=${STATIONS_PAGE_SIZE}&offset=0` + stationFilterQuery());
    if (seq !== state.stationsSeq) return false;   // 有更新的查询在飞，本次结果作废
    state.stations = data.stations || [];
    state.stationsTotal = data.total == null ? state.stations.length : data.total;
    state.stationsOffset = state.stations.length;
    /* 分页游标与"还有没有下一页"都用**服务端字段**。
       带电价筛选时 nextOffset 会大于已加载条数（中间扫描掉、不符合条件的候选不返回），
       自己拿 count 推算会重复请求同一段，表现就是"翻页翻不动"。 */
    state.stationsNextOffset =
      data.nextOffset == null ? state.stations.length : data.nextOffset;
    state.stationsHasMore =
      data.hasMore == null
        ? state.stations.length < state.stationsTotal
        : data.hasMore === true;
    // 带电价筛选时 total 只是候选数，不能当"匹配总数"显示
    state.stationsPriceFiltered = data.priceFilterApplied === true;
    // 显式判 `!== false`：后端不返回该字段时按"有价格"处理，避免误报不可用
    state.stationsPriceOk = data.priceAvailable !== false;
    state.locError = '';
    return true;
  } catch (e) {
    if (seq !== state.stationsSeq) return false;   // 过期请求的失败不该清屏
    console.warn('附近充电站加载失败', e);
    state.stations = [];
    state.stationsPriceOk = false;
    state.locError = e.message;
    return false;
  } finally {
    // 只有最新那次才有权收掉"更新中" —— 否则先完成的旧请求会让指示提前消失，
    // 而此时新请求还在飞。
    if (seq === state.stationsSeq) state.stationsLoading = false;
  }
}

/* 取下一页。唯一触发点是**内层列表**滚到底（见 watchStationsSentinel 与文件末尾），
   页面滚动不参与，也不再有点击按钮。 */
async function loadMoreStations() {
  if (!state.loc || state.stationsLoadingMore || !state.stationsHasMore) return;

  // 记下这一页属于哪次查询：翻页途中若改了筛选，这批数据就属于旧条件，不能追加
  const seq = state.stationsSeq;
  state.stationsLoadingMore = true;
  render();
  try {
    const data = await api(
      `/api/stations/nearby?lat=${state.loc.lat}&lng=${state.loc.lng}`
      + `&limit=${STATIONS_PAGE_SIZE}&offset=${state.stationsNextOffset}`
      + stationFilterQuery());
    const more = data.stations || [];
    // 条件已变：这一页属于旧筛选，追加进去就是"筛选结果里混进不符合条件的站"
    if (seq !== state.stationsSeq) return;

    /* 按 stationId 去重再追加。
       正常切片不会重复，但距离相同的站点排序可能抖动（服务端 sort 不保证稳定），
       真重了会在列表里出现两行同一个站 —— 这条保险很便宜。 */
    const seen = new Set((state.stations || []).map((s) => s.stationId));
    const fresh = more.filter((s) => !seen.has(s.stationId));
    state.stations = (state.stations || []).concat(fresh);

    state.stationsTotal = data.total == null ? state.stations.length : data.total;
    state.stationsOffset += more.length;
    state.stationsNextOffset =
      data.nextOffset == null ? state.stationsOffset : data.nextOffset;
    /* 是否还有下一页以服务端为准，再叠加一条兜底：本页一条新的都没进来就停。
       上游若忽略 offset 反复回同一页，去重会让 stations.length 永远不增长，
       「已加载 < total」恒成立 ⇒ 无限翻页 —— 这正是此前"一直渲染"的直接原因。 */
    const serverHasMore =
      data.hasMore == null
        ? state.stations.length < state.stationsTotal
        : data.hasMore === true;
    state.stationsHasMore = serverHasMore && fresh.length > 0 && more.length > 0;
    state.stationsPriceFiltered = data.priceFilterApplied === true;
    state.stationsPriceOk = state.stationsPriceOk && data.priceAvailable !== false;
  } catch (e) {
    if (seq !== state.stationsSeq) return;
    console.warn('加载更多充电站失败', e);
    // 失败就停在当前页，别让滚动监听反复重试打接口
    state.stationsHasMore = false;
  } finally {
    // 这个标志必须**无条件**清：它是个全局锁，留着会让之后的翻页永远进不来。
    // 但只有仍属于当前查询时才重绘（过期渲染会把新结果冲掉）。
    state.stationsLoadingMore = false;
    if (seq === state.stationsSeq) render();
  }
}

/* 分页哨兵：滚到列表底部看到「上滑加载更多」时自动取下一页。
   · root 用真正的滚动容器 `.st-list`，不是窗口 —— 这张卡是内层滚动；
   · render() 每次都重建 DOM，哨兵是全新节点，所以每次重新 observe，
     同时把旧 observer disconnect（否则每翻一页攒一个观察者）；
   · 新一页把哨兵推出可视区后 IO 不会再回调，所以不会连环把 680 条一次拉完 ——
     一次滑动换一页，这是刻意的。 */
let stSentinelIO = null;
function watchStationsSentinel() {
  if (stSentinelIO) { stSentinelIO.disconnect(); stSentinelIO = null; }
  const list = document.getElementById('stList');
  const sentinel = document.getElementById('stMoreSentinel');
  if (!list || !sentinel || !state.stationsHasMore || state.stationsLoadingMore) return;
  stSentinelIO = new IntersectionObserver((entries) => {
    if (entries.some((en) => en.isIntersecting)) loadMoreStations();
  }, { root: list, rootMargin: '0px 0px 64px 0px' });
  stSentinelIO.observe(sentinel);
}
