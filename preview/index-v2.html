/* ─────────── 账号登录 ───────────
   为什么另起一套请求函数：预览页在「地址指向本机」时会走内置模拟数据、
   完全不发请求（这样没有后端也能看设计）。但登录不能这样 —— 会话存在
   服务端，必须真的请求，否则 debug 页拿不到登录态。
   所以 apiNoMock() 跳过那层判断，只用于登录相关接口。 */
/* 给 fetch 加超时。
   `fetch` 本身没有超时：后端没起、地址写错、被防火墙拦下时请求会一直挂着，
   界面就永远停在"加载中"，用户既看不到原因也走不开。
   `AbortSignal.timeout` 是较新的 API，用 `AbortController` 自己计时兜底，
   老浏览器上也能工作。 */
function withTimeout(ms) {
  if (typeof AbortController === 'undefined') return {};
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return { signal: ctrl.signal, done: () => clearTimeout(timer) };
}

async function apiNoMock(path, opts) {
  netBegin();   // 登录/诊断也要有反馈：那几步恰恰是用户盯着看的时候
  try {
    /* 超时保护：`fetch` 不自带超时，后端没起 / 地址写错 / 被防火墙拦下时
       请求会一直挂着 —— 登录状态那栏就会永远停在"正在查询…"，
       用户既看不到原因也走不开。加一道 12 秒的闸。 */
    const t = withTimeout(12000);
    let res;
    try {
      res = await fetch(API_SOURCE + path, withAuth(Object.assign({
        headers: { 'Content-Type': 'application/json' },
      }, opts || {})), t.signal ? { signal: t.signal } : undefined);
    } finally {
      if (t.done) t.done();
    }

    let json = null;
    try { json = await res.json(); } catch (_) { /* 可能没有响应体 */ }

    if (!res.ok) {
      const detail = (json && (json.detail || json.error)) || ('HTTP ' + res.status);
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    if (json && json.success === false) throw new Error(json.error || '服务端返回失败');
    return json && typeof json === 'object' && 'data' in json ? json.data : json;
  } catch (err) {
    /* 网络层失败要说清是"连不上"，别把浏览器的原始报错抛给用户。
       `api()` 里已经是这个口径（"连不上后端 <地址>：<原因>"），
       这里对齐 —— 否则登录失败时用户看到的是 "Failed to fetch"。 */
    if (err && (err.name === 'TimeoutError' || err.name === 'AbortError')) {
      throw new Error('连不上后端 ' + API_SOURCE + '：请求超时（12 秒无响应）');
    }
    /* 网络层失败在浏览器里是 `TypeError: Failed to fetch`，
       但不同浏览器 / 代理的措辞不一（"NetworkError" / "Load failed"…），
       所以按「消息里没有 HTTP 状态码、且不是我们自己抛的业务错误」来判断，
       而不是死认 TypeError。 */
    if (err && err.name === 'TypeError') {
      throw new Error('连不上后端 ' + API_SOURCE + '：' + String(err.message));
    }
    throw err;
  } finally {
    netEnd();
  }
}

async function loadAuth() {
  state.authLoading = true;
  try {
    state.auth = Object.assign({}, await apiNoMock('/api/auth/status'), { error: null });
  } catch (err) {
    state.auth = { error: err.message, authenticated: false };
  } finally {
    state.authLoading = false;
  }
  render();
}

let authBusy = false;

async function authSendCode() {
  const el = document.getElementById('authPhone');
  const phone = ((el && el.value) || '').trim();
  if (!/^\d{11}$/.test(phone)) { toast('请输入 11 位手机号'); return; }
  if (authBusy) return;
  authBusy = true;

  const btn = document.getElementById('authSendBtn');
  if (btn) { btn.disabled = true; btn.textContent = '发送中'; }
  try {
    const r = await apiNoMock('/api/auth/sendCode', {
      method: 'POST', body: JSON.stringify({ phone }),
    });
    toast((r && r.message) || '验证码已发送，请查看短信');
    const code = document.getElementById('authCode');
    if (code) code.focus();
  } catch (err) {
    toast('发送失败：' + err.message);
  } finally {
    authBusy = false;
    const b = document.getElementById('authSendBtn');
    if (b) { b.disabled = false; b.textContent = '发送验证码'; }
  }
}

async function authLogin() {
  const phoneEl = document.getElementById('authPhone');
  const codeEl = document.getElementById('authCode');
  const phone = ((phoneEl && phoneEl.value) || '').trim();
  const code = ((codeEl && codeEl.value) || '').trim();
  if (!/^\d{11}$/.test(phone)) { toast('请输入 11 位手机号'); return; }
  /* 后端收 4–8 位（mock 客户端只认 6 位，别在客户端提前拦掉 7–8 位） */
  if (!/^\d{4,8}$/.test(code)) { toast('请输入 4–8 位短信验证码'); return; }
  if (authBusy) return;
  authBusy = true;

  const btn = document.getElementById('authLoginBtn');
  if (btn) { btn.disabled = true; btn.textContent = '登录中'; }
  try {
    await apiNoMock('/api/auth/verifyCode', {
      method: 'POST', body: JSON.stringify({ phone, code }),
    });
    toast('登录成功');
    await loadAuth();
    // 换了账号/刚登录：之前的"已加载"记录作废；只拉当前 tab 需要的数据
    clearLoadedKeys();
    /* 登录成功后直接落到车况页（2026-10-25 用户要求）：
       登录入口在设置页，登录完还停在设置页得自己再点一次底部导航。
       goTab 内部会 render 并触发 ensureTabData('dash')，加载完再自己重绘。 */
    goTab('dash');
  } catch (err) {
    toast('登录失败：' + err.message);
  } finally {
    authBusy = false;
    const b = document.getElementById('authLoginBtn');
    if (b) { b.disabled = false; b.textContent = '登录'; }
  }
}

async function authLogout() {
  if (authBusy) return;
  authBusy = true;
  try {
    await apiNoMock('/api/auth/logout', { method: 'POST' });
    toast('已退出登录');
    // 退出后清掉已加载的数据 —— 否则页面上还留着上一位用户的车辆信息
    state.status = null; state.trips = []; state.trend = [];
    state.charge = null; state.chargeMonths = []; state.chargeMonth = 'currentMonth';
    state.chargeYm = 'currentMonth'; state.chargeYmFailed = null; state.health = null;
    /* 行程侧也有「月份筛选 / 天数切换 / 推荐位高亮 / 权限展开」这些展示态，
       都是上一位用户点出来的，换人登录不该继承。 */
    state.yearMonth = 'currentMonth'; state.energy = null; state.energyWindow = null;
    state.energyError = ''; state.days = 7;
    state.pickKey = 'self';
    state.permExpanded = false;
    /* 补录的金额与核对中的截图同样是个人数据，退出即清 */
    state.payments = []; state.ocrRows = null; state.ocrPick = {}; state.ocrImageSha = '';
    state.chargeHasData = false;
    /* 同步时间也要清：换个人登录，"同步于 14:07"不该还是上一位的时间，
       而且不清的话"跨天判断"会误以为今天已经同步过了 */
    clearChargeSynced();
    state.capabilities = null; state.permissions = null;
    /* 车辆位置同样是个人数据，退出即清 —— 不能让下一位登录者看到上一位的车停在哪 */
    state.location = null;
    /* 气温是按定位查的，也属于"车在哪"的衍生信息，一并清掉 */
    state.weather = null;
    /* 充电站与**坐标**一并清掉：坐标属于个人位置数据，不该跨会话留存，
       而且它只对"这一次查询"有意义。 */
    state.stations = null; state.stationsTotal = 0; state.stationsPriceOk = true;
    state.loc = null; state.locStatus = 'idle'; state.locError = ''; state.stationOpen = '';
    // "已加载"记录也要清：否则重登后会被判定成"这页已经取过了"，页面永远空着
    clearLoadedKeys();
    await loadAuth();
    state.mode = 'needLogin';
    render();
  } catch (err) {
    toast('退出失败：' + err.message);
  } finally {
    authBusy = false;
  }
}

/* 登录卡片：在查 / 没去查 / 连不上后端 / 已登录 / 未登录 五种形态 */
function authCard() {
  const a = state.auth;

  /* `a === null` 有两种含义，必须分开：
     ① 在查（`authLoading`）→ 显示"正在查询…"；
     ② **压根没去查** —— 预览页默认不连后端（`CONNECT_BACKEND` 为假），
        `bootstrap()` 直接 seedMock 返回，一个请求都不发。
        这时说"正在查询登录状态…"会永远转下去：没有请求在飞，
        也没有会到来的结果。必须明说"未连接后端"。 */
  if (a === null) {
    if (state.authLoading) {
      return `<div class="auth-note">正在查询登录状态…</div>`;
    }
    return `
      <div class="auth-note warn">未连接后端，没有查询登录状态</div>
      <div class="auth-note">
        预览页默认不请求后端（便于没有服务时也能看设计）。
        要登录请在 debug 页打开「连接后端」，或用带 <code>?api=</code> 参数的地址打开本页。
      </div>`;
  }
  if (a.error) {
    return `
      <div class="auth-note warn">无法连接后端：${esc(a.error)}</div>
      <div class="auth-note">
        预览页在「地址指向本机」时默认不请求后端（便于没有服务时也能看设计）。
        要登录请在 debug 页操作，或用带 <code>?api=</code> 参数的地址打开本页。
      </div>`;
  }
  if (a.authenticated) {
    return `
      <div class="auth-who">
        <span class="ico">${SVG.phone}</span>
        <div>
          <div class="t">已登录</div>
          <div class="d">${a.mock ? '模拟数据模式' : '真实数据模式'} · 会话保存在服务端</div>
        </div>
        <button class="auth-btn ghost" style="margin-left:auto"
                onclick="authLogout()">退出登录</button>
      </div>
      <div class="auth-note">${esc(a.note || '')}</div>`;
  }
  return `
    <div class="auth-row">
      <input class="auth-input" id="authPhone" type="tel" inputmode="numeric"
             placeholder="极氪账号手机号（建议用子账号）" autocomplete="tel">
    </div>
    <div class="auth-row">
      <input class="auth-input code" id="authCode" type="text" inputmode="numeric"
             placeholder="验证码" autocomplete="one-time-code">
      <button class="auth-btn" id="authSendBtn" onclick="authSendCode()">发送验证码</button>
    </div>
    <div class="auth-row">
      <button class="auth-btn" id="authLoginBtn" style="flex:1" onclick="authLogin()">登录</button>
    </div>
    <div class="auth-note warn">
      登录会踢掉该账号在手机 App 上的会话 —— 建议用子账号并共享车辆。
    </div>`;
}

function renderSettings() {
  const h = state.health || {};
  const caps = state.capabilities || {};

  const statusMap = {
    live:      { text: '已连接 · ' + (API_SOURCE || '本机'), color: '#0F7F58', dot: '#0F7F58' },
    offline:   { text: '离线 · 模拟数据', color: '#B23350', dot: '#B23350' },
    mock:      { text: '模拟数据 · 未连接', color: '#8A5A12', dot: '#8A5A12' },
    needLogin: { text: '未登录', color: '#5E6775', dot: '#5E6775' },
  };
  const conn = statusMap[state.mode] || statusMap.needLogin;

  /* 权限包：上排 4 个 chip 与下方列表的共同数据源，先算出来。
     原版 index.html 的 capabilityCard() 把 /ms-app-bff/api/1.0/permissions 的 20+ 项
     摊开展示（前 6 项 + 省略号展开，理由见那里的注释「让为什么某些按钮不见了变得可解释」）。
     v2 之前只画了上排 4 个 chip，等于把「这台车到底开通了什么」整段丢掉。 */
  const PERM_HIDDEN = new Set(['half_load_260']);
  const permAll = (Array.isArray(state.permissions) ? state.permissions : [])
    .filter((x) => !PERM_HIDDEN.has(x));

  /* 只展示极氪权限接口真实返回的项，不再自己编一排功能 chip：
     车控/充电/定位/行程那四颗原本一半来自本地开关、一半靠 caps 猜，容易说谎。 */

  const permExpanded = state.permExpanded === true;
  const PERM_PREVIEW = 6;
  const permShown = permExpanded ? permAll : permAll.slice(0, PERM_PREVIEW);
  const permMore = permAll.length > PERM_PREVIEW;

      : '');
  /* 后端明确判定“没有此项”的能力（原版 capabilityCard 的灰项；
     胎压/空调这类硬件能力后端不下判断，永远不会出现在这里） */
  const offKeys = Object.keys(CAP_LABELS).filter((k) => k in caps && caps[k] === false);

  /* 登录成功后这两块对用户就没意义了：连接状态已由各屏数据本身证明，
     调试入口是给开发看的。只在未登录 / 连不上后端时才展示，用来排查配置（m02456）。 */
  const loggedIn = isLoggedIn();

/* ═══════════════════════════════════════════════
   渲染调度
   ═══════════════════════════════════════════════ */
function render() {
  const view = $('#view');

  // 未登录：除「设置」（登录表单在那里）外一律显示登录引导，
  // 不渲染任何依赖数据的内容
  if (state.mode === 'needLogin' && state.tab !== 'settings') {
    view.innerHTML = renderLoginWall();
    return;
  }

  /* 单个渲染器抛错会让整页白屏（view.innerHTML 根本不会被赋值），
     比「少一块卡」严重得多：兜住异常，栈打到控制台，页面上给一条能看懂的提示。 */
  let html = '';
  try {
    html = {
      dash: renderDashboard,
      trips: renderTrips,
      charges: renderCharges,
      ctrl: renderControls,
      settings: renderSettings,
    }[state.tab]();
  } catch (e) {
    console.error('渲染失败', state.tab, e);
    html = `<div class="v2-card"><div class="v2-empty">
      <div class="t">这一页没有渲染出来</div>
      <div class="d">${esc((e && e.message) ? String(e.message) : '未知错误')}。刷新页面可以重试。</div>
    </div></div>`;
  }

  // 内层列表的滚动位置要在重建 DOM 前记下来。
  // 展开态的站点列表靠"滚到底"翻页，而翻页会 render() 一次 ——
  // 不还原的话新一页一到，列表就弹回顶部，用户等于被打回起点。
  const prevList = document.getElementById('stList');
  const prevListTop = prevList ? prevList.scrollTop : 0;

  view.innerHTML = html;

  /* 充电站 Sheet 定高：筛选会改变列表行数，若面板高度跟着 hug_contents 走，
     点一下 chip 顶边就抽一下。打开时量一次自然高度当 min-height 下限，
     本次打开期间只增不减；行数超过 min-height 时仍可长到 max-height 并内部滚动。 */
  const sheetEl = document.querySelector('.v2-sheet');
  if (sheetEl) {
    if (!state.stSheetMinH) state.stSheetMinH = Math.round(sheetEl.getBoundingClientRect().height);
    if (state.stSheetMinH) sheetEl.style.minHeight = state.stSheetMinH + 'px';
  }

  if (prevListTop > 0) {
    const nextList = document.getElementById('stList');
    if (nextList) nextList.scrollTop = prevListTop;
  }

  // 图表延后绘制（需等布局完成）
  requestAnimationFrame(() => {
    if (state.tab === 'trips') {
      /* 两张图的横向滚动联动：滑任意一张，另一张同步 —— 核对同一天的里程与电耗。
         syncing 标记避免互相触发形成死循环。 */
      const scrollers = Array.from(document.querySelectorAll('.v2-chart-scroll'));
      if (scrollers.length === 2) {
        let syncing = false;
        scrollers.forEach((box, index) => {
          box.addEventListener('scroll', () => {
            if (syncing) return;
            syncing = true;
            const other = scrollers[1 - index];
            if (other && other.scrollLeft !== box.scrollLeft) other.scrollLeft = box.scrollLeft;
            requestAnimationFrame(() => { syncing = false; });
          }, { passive: true });
        });
      }
    }
    if (state.tab === 'charges') watchStationsSentinel();
  });

  /* 地图缩略图：URL 里不带令牌，改成 fetch 带 Authorization 头取回再挂 objectURL */
  hydrateAuthImages();
}

/* ═══════════════════════════════════════════════
   数据加载
   ═══════════════════════════════════════════════ */
state.loading = false;
state.lastRefresh = null;

/* 徽标：文本 + data-mode（驱动状态圆点配色）
   真实数据无需标识，直接隐藏；只有模拟数据才显示 */
function setModeBadge(text, mode) {
  const badge = $('#modeBadge');
  if (!badge) return;
  if (!text) {
    badge.classList.add('hidden');
    badge.dataset.mode = mode || '';
    return;
  }
  badge.classList.remove('hidden');
  badge.textContent = text;
  badge.dataset.mode = mode;
}

/* 按当前 state.mode 刷新徽标 */
function syncModeBadge() {
  switch (state.mode) {
    case 'live':
      setModeBadge('', 'live');                                   // 真实数据：不显示
      break;
    case 'offline':
      setModeBadge('模拟数据 · 后端不可达', 'offline');
      break;
    default:
      setModeBadge('模拟数据', 'mock');
  }
}

/* 各加载器返回是否成功，供 `ensureTabData` 判定后端可用性 */
async function loadHealth() {
  try {
    state.health = await api('/api/health');
    return true;
  } catch {
    state.health = null;
    return false;
  }
}

async function loadStatus() {
  state.statusLoading = true;
  state.statusError = '';
  // 先记下上一拍的充电状态，用来判断"充电结束"这个跳变
  const wasCharging = !!(state.status && state.status.isCharging);
  try {
    state.status = await api('/api/vehicle/status');
    const d = new Date();
    state.lastRefresh = String(d.getHours()).padStart(2, '0') + ':' +
                       String(d.getMinutes()).padStart(2, '0');
    /* 充电中 → 未充电：这是唯一会产生新充电流水的时刻，安排一次同步。
       放在这里而不是定时器里，是因为轮询间隔本来就跟着充电状态走
       （充电中 60 秒一次），跳变一定能被捕捉到。 */
    if (wasCharging && state.status && state.status.isCharging !== true) {
      scheduleChargeSyncAfterCharging();
    }
    return true;
  } catch (e) {
    console.warn('状态加载失败', e);
    state.statusError = (e && e.message) ? String(e.message) : '读取失败';
    return false;
  } finally {
    state.statusLoading = false;
  }
}

/* 车辆位置：地址与静态图都由服务端转第三方，前端只吃结构化结果。
   **独立于车况加载成败** —— 位置取不到不该让整页掉进模拟数据。 */
async function loadLocation() {
  try {
    state.location = await api('/api/vehicle/location');
    return true;
  } catch (e) {
    console.warn('位置加载失败', e);
    state.location = null;
    return false;
  }
}

/* 当地气温。**独立于位置加载**：位置卡挂了（腾讯或网关抽风）不该顺带把温度也弄没，
   反过来也一样 —— 两个接口共用服务端 60 秒位置缓存，多请求一次不会多外发坐标。 */
async function loadWeather() {
  try {
    state.weather = await api('/api/vehicle/weather');
    return true;
  } catch (e) {
    console.warn('天气加载失败', e);
    state.weather = null;
    return true;   // 温度缺失只是少一个数字，不该让整页掉进"连接失败"
  }
}

async function loadTrips() {
  /* 行程页支持按月筛选（官方 App 也有）：
     - 本月：汇总卡用「本月」，图表用「近 N 天」（默认 7 天，可切 30 天）
     - 历史月份：卡片与图表都只显示该月
     逐次行程明细（/api/trips）不请求：服务端没落库，回落模拟时会长出假行程。 */
  /* 发请求时把月份记下来：快速连切月份时先发的可能后到，
     直接赋值会把上个月的数字挂在新标题下（和 loadChargeSessions 同一个坑）。 */
  const want = state.yearMonth || 'currentMonth';
  const isCurrent = want === 'currentMonth';
  const monthQuery = isCurrent ? '' : '&yearMonth=' + encodeURIComponent(want);

  state.energyLoading = true;
  state.energyError = '';
  try {
    const monthData = await api('/api/trips/energy?scope=month' + monthQuery);
    let windowData = monthData;
    if (isCurrent) {
      const energyDays = Math.min(state.days, 31);   // 官方上限 31 个自然日（A008）
      windowData = (await api('/api/trips/energy?days=' + energyDays).catch(() => null)) || monthData;
    }
    /* 两次 await 之间用户可能又切了月份：这份结果已作废，
       既不能写进 state，也不能把加载态当成结果。 */
    if ((state.yearMonth || 'currentMonth') !== want) return null;
    state.energy = monthData;
    state.energyWindow = isCurrent ? windowData : monthData;   // 历史月：图表就是这一个月
    return true;
  } catch (e) {
    console.warn('能耗统计加载失败', e);
    if ((state.yearMonth || 'currentMonth') !== want) return null;   // 作废的请求不该把页面标成失败
    state.energy = null;
    state.energyWindow = null;
    // 记下失败原因：界面要区分"没数据"和"没读到"
    state.energyError = (e && e.message) ? String(e.message) : '读取失败';
    return false;
  } finally {
    state.energyLoading = false;
  }
}

async function loadEnergyMonths() {
  try {
    const data = await api('/api/trips/energy/months');
    state.months = data.months || [];
    // 选中的月份若已不在可查清单里（跨月后），退回本月
    if (state.months.length && !state.months.some((m) => m.yearMonth === state.yearMonth)) {
      state.yearMonth = 'currentMonth';
    }
    return true;
  } catch (e) {
    state.months = [];
    // 显式返回失败：按需加载靠这个决定"下次进这个 tab 要不要重试"
    return false;
  }
}

/* ── 充入电量：官方「充电记录」 ──
   三层状态刻意分开：
     · 月份清单（决定按钮与趋势图）
     · 选中月份的统计（决定卡片与列表）
     · 同步动作（决定要不要打官方网关）
   这样切月份只是"读本地库"，永远不联网。 */
async function loadChargeMonths() {
  try {
    const data = await api('/api/charges/months');
    state.chargeMonths = data.months || [];
    state.chargeHasData = data.hasData === true;
    // 跨月后原来选中的月份可能已经不在清单里，退回本月
    if (state.chargeMonths.length
        && !state.chargeMonths.some((m) => m.yearMonth === state.chargeMonth)) {
      state.chargeMonth = 'currentMonth';
    }
    return true;
  } catch (e) {
    console.warn('充电月份加载失败', e);
    state.chargeMonths = [];
    return false;
  }
}

/* 截图识别能不能用（服务端有没有配 DEEPSEEK_API_KEY）。
   失败也不影响页面 —— 只是把识别按钮降级；手写录入那条路永远开着。 */
async function loadOcrStatus() {
  try {
    const data = await api('/api/charges/receipts/status');
    state.ocrConfigured = data.configured === true;
  } catch (e) {
    console.warn('截图识别状态加载失败', e);
    state.ocrConfigured = null;
  }
}

async function loadChargeSessions() {
  /* 发请求时把月份记下来：快速连切月份时，先发的可能后到，
     直接赋值会把上个月的数据挂在新标题下（数字与标题错配）。 */
  const want = state.chargeMonth;
  try {
    const q = want === 'currentMonth' ? '' : '?yearMonth=' + encodeURIComponent(want);
    const data = await api('/api/charges/sessions' + q);
    if (state.chargeMonth !== want) return null;   // 期间又切了月份：作废（既不写 state 也不弹 toast）
    state.charge = data;
    state.chargeYm = want;              // 记下这份数据属于哪个月，渲染时与标题对齐
    state.chargeYmFailed = null;
    state.chargeLoadError = false;
    return true;
  } catch (e) {
    console.warn('充电流水加载失败', e);
    // 从没成功读到过才标错误态（已有数据时保留旧数据，别把页面清空）
    if (!state.charge) state.chargeLoadError = true;
    // 记下「这个月确实读失败了」：标题已经换成新月份，就不能再挂着旧月份的数字
    state.chargeYmFailed = state.chargeMonth === want ? want : null;
    return false;
  }
}

/* 同步充电流水（打官方网关，幂等）。
   页面上**没有手动按钮**，只有三种自动触发（见 state.chargeSyncAt 注释）。
   统一走 silent：自动触发对用户是"后台发生的事"，成功失败都不该弹 toast。 */
async function runChargeSync(opts = {}) {
  if (state.chargeSyncing) return false;
  state.chargeSyncing = true;
  render();
  try {
    const data = await api('/api/charges/sync', { method: 'POST' });
    /* 只有**真的打到网关**才算同步过一次。服务端 429（10 秒冷却）/ 401 / 网络失败
       都不写这个时间 —— 否则一次失败会被记成"今天已经同步过"，当天再不重试。 */
    markChargeSynced();
    await loadChargeMonths();
    await loadChargeSessions();
    if (!opts.silent) {
      toast(data && data.fetched
        ? `已同步 ${data.fetched} 笔充电记录`
        : '已是最新，没有新增充电记录');
    }
    return true;
  } catch (e) {
    const msg = (e && e.message) ? e.message : '同步失败';
    if (opts.silent) console.warn('自动同步充电记录失败', e);
    else toast(msg);
    return false;
  } finally {
    state.chargeSyncing = false;
    render();
  }
}

/* 充电结束 = **唯一真正会产生新充电流水的时刻**。
   官方落库有延迟（实测几十秒），所以等一分钟再拉；期间若又充上了就不拉。
   失败静默 —— 用户没点任何东西，不该被弹窗打扰。 */
function scheduleChargeSyncAfterCharging() {
  if (state.chargeSyncPending) return;
  state.chargeSyncPending = true;
  setTimeout(async () => {
    state.chargeSyncPending = false;
    if (state.mode !== 'live' || !isLoggedIn()) return;
    await runChargeSync({ silent: true });
  }, 60000);
}

async function loadCharges() {
  // 演示 / 离线：用内置数据，一个请求都不发
  if (state.mode === 'mock' || state.mode === 'offline') {
    applyMockCharges();
    return true;
  }

  state.chargeLoading = true;
  render();
  try {
    /* OCR 可用性与待确认队列**不阻塞首屏**：
       拿不到也只是识别按钮置灰 / 队列为空，不该让整页等着。 */
    loadOcrStatus();
    await loadChargeMonths();

    /* 两种自动同步，一个会话最多各触发一次：
         · 本地库空 —— 第一次进来必须填上，否则页面是空的；
         · **跨天**了 —— 上次同步不是今天，补一次（防"上次充电时 App 没开"漏数据）。
       同一天反复切 tab 不会再打网关：官方接口一次给两年全量，
       每次都拉纯属浪费，也更容易触发风控。 */
    const today = new Date().toDateString();
    const needSync = !state.chargeHasData || chargeSyncStale();
    if (needSync && state.chargeAutoSyncDay !== today) {
      state.chargeAutoSyncDay = today;
      // 同步内部已经把月份与流水都重新读了一遍，成功就直接返回，
      // 免得同一份本地数据再查一次
      if (await runChargeSync({ silent: true })) return true;
    }

    return await loadChargeSessions();
  } catch (e) {
    console.warn('充电数据加载失败', e);
    return false;
  } finally {
    state.chargeLoading = false;
    /* 必须在这里补一次 render：调用点（重试按钮）是 `render(); loadCharges();`，
       不带 .then(render) —— 只清标志不重绘，页面会永远停在「加载中」骨架上。 */
    render();
  }
}

/* 演示数据的月份切换：后端没有请求可发，就在本地按同一口径现算 */
function applyMockCharges() {
  state.chargeMonths = MOCK.charge.months;
  state.chargeHasData = true;

  // 先校验选中项还在不在清单里，再算数据 —— 顺序反了会先按不存在的月份算一遍，
  // 再把 state 改回本月，页面显示的就是"本月标题 + 空数据"
  if (!state.chargeMonths.some((m) => m.yearMonth === state.chargeMonth)) {
    state.chargeMonth = 'currentMonth';
  }

  const now = new Date();
  const ym = state.chargeMonth === 'currentMonth'
    ? `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`
    : state.chargeMonth;
  state.charge = summarizeCharge(ym, MOCK.charge.sessions);
}

function seedMock() {
  state.status = MOCK.status;
  state.trips = [];
  state.trend = [];
  state.energy = MOCK.energy;
  state.months = MOCK.months;
  state.yearMonth = 'currentMonth';
  state.months = MOCK.months;
  state.yearMonth = 'currentMonth';
  state.energyWindow = mockEnergy(state.days === 7 ? 7 : 30);
  /* 充入电量：演示流水带金额（为了看样式），但没有站点名 ——
     站名只能来自 OCR 补录，演示数据不该长得比真实接口更完整 */
  state.chargeMonths = MOCK.charge.months;
  state.chargeMonth = 'currentMonth';
  state.chargeHasData = true;
  applyMockCharges();
  state.health = MOCK.health;
  state.capabilities = MOCK.capabilities;
  state.permissions = MOCK.permissions;
  state.location = MOCK.location;
  // 演示天气：MockData 里没有车辆坐标，给一个固定值让这格有内容（真机是按位置查的）
  state.weather = { available: true, temperature: 22, weather: '多云' };
  // 演示数据一次给完，不做分页（也不该让用户滑出"加载更多"的假动作）；
  // 若此时已经选了筛选条件，一并按同一套规则过滤掉
  state.stationsPriceOk = true;
  applyMockStationFilters();
  state.stationsLoadingMore = false;
  /* 预览兜底数据的位置：与 MOCK.stations 里各站的距离基准一致（上海市中心）。
     直接给值而不是走定位 —— 预览页的本职是"看设计"，
     不该一打开就弹权限框。 */
  state.loc = { lat: 31.2304, lng: 121.4737 };
  state.locStatus = 'ok';
  /* 演示态也显示更新时间（2026-10-24 产品确认）：页标题右侧已有
     「模拟数据」小标签明示来源，页脚的时间只表示这份快照是什么时候取的，
     不会再被误读成真车实时值。live 模式下由 loadStatus 覆盖为真实时间。 */
  const now = new Date();
  state.lastRefresh = String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0');
}

/* 能力集与预约计划：真实模式下尝试拉取。
   后端接口尚未实现（属待确认的新功能），拿不到时静默退化为
   capabilities = null —— cap() 会按「全部显示」处理，
   数据缺失由 chip 的 unknown 态表达。不阻断主流程。 */
async function loadCapabilities() {
  try {
    const data = await api('/api/vehicle/capability');
    if (data && data.capabilities) {
      state.capabilities = data.capabilities;
    }
    if (data && Array.isArray(data.permissions)) {
      state.permissions = data.permissions;
    }
    return true;
  } catch {
    // 失败不清空已有值（可能是上一次成功的），但要让调用方知道该重试
    state.capabilities = state.capabilities || null;
    return false;
  }
}

/* 模拟数据模式提示：只在「配置了真实地址却连不上」时弹一次，
   避免用户误以为界面上的是真实车况 */
let fallbackNotified = false;
function notifyFallback(reason) {
  if (fallbackNotified) return;
  fallbackNotified = true;
  toast('连接服务端失败，已切换为模拟数据，当前展示的不是真实车况');
  console.warn('[ZeekrDash] 后端不可达，已回落模拟数据', reason || '');
}

/* 并发保护：启动与 visibilitychange 可能同时触发，避免重复请求与状态抖动。
   （具体的"同一份数据别重复打"在 `ensureTabData` 的 loadingKeys 里。） */

/* 是否已建立登录会话 —— 所有数据接口的前置条件。 */
function isLoggedIn() {
  /* mock 后端（服务端自己就是数据源，没有真实账号可登）也要放行：
     bootstrap 已按 `a.authenticated || a.mock === true` 判定要不要进 live 分支，
     这里若只看 authenticated，mock 下 ensureTabData 会立刻早退回演示数据，
     整个 live 链路等于没通。原版 index.html 此处同样漏了这一条。 */
  return !!(state.auth && (state.auth.authenticated === true || state.auth.mock === true));
}

/* 启动流程：**先确认登录态，再决定要不要加载数据**。
   未登录时一个数据接口都不调 —— live 模式下服务端要求登录，
   调了只会失败，还把日志刷满无意义的报错。
   唯一允许的请求是 /api/auth/status：不查它就无法判断
   该显示登录表单还是数据。 */
async function bootstrap() {
  // 「连接后端」没打开：纯本地演示，**一个网络请求都不发**。
  // 这是默认状态 —— 预览页的本职是看设计，不该因为后端没起就报错。
  if (!CONNECT_BACKEND) {
    seedMock();
    state.mode = 'mock';
    render();
    return;
  }

  await loadAuth();
  const a = state.auth || {};

  /* `mock === true`：服务端自己就是模拟数据源，没有真实账号可登。
     iOS 那边 AppStore 早就这么放行了，网页只看 authenticated 会卡在登录引导，
     同一个后端两端行为不一致。 */
  if (a.authenticated || a.mock === true) {
    state.mode = 'live';
    // 只加载当前 tab 需要的数据；其余 tab 等用户点进去再取
    await ensureTabData(state.tab);
    return;
  }

  if (a.error) {
    // 连不上后端：这正是预览页的本职场景 —— 用内置数据把设计呈现出来
    seedMock();
    state.mode = 'mock';
    render();
    return;
  }

  // 后端在，但还没登录：停在登录引导，不碰任何数据接口
  state.status = null; state.trips = []; state.trend = [];
  state.charge = null; state.chargeMonths = []; state.chargeMonth = 'currentMonth'; state.health = null;
  /* 未登录时不定位、也不保留上一会话的站点与坐标 */
  state.stations = null; state.loc = null; state.locStatus = 'idle';
  state.location = null;
  state.weather = null;
  state.mode = 'needLogin';
  render();
}

/* 切标签页（底部导航与「去登录」按钮共用） */
function goTab(name) {
  const btn = document.querySelector(`.tab[data-tab="${name}"]`);
  state.tab = name;
  document.querySelectorAll('.tab').forEach((b) =>
    b.classList.toggle('on', b === btn));
  /* 首次进充电页时自动请求一次定位 —— **只自动做一次**：
     被拒绝后反复弹权限框是骚扰，之后交给用户点「重试定位」。 */
  if (name === 'charges' && state.locStatus === 'idle') locate();
  render();
  // 切到哪个 tab 才取哪个 tab 的数据（已取过的不会重复打）
  ensureTabData(name);
}

/* 未登录时的占位 —— 明确说明"没有请求接口"，免得看起来像页面坏了 */
function renderLoginWall() {
  return `<div class="v2-screen">
    <div class="v2-card v2-wall">
      <span class="v2-wall-ico">${SVG.phone}</span>
      <div class="v2-wall-t">需要先登录极氪账号</div>
      <div class="v2-wall-d">服务端已连上（真实数据模式）。<br>登录前不会请求任何车况 / 行程 / 充电接口。</div>
      <button class="v2-wall-btn" onclick="goTab('settings')">去登录</button>
    </div>
  </div>`;
}

/* ── 按需加载：每个 tab 只请求自己需要的接口 ──
   原来登录后一次把 status / health / location / charges / energy / capabilities
   全打一遍。可用户多数时候只看一页 —— 全量预取等于把后端和第三方额度
   花在没人看的数据上（充电站还要逐站取价，最贵）。
   `loadedKeys` 只记**成功**过的键，失败的下次进该 tab 会自动重试。 */
const TAB_NEEDS = {
  dash:     ['health', 'capabilities', 'status', 'location', 'weather'],
  trips:    ['energyMonths', 'trips'],
  // 充电页不再需要能力集：预约充电卡已换成「充入电量」，
  // 而附近站点只看气泡接口字段，与权限包无关。少一个请求就少一分压力。
  charges:  ['charges'],
  // 车控页要车况（上锁/空调/充电中）+ 能力集（cap() 决定显示哪些按钮）+ 服务端车控开关
  ctrl:     ['health', 'capabilities', 'status'],
  // 设置页要车牌（state.status.plateNo）—— 复用同一个 loadStatus 与缓存：
  // 车况页先打开过就直接吃缓存一个请求都不发，否则补一次（与车况共用，不新增接口）。
  settings: ['health', 'capabilities', 'status'],
};

/* 键 → 实际 loader。注意 `loadCapabilities` 会一并带回 permissions。 */
const DATA_LOADERS = {
  health: loadHealth,
  capabilities: loadCapabilities,
  status: loadStatus,
  location: loadLocation,
  weather: loadWeather,
  trips: loadTrips,
  energyMonths: loadEnergyMonths,
  charges: loadCharges,
};

const loadedKeys = new Set();
const loadingKeys = new Set();

/* 清空"已加载"记录：登录 / 登出 / 换账号时必须调用，
   否则下一位用户会看到上一位的缓存判定"已经加载过了"。 */
function clearLoadedKeys() {
  loadedKeys.clear();
  loadingKeys.clear();
}

async function ensureTabData(tab, force = false) {
  if (!isLoggedIn()) {
    if (state.mode !== 'needLogin') { seedMock(); state.mode = 'mock'; }
    return;
  }

  const todo = (TAB_NEEDS[tab] || []).filter((k) => force || !loadedKeys.has(k));
  if (!todo.length) return;

  const keys = new Set(todo);
  /* 这些标志必须在**第一次 render() 之前**置位 —— 各 loader 内部虽然也会置位，
     但那是排在 render 之后的，等它们置位时这一帧已经画完了，
     首屏就会显示「尚未获取到车辆数据 / 请确认服务已启动」，明明后端是好的。 */
  state.loading = true;
  /* 只给「本次真的要发」的 key 置加载态：已经在飞的那一份由它自己那批负责清，
     这里置了却没人清，页面就会永远停在骨架屏。 */
  if (keys.has('status') && !loadingKeys.has('status')) state.statusLoading = true;
  if (keys.has('charges') && !loadingKeys.has('charges')) state.chargeLoading = true;
  if (keys.has('trips') && !loadingKeys.has('trips')) state.energyLoading = true;
  render();

  const failed = new Set();
  /* 本次真正发出请求的 key。被 loadingKeys 挡掉的那些（同一份数据在别处飞）
     既不能算成功去清标志，也不能算失败去判离线 —— 否则一次抢先返回的空批次
     就会把整页判成「后端挂了」。 */
  const started = new Set();
  try {
    await Promise.all(todo.map(async (key) => {
      // 同一份数据正在加载就别重复打（快速来回切 tab 时会发生）
      if (loadingKeys.has(key)) return;
      loadingKeys.add(key);
      started.add(key);
      try {
        const ok = await DATA_LOADERS[key]();
        if (ok === false) failed.add(key);
        else if (ok !== null) loadedKeys.add(key);   // undefined 成功（loader 自己吞了异常）；null = 请求已作废
      } catch (e) {
        console.warn('加载失败', key, e);
        failed.add(key);
      } finally {
        loadingKeys.delete(key);
      }
    }));
  } finally {
    state.loading = false;
    /* 兜住"未登录早退 / 抛错"的分支：早退时各 loader 根本没跑，
       不清就会永远停在「正在读取…」。只清本次真的置过位的标志 ——
       否则会把「还在飞的那一次」的加载态一起抹掉，页面先空后错。 */
    if (started.has('status')) state.statusLoading = false;
    if (started.has('charges')) state.chargeLoading = false;
    if (started.has('trips')) state.energyLoading = false;

    /* 只有这次真的问了"后端通不通"（车况那批），才做可达性判断 ——
       其它 tab 不碰 status/health，不该因为自己没问就判后端死了。 */
    if (started.has('status') || started.has('health')) {
      if (failed.has('status') || failed.has('health')) {
        /* 有真数据时**不要**用演示数据覆盖：seedMock 会把车况/充电/行程/位置
           整套换成演示值，而它连金额和站名都有 —— 用户会把这些当成自己的账。
           宁可继续显示"最后一次已知"的旧数据，只把模式标成离线。 */
        if (!state.status) seedMock();
        state.mode = 'offline';
        notifyFallback('后端未响应 /api/vehicle/status 或 /api/health');
      } else {
        /* 从离线恢复：离线期间可能进过 seedMock（或停着旧数据），
           必须让各 tab 重新取一次，否则 loadedKeys 会拦住重取、把旧值当真。 */
        if (state.mode === 'offline') clearLoadedKeys();
        state.mode = 'live';
        fallbackNotified = false;
      }
    }
    syncModeBadge();
    render();
  }
}

/* ═══════════════════════════════════════════════
   交互
   ═══════════════════════════════════════════════ */
document.querySelector('.tabbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  goTab(btn.dataset.tab);
});

/* 车控总开关：切换后立即持久化并重渲染 —— 车控页那 15 个按钮的可用态
   跟着变（关 → 全部置灰 + 「已禁用」）。这是**界面意图**开关；
   真正的闸门在服务端（ALLOW_COMMANDS），两把锁都要开。 */
/* 核对框里改了「开始时间 / 电量」：自动预选的那一条已经不可信，立刻撤销，
   让用户重新选（或落到待确认）。不撤销就会把金额绑到另一次充电上。
   **用户自己点过候选的**不动 —— 那是他的判断。 */
document.addEventListener('input', (e) => {
  const input = e.target.closest && e.target.closest('.ocr-row .ocr-input');
  if (!input) return;
  const field = input.dataset.f;
  if (field !== 'startAt' && field !== 'energyKwh') return;

  const rowEl = input.closest('.ocr-row');
  if (!rowEl) return;
  const idx = Number(rowEl.dataset.idx);
  if (state.ocrUserPicked && state.ocrUserPicked[idx]) return;
  if (!state.ocrPick[idx]) return;          // 本来就没绑，不用动

  state.ocrPick[idx] = '';
  rowEl.querySelectorAll('.ocr-cand').forEach((b) => {
    b.classList.toggle('on', (b.dataset.cand || '') === '');
  });
  rowEl.querySelectorAll('.ocr-rebind').forEach((n) => { n.hidden = false; });
});

document.addEventListener('change', (e) => {
  const sw = e.target.closest('#allowCmdsSw');
  if (!sw) return;
  state.allowCommands = sw.checked;
  writeAllowCommands(sw.checked);
  render();
});

document.addEventListener('click', (e) => {
  // 附近充电站：导航按钮在卡片行**内部**，必须先于整行展开判断，
  // 否则点「导航」会连带把详情也收起来。
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    openStationNav(navBtn.dataset.nav);
    return;
  }
  // 收起态站点三行：点哪行哪行变高亮，其余两行退成简行
  const pickRow = e.target.closest('[data-pick]');
  if (pickRow) {
    const key = pickRow.dataset.pick;
    if (key && state.pickKey !== key) { state.pickKey = key; render(); }
    return;
  }
  // 车辆权限：省略号展开 / 收起
  const permToggle = e.target.closest('[data-perm-toggle]');
  if (permToggle) {
    state.permExpanded = !state.permExpanded;
    render();
    return;
  }
  // 站点排序（限定 data-sort，与下面的时间区间切换互不干扰）
  const sortBtn = e.target.closest('.seg button[data-sort]');
  if (sortBtn) {
    state.stationSort = sortBtn.dataset.sort;
    render();
    return;
  }
  // 附近站点筛选 chip
  const filterChip = e.target.closest('.st-chip[data-f]');
  if (filterChip) {
    // 只有「快充」带 data-v；自营 / 停车免费是纯开关
    toggleStationFilter(filterChip.dataset.f, filterChip.dataset.v);
    return;
  }
  // 清除筛选（列表里与空态里各一个按钮；空态那个用 data-streset 标记，
  // 避免同一个 id 出现两次 —— 重复 id 是非法 HTML，DOM 查询也有歧义）
  if (e.target.closest('#stFilterReset, [data-streset]')) {
    state.stationFilter = { connector: '', maxPrice: null, selfOnly: false, parkFree: false };
    loadStations().then(render);
    return;
  }
  // 站点卡片：展开 / 收起分时电价表
  const stCard = e.target.closest('.st');
  if (stCard) {
    const sid = stCard.dataset.sid;
    state.stationOpen = state.stationOpen === sid ? '' : sid;
    render();
    return;
  }
  // 车控
  const ctrl = e.target.closest('.ctrl');
  if (ctrl && !ctrl.disabled) {
    spawnRipple(ctrl, e);
    sendCommand(ctrl);
    return;
  }
  // 月份选择：弹出 iOS 风格底部弹层（年份 + 月份两段）。
  // 行程页与充电页各用自己的清单和选中项 —— 共用 state 会让两边互相串。
  if (e.target.closest('#monthBtn')) {
    openMonthSheet({
      months: state.months,
      current: state.yearMonth,
      title: '选择月份',
      onPick: (v) => { state.yearMonth = v; loadTrips().then(render); },
    });
    return;
  }
  if (e.target.closest('#statusRetryBtn')) {
    state.statusError = '';
    render();
    loadStatus().then(render);
    return;
  }
  if (e.target.closest('#energyRetryBtn')) {
    state.energyError = '';
    render();
    loadTrips().then(render);
    return;
  }
  if (e.target.closest('#chargeRetryBtn')) {
    state.chargeLoadError = false;
    render();
    loadCharges();
    return;
  }
  if (e.target.closest('#chargeMonthBtn')) {
    openMonthSheet({
      months: state.chargeMonths,
      current: state.chargeMonth,
      title: '选择月份',
      onPick: (v) => {
        state.chargeMonth = v;
        if (state.mode === 'mock' || state.mode === 'offline') {
          applyMockCharges();
          render();
        } else {
          loadChargeSessions().then((ok) => {
            render();
            if (ok === false) toast('读取该月流水失败');
          });
        }
      },
    });
    return;
  }
  /* 充电流水的「同步」按钮已移除（时机全自动：空库 / 跨天 / 充电结束）。
     需要手动触发时去调试台（`?debug=1` → 接口 → POST /api/charges/sync）。 */
  /* 金额补录三个入口。
     顺序无所谓，但都要在 `.st` 之类判断之前无所谓 —— 它们不在站点卡里，
     这里只需要注意别被上面的站点筛选/排序规则误伤（用的是独立 id）。 */
  if (e.target.closest('#ocrPickBtn')) {
    pickReceiptImage();
    return;
  }
  if (e.target.closest('#manualPayBtn')) {
    openManualSheet();
    return;
  }
  if (e.target.closest('#pendingPayBtn')) {
    // 队列要现拉 —— 别的用户/别的设备刚补录过的话，本地这份就过期了
    loadPayments().then(() => { openPaymentsSheet(); });
    return;
  }
  /* 图表区间切换。只按 data-days 定位：行程屏的段控件是 `.v2-seg`（不带 `.seg`），
     之前写成 `.seg button[data-days]` 匹配不到，30 天点了等于没点。 */
  const seg = e.target.closest('button[data-days]');
  if (seg) {
    state.days = parseInt(seg.dataset.days, 10);
    if (state.mode !== 'live') {
      // 演示数据没有服务端，按新区间现生成一份，否则切到 30 天仍是 7 天的柱子
      state.energyWindow = mockEnergy(state.days);
      render();
    } else {
      loadTrips().then(render);
    }
    return;
  }
});

/* 点击处生成涟漪 —— 纯视觉反馈，不参与业务 */
function spawnRipple(btn, e) {
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.9;
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = ((e.clientX ?? r.left + r.width / 2) - r.left) + 'px';
  span.style.top = ((e.clientY ?? r.top + r.height / 2) - r.top) + 'px';
  btn.appendChild(span);
  setTimeout(() => span.remove(), 600);
}

/* 车端执行结果确认。
   对应官方接口 `/ms-remote-control/api/v1.0/remoteControl/queryProcessResult`
   —— 网关返回"已提交"只代表它收下了，**不代表车动了**。

   返回值三态：
     true  —— 车端确认已执行
     false —— 车端明确执行失败
     null  —— 超时未确认（既不能当成功，也不能当失败） */
async function pollCommandResult(commandId) {
  // 演示模式：本地模拟一次车端确认，保证三态链路可视
  if (DEMO || state.mode === 'mock') {
    await new Promise((r) => setTimeout(r, 1100));
    return true;
  }
  // 真实模式：后端该接口尚未实现（属待确认的新功能），
  // 请求失败时如实返回 null —— 宁可报"未确认"，不谎报成功。
  const deadline = Date.now() + 15000;
  while (Date.now() < deadline) {
    try {
      const r = await api('/api/vehicle/command/result?id=' + encodeURIComponent(commandId));
      if (r && r.status === 'done') return true;
      if (r && r.status === 'failed') return false;
    } catch { /* 接口未实现 / 网络异常 → 继续轮询 */ }
    await new Promise((res) => setTimeout(res, 1500));
  }
  return null;
}

/* 车控指令：四段式反馈
   ① busy        —— 请求已发出，等网关受理
   ② pending     —— 网关已受理，等**车端执行确认**
   ③ done        —— 车端确认已执行
   ④ fail / unconfirmed —— 执行失败 / 超时未确认

   ② 与 ③ 必须分开：旧实现把"网关已提交"直接当成功，
   会造成"以为锁了车其实没锁"的假成功 —— 这是安全问题，不是体验问题。 */
async function sendCommand(btn) {
  const cmd = btn.dataset.cmd;
  const label = btn.dataset.label || '指令';
  const isToggle = btn.classList.contains('ctrl--toggle');

  // 双保险：开关关闭时按钮已是 disabled（且 pointer-events:none），点击根本到不了这里；
  // 但程序化调用仍必须被拦住 —— 安全开关不能只靠一个入口。
  if (!state.allowCommands) { toast('控制指令已关闭：请在「设置」中开启'); return; }

  if (btn.classList.contains('busy') || btn.classList.contains('pending')) return;
  btn.classList.remove('fail', 'done', 'unconfirmed');   // 失败态保持到这次点击才消（§2 S7）
  btn.classList.add('busy');

  const subEl = btn.querySelector('.ctrl-sub');
  const origSub = subEl ? subEl.textContent : '';

  const settle = (cls, keepMs) => {
    btn.classList.remove('busy', 'pending');
    btn.classList.add(cls);
    if (!keepMs) return;   // 0 = 保持到下次操作，失败态不自动消失（§2 S7）
    setTimeout(() => {
      btn.classList.remove('done', 'fail', 'unconfirmed', cls);
      if (subEl) subEl.textContent = origSub;
      loadStatus().then(render);
    }, keepMs);
  };

  try {
    const res = await api('/api/vehicle/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd }),
    });

    // ── 阶段 ②：网关已受理，等车端执行确认 ──
    btn.classList.remove('busy');
    btn.classList.add('pending');
    if (subEl) subEl.textContent = '等待车端确认…';

    const confirmed = await pollCommandResult(res.commandId || cmd);

    if (confirmed === true) {
      if (isToggle) btn.classList.toggle('on');
      toast(res.message || (label + '已执行'));
      settle('done', 950);
    } else if (confirmed === false) {
      toast(label + '车端执行失败');
      settle('fail', 0);
    } else {
      // 未确认：既不是成功也不是失败，如实告知
      if (subEl) subEl.textContent = '未确认';
      toast(label + '已下发，但未在时限内确认车端执行');
      settle('unconfirmed', 2200);
    }
  } catch (err) {
    toast(label + '失败：' + err.message);
    settle('fail', 0);
  }
}

/* ═══════════════════════════════════════════════
   调试台：连接管理 / 接口探针 / 请求日志
   ═══════════════════════════════════════════════ */

/* 后端真实存在的接口 —— 取自 server/app/api/*.py 与 main.py 的 include_router 前缀。
   调试台的"事实清单"，不要往里加没确认过的路径。 */
const DBG_ENDPOINTS = [
  { m: 'GET',  p: '/api/health',            d: '健康检查' },
  { m: 'GET',  p: '/api/vehicle/status',    d: '车况快照' },
  { m: 'GET',  p: '/api/vehicle/list',      d: '车辆列表' },
  { m: 'POST', p: '/api/vehicle/command',   d: '下发车控指令', body: { command: 'lock' } },
  { m: 'GET',  p: '/api/vehicle/snapshots', d: '历史快照' },
  { m: 'GET',  p: '/api/trips',             d: '行程列表' },
  { m: 'GET',  p: '/api/trips/energy',      d: '官方能耗统计（≤31 天）' },
  { m: 'GET',  p: '/api/energy/trend',      d: '能耗趋势' },
  { m: 'POST', p: '/api/charges/sync',      d: '同步官方充电流水' },
  { m: 'GET',  p: '/api/charges/sessions',  d: '充电流水（默认本月）' },
  { m: 'GET',  p: '/api/charges/months',    d: '可查月份与月度电量' },
  { m: 'GET',  p: '/api/auth/status',       d: '登录状态' },
  { m: 'POST', p: '/api/auth/sendCode',     d: '请求验证码', body: { phone: '' } },
  { m: 'POST', p: '/api/auth/verifyCode',   d: '校验验证码', body: { phone: '', code: '' } },
  { m: 'POST', p: '/api/auth/logout',       d: '退出登录' },
];

let dbgTab = 'api';
let dbgLastProbe = {};   // "METHOD path" -> 最近一次结果

function dbgSetStatus(state, text) {
  const cls = state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : state === 'wait' ? 'wait' : '';
  for (const id of ['dbgDot', 'dbgDot2']) {
    const el = document.getElementById(id);
    if (el) el.className = 'dbg-dot ' + cls;
  }
  for (const id of ['dbgStatText', 'dbgStatText2']) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }
}

/* 连接：写回地址与令牌 → 落盘 → 探一次健康检查 → 重拉数据 */
async function dbgConnect() {
  const apiEl = document.getElementById('dbgApi');
  const tokEl = document.getElementById('dbgTok');
  const raw = (apiEl.value || '').trim().replace(/\/+$/, '');
  if (!raw) { toast('请先填写后端地址'); return; }

  API_SOURCE = raw;
  API_TOKEN = (tokEl.value || '').trim();
  ENDPOINT_MODE = resolveEndpointMode(API_SOURCE);

  localStorage.setItem(DBG_LS_API, API_SOURCE);
  if (API_TOKEN) localStorage.setItem(DBG_LS_TOKEN, API_TOKEN);
  else localStorage.removeItem(DBG_LS_TOKEN);

  dbgSetStatus('wait', '连接中…');
  dbgLog.length = 0;
  dbgLastProbe = {};

  /*
    就绪判据 = 能否拿到 /api/health。
    这里刻意直接用 api()，让「连不上」的原因（地址错 / 后端没起 /
    CORS）也进入请求日志 —— 这正是要看的东西。
  */
  let health = null;
  const t0 = performance.now();
  try {
    health = await api('/api/health');
    dbgSetStatus('ok', '已连接 · ' + Math.round(performance.now() - t0) + 'ms');
    toast('已连接 ' + API_SOURCE);
  } catch (err) {
    // 不额外弹 toast：状态灯变红 + 请求日志里已写明原因，
    // 后面 ensureTabData() 还会再弹一次"已切换为模拟数据"，避免重复打扰
    dbgSetStatus('bad', '连不上');
  }

  // 数据源取自 health；连不上时保持未知，不假装是 mock
  if (health) {
    state.mode = health.mode === 'live' ? 'live' : (health.mode === 'mock' ? 'mock' : state.mode);
  }
  syncModeBadge();
  renderDebugPanel();
  renderDebugLog();
  // 未登录时不加载数据 —— 登录态由 bootstrap 统一把关
  if (isLoggedIn()) await ensureTabData(state.tab, true);
}

/* 单独调用某个接口 —— 结果直接写进请求日志 */
async function dbgProbe(ep) {
  const opts = { method: ep.m };
  if (ep.body) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(ep.body);
  }
  try {
    await api(ep.p, opts);
  } catch { /* 失败已记入日志，不再重复弹提示 */ }
  const last = dbgLog[dbgLog.length - 1];
  if (last) dbgLastProbe[ep.m + ' ' + ep.p] = last;
  renderDebugPanel();
}

function renderDebugLog() {
  const errs = dbgLog.filter((l) => !l.ok).length;
  const badge = document.getElementById('dbgErrCount');
  if (badge) badge.textContent = String(errs);
  const fab = document.getElementById('dbgFab');
  if (fab) fab.classList.toggle('err', errs > 0);
  const n = document.getElementById('dbgLogCount');
  if (n) n.textContent = String(dbgLog.length);
}

/* 按当前 tab 切换分区显隐 */
function dbgShowTab() {
  const map = { conn: 'dbgSecConn', api: 'dbgSecApi', log: 'dbgSecLog' };
  for (const key of Object.keys(map)) {
    const el = document.getElementById(map[key]);
    if (el) el.classList.toggle('hidden', key !== dbgTab);
  }
}

function renderDebugPanel() {
  dbgShowTab();
  const apiN = document.getElementById('dbgApiCount');
  if (apiN) apiN.textContent = String(DBG_ENDPOINTS.length);
  const logN = document.getElementById('dbgLogCount');
  if (logN) logN.textContent = String(dbgLog.length);

  // 连接区是静态标记，**不参与重绘** —— 重绘会把用户正在输入的内容清掉
  if (dbgTab === 'conn') return;

  const body = dbgTab === 'api'
    ? document.getElementById('dbgSecApi')
    : document.getElementById('dbgSecLog');
  if (!body) return;

  if (dbgTab === 'api') {
    body.innerHTML = DBG_ENDPOINTS.map((ep, i) => {
      const last = dbgLastProbe[ep.m + ' ' + ep.p];
      const lastTxt = last
        ? `<span class="code ${last.ok ? 'ok' : 'bad'}">${last.status}</span>`
        : '';
      const cls = ep.m === 'POST' ? 'post' : (ep.m === 'DELETE' ? 'del' : '');
      return `
        <div class="dbg-api">
          <span class="m ${cls}">${ep.m}</span>
          <span class="p">${ep.p}</span>
          <span class="d">${ep.d}</span>
          ${lastTxt}
          <button class="dbgbtn sm" data-probe="${i}">发送</button>
        </div>`;
    }).join('');

    body.querySelectorAll('[data-probe]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const ep = DBG_ENDPOINTS[Number(btn.dataset.probe)];
        btn.disabled = true;
        dbgProbe(ep).finally(() => { btn.disabled = false; });
      });
    });
    return;
  }

  if (!dbgLog.length) {
    body.innerHTML = '<div class="dbg-empty">还没有请求记录</div>';
    return;
  }
  body.innerHTML = dbgLog.slice().reverse().map((l) => `
    <div class="dbg-log ${l.ok ? '' : 'err'}">
      <div class="dbg-log-top">
        <span class="code ${l.ok ? 'ok' : 'bad'}">${l.status}</span>
        <span class="p">${l.method} ${l.path}</span>
        <span class="ms">${l.ms}ms</span>
        <span style="color:var(--text-3)">${l.at}</span>
      </div>
      ${l.detail ? `<div class="why">${esc(l.detail)}</div>` : ''}
      ${l.body ? `<details><summary>响应原文</summary><pre class="dbg-pre">${esc(l.body)}</pre></details>` : ''}
    </div>`).join('');
}

function initDebugUI() {
  // 调试台没开：只把浮层藏掉，**不绑定任何监听**。
  // 尤其不能走到函数末尾那个自动 `dbgConnect()` —— 那会让「默认不发请求」
  // 变成一句空话（页面一打开就去连本机后端）。
  if (!DEBUG_UI) {
    const fab = document.getElementById('dbgFab');
    const sheet = document.getElementById('dbgSheet');
    if (fab) fab.style.display = 'none';
    if (sheet) sheet.style.display = 'none';
    return;
  }

  const apiEl = document.getElementById('dbgApi');
  const tokEl = document.getElementById('dbgTok');
  if (apiEl) apiEl.value = API_SOURCE;
  if (tokEl) tokEl.value = API_TOKEN;

  document.getElementById('dbgConnect')?.addEventListener('click', dbgConnect);
  apiEl?.addEventListener('keydown', (e) => { if (e.key === 'Enter') dbgConnect(); });
  tokEl?.addEventListener('keydown', (e) => { if (e.key === 'Enter') dbgConnect(); });

  document.querySelectorAll('.dbg-chip[data-api]').forEach((chip) => {
    chip.classList.toggle('on', chip.dataset.api === API_SOURCE);
    chip.addEventListener('click', () => {
      if (apiEl) apiEl.value = chip.dataset.api;
      dbgConnect();
    });
  });

  const demo = document.getElementById('dbgDemo');
  if (demo) {
    demo.checked = DEMO;
    demo.addEventListener('change', () => { DEMO = demo.checked; });
  }

  const sheet = document.getElementById('dbgSheet');
  document.getElementById('dbgFab')?.addEventListener('click', () => {
    sheet?.classList.toggle('open');
    renderDebugPanel();
    renderDebugLog();
  });
  document.getElementById('dbgClose')?.addEventListener('click', () => sheet?.classList.remove('open'));
  document.getElementById('dbgClear')?.addEventListener('click', () => {
    dbgLog.length = 0;
    dbgLastProbe = {};
    renderDebugPanel();
    renderDebugLog();
  });

  document.querySelectorAll('.dbg-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      dbgTab = tab.dataset.dbg;
      document.querySelectorAll('.dbg-tab').forEach((t) => t.classList.toggle('on', t === tab));
      renderDebugPanel();
    });
  });

  renderDebugPanel();
  renderDebugLog();

  // 「连接后端」总开关。
  // 切换后**重载页面**而不是原地改状态：`PREFERS_MOCK` / `API_SOURCE` 在启动时
  // 就已算好并被各处读取，原地只改开关会得到"开关变了、行为没变"的假象。
  const link = document.getElementById('dbgLinkSwitch');
  if (link) {
    link.checked = CONNECT_BACKEND;
    link.addEventListener('change', () => {
      writeFlag(DBG_LS_CONNECT, link.checked);
      location.reload();
    });
  }

  // 没连后端时把地址/令牌/连接按钮都禁用 —— 免得填了以为会生效
  const offline = !CONNECT_BACKEND;
  [apiEl, tokEl].forEach((el) => { if (el) el.disabled = offline; });
  document.querySelectorAll('.dbg-chip[data-api]').forEach((el) => { el.disabled = offline; });
  const connectBtn = document.getElementById('dbgConnect');
  if (connectBtn) connectBtn.disabled = offline;

  // 只有开关打开才自动连一次
  if (CONNECT_BACKEND) dbgConnect();
}

/* ═══════════════════════════════════════════════
   启动
   ═══════════════════════════════════════════════ */
initDebugUI();
bootstrap();     // 先确认登录态，再决定要不要加载数据

/* 验收用：?tab= 直接打开某屏时，底栏高亮要跟着走。
   底栏是静态 DOM，只有 goTab 会 toggle；走 URL 进来的不经过它。 */
if (QUERY_TAB && ['dash', 'trips', 'charges', 'ctrl', 'settings'].includes(QUERY_TAB)) {
  document.querySelectorAll('.tab').forEach((b) =>
    b.classList.toggle('on', b.dataset.tab === QUERY_TAB));
}

/* 验收用：?ocr=1 直接打开「凭证识别」弹层（截图走查用，不影响正常交互）。
   等数据加载完再开，否则弹层里是空的。 */
if (new URLSearchParams(location.search).get('ocr') === '1') {
  setTimeout(() => {
    try {
      /* 验收用假数据：只在这个调试参数下注入，正常流程由真实识别结果填充 */
      state.ocrAt = Date.now();
      state.ocrPick = {}; state.ocrUserPicked = {};
      state.ocrRows = [{
        stationName: '星星充电 · 万象城', confidence: 0.92,
        needsReview: true, reviewNote: '服务费 ¥12.00 未计入金额',
        amount: 78.84, energyKwh: 58.4, startAt: '2026-10-21 14:32',
        candidates: [
          { sessionId: 'mock-a', startTime: '2026-10-21 14:32', energyKwh: 58.4, kind: 'dc' },
          { sessionId: 'mock-b', startTime: '2026-10-15 09:10', energyKwh: 62.0, kind: 'dc' },
        ],
      }];
      openOcrSheet();
    } catch (e) { console.warn('ocr 预览失败', e); }
  }, 900);
}

/* ── 充电站分页：只认**内层列表**滚到底 ──
   卡片高度固定、列表自己滚（CSS `.st-list`），所以：
   · 手指在列表上滑 → 只滚列表，滑到底自动取下一页；
   · 手指在列表外滑 → 正常翻整页，去下面的「充入电量」「充电记录」。
   两者用**不同的滚动容器**隔开，就不会再出现"越滑越加载、下面的卡永远看不到"。
   `scroll` 不冒泡，用 capture 在 document 上收 —— render() 每次重建 DOM，
   挂在元素上就得反复重绑，挂在 document 上只挂一次。 */
document.addEventListener('scroll', (e) => {
  if (state.tab !== 'charges') return;
  if (!state.stationsHasMore || state.stationsLoadingMore) return;
  const list = e.target;
  if (!list || !list.classList || !list.classList.contains('st-list')) return;
  const nearBottom = list.scrollTop + list.clientHeight >= list.scrollHeight - 48;
  if (nearBottom) loadMoreStations();
}, { passive: true, capture: true });

/* 滚动响应：下滑超过一屏的 6% 时，顶栏玻璃变实
   —— 对应 iOS 26 从 scrollEdge 到 inline 的过渡行为 */
let lastScrolled = false;
function syncScrollState() {
  const scrolled = window.scrollY > 24;
  if (scrolled !== lastScrolled) {
    lastScrolled = scrolled;
    document.body.classList.toggle('is-scrolled', scrolled);
  }
}
window.addEventListener('scroll', syncScrollState, { passive: true });
syncScrollState();

// 轮询：仅真实数据（live）模式下刷新，充电中 60 秒，否则 5 分钟；
// 模拟 / 回落状态下没有可刷新的后端，直接跳过
let pollTimer;
function schedulePoll() {
  clearTimeout(pollTimer);
  const interval = (state.status && state.status.isCharging) ? 60000 : 300000;
  pollTimer = setTimeout(async () => {
    if (state.mode === 'live') {
      await loadStatus();
      render();
    }
    schedulePoll();
  }, interval);
}
setTimeout(schedulePoll, 5000);

// 页面回到前台时刷新
document.addEventListener('visibilitychange', () => {
  // 未登录时不刷新 —— 没有可刷的数据，只会白打接口
  if (!document.hidden && isLoggedIn()) ensureTabData(state.tab, true);
});
</script>
