<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F7">
<title>极氪看板 · 设计预览</title>
<style>
/* ═══════════════════════════════════════════════
   中国传统色设计系统
   色值参考 zhongguose.com（中科院《色谱》1957）
   ═══════════════════════════════════════════════ */
:root {
  --tian-qing:      #2E8BC0;  /* 天青 → 清爽天蓝 · 主色 */
  --tian-qing-deep: #1C6FA8;  /* 天青·深 */
  --zhu-qing:       #16B89A;  /* 竹青 → 青碧同系清绿 · 安全色 */
  --qing-bi:        #16B89A;  /* 青碧 · 安全/正常 */
  --piao-se:        #E8F2FA;  /* 缥色 → 淡天蓝底，不再发绿 */
  --dian-lan:       #3A6EA5;  /* 靛蓝 */
  --dian-qing:      #1E7FC2;  /* 靛青 · 充电/主强调（清爽蓝） */
  --cang-qing:      #2C3E5C;  /* 藏青 */
  --qun-qing:       #4C8DAE;  /* 群青 */
  --zhu-sha:        #E5483B;  /* 朱砂 · 告警（更干净的红） */
  /* 珊瑚 · 「开启中」状态色（车控按钮）。
     与朱砂告警红同属红粉系，刻意用明度拉开差距，避免被读成「异常/失败」：
     浅色模式下加深到 #C9483F（对比度 4.25 才能压住浅玻璃底），
     深色模式下用本源色 #FA9894（对比度 6.68）。
     深色模式的值由本文件末尾的 prefers-color-scheme 块覆盖。 */
  --shan-hu:        #C9483F;
  --yan-zhi:        #C0392B;  /* 胭脂 */
  --teng-huang:     #FFB020;  /* 藤黄 · 强调（明亮琥珀） */
  --xiang-se:       #F4B400;  /* 缃色 */
  --ti-se:          #F2994A;  /* 缇色 */
  --yue-bai:        #F3F5F7;  /* 月白 → 冷调中性白，不再发绿 */
  --xiang-ya-bai:   #FFFFFF;  /* 象牙白 → 纯白卡片，更干净 */
  --gao-se:         #EDF1F4;  /* 缟色 → 冷灰 */
  --mo-se:          #1B1F24;  /* 墨 · 主文字（去掉绿味） */
  --xuan-qing:      #4A4E57;  /* 玄青 · 次文字 */
  --dai-se:         #5B6472;  /* 黛色 */

  --card-radius: 16px;
  --card-padding: 16px;
  --gap: 12px;
  --screen-padding: 16px;

  --bg: var(--yue-bai);
  --surface: var(--xiang-ya-bai);
  --surface-alt: var(--gao-se);
  --text-1: var(--mo-se);
  --text-2: rgba(27, 31, 36, .58);
  --text-3: rgba(91, 100, 114, .42);
  --accent: var(--tian-qing-deep);
  --separator: rgba(27, 31, 36, .07);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171C;
    --surface: #1E2228;
    --surface-alt: #272C33;
    --text-1: #ECEFF3;
    --text-2: #9AA3AE;
    --text-3: #626B76;
    --accent: #4DA3DC;
    --separator: rgba(255, 255, 255, .08);
    /* 深色模式用珊瑚粉本源色（浅色模式为加深版 #C9483F） */
    --shan-hu: #FA9894;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

/* ═══════════════════════════════════════════════
   iOS 26 Liquid Glass · 液态玻璃设计系统
   ───────────────────────────────────────────────
   还原四个核心特征：
   ① 背景折射     backdrop-filter blur + saturate
   ② 高光边线     内描边 + inset 高光，模拟玻璃棱边
   ③ 厚度折射     多层 box-shadow，不是一层薄片
   ④ 动态响应     滚动/按压时改变透明度与高光位置
   ═══════════════════════════════════════════════ */

/* ── 玻璃基色：受光面 / 背光面 ── */
.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  /* 厚度：外阴影撑起层次，内描边勾勒棱边 */
  box-shadow:
    0 1px 0 0 var(--glass-edge),                    /* 顶部受光亮线 */
    0 -1px 0 0 var(--glass-edge-dim) inset,         /* 底部背光暗线 */
    0 8px 32px -8px var(--glass-shadow),            /* 投影厚度 */
    inset 0 1px 0 0 var(--glass-highlight);         /* 内侧高光 */
}

/* 高光斜扫：玻璃表面那道流动的反光 */
.glass::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1px;                                   /* 用 padding 做 1px 描边 */
  background: linear-gradient(
    145deg,
    var(--glass-stroke-strong) 0%,
    var(--glass-stroke-weak) 38%,
    transparent 62%,
    var(--glass-stroke-weak) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
}

/* 内层漫射光：让玻璃有"体积"而不是一张贴纸 */
.glass::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    120% 80% at 50% -20%,
    var(--glass-glow) 0%,
    transparent 60%
  );
  pointer-events: none;
}

/* ── 玻璃在浅色 / 深色下的参数 ── */
:root {
  --glass-blur: 24px;
  --glass-saturate: 190%;
  --glass-bg: rgba(255, 255, 255, .62);
  --glass-edge: rgba(255, 255, 255, .85);
  --glass-edge-dim: rgba(0, 0, 0, .045);
  --glass-highlight: rgba(255, 255, 255, .70);
  --glass-shadow: rgba(20, 30, 45, .16);
  --glass-stroke-strong: rgba(255, 255, 255, .95);
  --glass-stroke-weak: rgba(255, 255, 255, .30);
  --glass-glow: rgba(255, 255, 255, .55);
  /* 卡片内部小件：半透明亚光，避免玻璃叠玻璃导致层级混乱 */
  --glass-inner: rgba(255, 255, 255, .52);
  --glass-inner-2: rgba(255, 255, 255, .34);
}
@media (prefers-color-scheme: dark) {
  :root {
    --glass-bg: rgba(38, 43, 51, .58);
    --glass-edge: rgba(255, 255, 255, .16);
    --glass-edge-dim: rgba(255, 255, 255, .05);
    --glass-highlight: rgba(255, 255, 255, .12);
    --glass-shadow: rgba(0, 0, 0, .50);
    --glass-stroke-strong: rgba(255, 255, 255, .34);
    --glass-stroke-weak: rgba(255, 255, 255, .10);
    --glass-glow: rgba(255, 255, 255, .16);
    --glass-inner: rgba(255, 255, 255, .09);
    --glass-inner-2: rgba(255, 255, 255, .055);
  }
}

/* ── 玻璃强度分级（模拟 iOS 的 regular / clear 两档）── */
.glass--thick { --glass-bg: rgba(255, 255, 255, .78); --glass-blur: 30px; }
.glass--thin  { --glass-bg: rgba(255, 255, 255, .42); --glass-blur: 16px; }
@media (prefers-color-scheme: dark) {
  .glass--thick { --glass-bg: rgba(38, 43, 51, .74); --glass-blur: 30px; }
  .glass--thin  { --glass-bg: rgba(38, 43, 51, .38); --glass-blur: 16px; }
}

/* ── 滚动响应：下滑时玻璃变实，回顶时变透（iOS 26 行为）── */
body.is-scrolled .glass--adaptive {
  --glass-bg: rgba(255, 255, 255, .80);
  --glass-blur: 30px;
}
@media (prefers-color-scheme: dark) {
  body.is-scrolled .glass--adaptive { --glass-bg: rgba(38, 43, 51, .78); }
}

/* ── 不支持 backdrop-filter 时降级为不透明底，保证可读性 ── */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .glass--thin { background: var(--surface-alt); }
}

/* ── 玻璃按钮：点击时玻璃"压下去"，高光偏移 ── */
.glass-btn {
  position: relative; overflow: hidden;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-edge);
  box-shadow: 0 4px 16px -6px var(--glass-shadow), inset 0 1px 0 0 var(--glass-highlight);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1),
              box-shadow .2s ease, background .2s ease;
}
.glass-btn:active {
  transform: scale(.94);
  box-shadow: 0 2px 8px -4px var(--glass-shadow), inset 0 2px 6px 0 var(--glass-edge-dim);
}

/* ── 减少动态效果 ── */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text-1);
  /* 底部内容预留：内容下边缘锚定在距屏幕底 105px。
     自屏幕底往上：下留白 14 → 胶囊 59 → 胶囊上沿 73 → 与内容间隙 32 → 105。
     iOS 侧用同一组数字（胶囊 64pt）：14 + 64 = 78，间隙 27，同样落在 105。
     即 105 是两端共同的锚点，胶囊高度差 5px 由间隙吸收。
     105 − 系统安全区 34 = 71。 */
  padding-bottom: calc(71px + env(safe-area-inset-bottom));
  transition: background .2s;
  position: relative;
  overflow-x: hidden;
}

/* 氛围光斑层 —— 玻璃的折射感来自背景有东西可折射。
   固定在底层，随页面滚动保持不动，模拟 iOS 壁纸透过玻璃的效果。 */
body::before {
  content: '';
  position: fixed; inset: -10%;
  z-index: -1;
  pointer-events: none;
  /* v2：光斑改由 .screen 按设计稿坐标绘制（300×300 @180,-60 等），
     这一层是 v1 的百分比定位版，已停用 —— 否则两层叠在一起永远对不上。 */
  display: none;
  background:
    radial-gradient(38% 26% at 18% 12%, var(--aura-1) 0%, transparent 68%),
    radial-gradient(34% 24% at 84% 22%, var(--aura-2) 0%, transparent 66%),
    radial-gradient(44% 30% at 62% 88%, var(--aura-3) 0%, transparent 70%),
    radial-gradient(30% 22% at 8% 76%, var(--aura-4) 0%, transparent 68%);
  filter: blur(6px);
}
:root {
  --aura-1: rgba(46, 139, 192, .16);
  --aura-2: rgba(22, 184, 154, .13);
  --aura-3: rgba(77, 163, 220, .14);
  --aura-4: rgba(242, 153, 74, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --aura-1: rgba(46, 139, 192, .22);
    --aura-2: rgba(22, 184, 154, .16);
    --aura-3: rgba(30, 127, 194, .20);
    --aura-4: rgba(242, 153, 74, .12);
  }
}

/* ─────────── 顶部悬浮徽标（Liquid Glass 胶囊）───────────
   页面大标题已与底部导航重复，故移除 —— 此处只保留数据来源徽标，
   做成悬浮玻璃胶囊，不再占据整条吸顶栏。 */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; justify-content: flex-end;
  background: transparent;
  border: none; box-shadow: none;
  padding: calc(env(safe-area-inset-top) + 8px) var(--screen-padding) 8px;
  /* 胶囊上方的渐变遮罩，滚动时内容不会从徽标旁边"硬切"出来 */
  pointer-events: none;
}
.topbar::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 0;
  height: 100%;
  background: linear-gradient(
    to bottom,
    color-mix(in srgb, var(--bg) 92%, transparent) 0%,
    color-mix(in srgb, var(--bg) 72%, transparent) 62%,
    transparent 100%
  );
  -webkit-mask: none;
  backdrop-filter: blur(10px) saturate(160%);
  -webkit-backdrop-filter: blur(10px) saturate(160%);
  z-index: -1;
  pointer-events: none;
}
/* 移除旧的高光扫线与标题样式 */
.topbar::after { display: none; }
body.is-scrolled .topbar::before {
  background: linear-gradient(
    to bottom,
    color-mix(in srgb, var(--bg) 96%, transparent) 0%,
    color-mix(in srgb, var(--bg) 84%, transparent) 60%,
    transparent 100%
  );
}
/* 模式徽标：悬浮玻璃胶囊 */
.badge-mode {
  position: relative; pointer-events: auto;
  font-size: 11px; padding: 5px 12px; border-radius: 20px;
  background: var(--glass-bg); color: var(--tian-qing-deep); font-weight: 600;
  border: 1px solid var(--glass-stroke-weak);
  backdrop-filter: blur(18px) saturate(190%);
  -webkit-backdrop-filter: blur(18px) saturate(190%);
  box-shadow:
    inset 0 1px 0 0 var(--glass-highlight),
    0 4px 16px -8px var(--glass-shadow);
  display: inline-flex; align-items: center; gap: 5px;
}
/* 状态圆点：模拟数据为琥珀色、真实数据为青碧、未连接为灰 */
.badge-mode::before {
  content: '';
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--teng-huang);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--teng-huang) 22%, transparent);
}
.badge-mode[data-mode="live"]::before {
  background: var(--qing-bi);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--qing-bi) 22%, transparent);
}
.badge-mode[data-mode="offline"]::before {
  background: var(--text-3);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--text-3) 18%, transparent);
}
@media (prefers-color-scheme: dark) {
  .badge-mode { color: var(--tian-qing); }
}

/* ─────────── 容器 ─────────── */
.wrap { padding: var(--screen-padding); display: flex; flex-direction: column; gap: var(--gap); }

/* ─────────── 卡片（Liquid Glass 卡片层）─────────── */
.card {
  position: relative;
  /* 卡片玻璃比导航层更实（内容可读性优先），近似 iOS 的 regular 材质 */
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border-radius: var(--card-radius);
  padding: var(--card-padding);
  border: 1px solid var(--glass-stroke-weak);
  box-shadow:
    inset 0 1px 0 0 var(--glass-highlight),
    0 6px 24px -12px var(--glass-shadow);
  transition: box-shadow .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
}
/* 卡片顶部高光扫线，呼应玻璃受光面 */
.card::before {
  content: '';
  position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
  border-radius: 1px;
  background: linear-gradient(
    90deg, transparent, var(--glass-stroke-strong) 50%, transparent
  );
  opacity: .8; pointer-events: none;
}
.card-title {
  font-size: 15px; font-weight: 600; margin: 0 0 12px;
  display: flex; align-items: center; justify-content: space-between;
}

/* ─────────── 车辆位置卡 ─────────── */
/* 地图缩略图由后端代取（/api/vehicle/location/map.png），key 不在前端。
   取图失败时 onerror 直接隐藏，下方的地址与坐标仍然可读 ——
   位置卡的价值主要在「车最后停在哪」，图只是辅助。 */
.loc-map {
  width: 100%; height: 148px; object-fit: cover;
  border-radius: 10px; display: block; margin-bottom: 10px;
  background: var(--surface-alt);
}
.loc-addr {
  font-size: 13.5px; font-weight: 500; line-height: 1.45;
  margin-bottom: 4px; word-break: break-word;
}
.loc-note {
  font-size: 11px; color: var(--text-3); margin-top: 7px; line-height: 1.55;
}

/* ─────────── 加载指示 ─────────── */
/* 全局请求进度条：任何接口在飞就显示，全部结束就淡出。
   不挂在 render() 里 —— render 会重建整棵 DOM，每次请求都重绘会让卡片闪；
   这里直接操作一个固定元素，零重绘。 */
.net-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  z-index: 999; pointer-events: none; opacity: 0;
  transition: opacity .2s ease;
  background: linear-gradient(90deg,
    transparent 0%, var(--dian-qing) 45%, var(--dian-qing) 55%, transparent 100%);
  background-size: 40% 100%; background-repeat: no-repeat;
  animation: netSweep 1.1s linear infinite;
}
.net-bar.on { opacity: 1; }
@keyframes netSweep {
  from { background-position: -45% 0; }
  to   { background-position: 145% 0; }
}

/* 骨架屏：只在"首次加载、还没有任何数据"时用。
   已经有一屏数据时不要换成骨架 —— 那会让整块内容闪一下再回来。 */
.st-skel { display: flex; flex-direction: column; gap: 8px; margin-top: 9px; }
.skel-row {
  border-radius: 11px; padding: 12px;
  background: var(--glass-inner-2);
  display: flex; flex-direction: column; gap: 7px;
}
.skel-line {
  height: 10px; border-radius: 6px; background: var(--separator);
  animation: skelPulse 1.2s ease-in-out infinite;
}
.skel-line.w70 { width: 70%; }
.skel-line.w35 { width: 35%; }
@keyframes skelPulse { 0%, 100% { opacity: .40; } 50% { opacity: .85; } }

/* 已有数据时的刷新：整体压暗 + 暂停交互，比整块清空再重建要稳得多 */
.st-list.is-busy { opacity: .45; pointer-events: none; transition: opacity .15s; }

/* ─────────── 主卡：电量环形 ─────────── */
.hero { display: flex; gap: 20px; align-items: center; }
.ring-wrap { position: relative; flex-shrink: 0; }
.ring-wrap svg { display: block; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-alt); }
.ring-fg {
  fill: none; stroke-linecap: round;
  transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1), stroke .3s;
}
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-num {
  font-size: 32px; font-weight: 600; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -1px;
}
.ring-num .pct { font-size: 16px; font-weight: 500; opacity: .5; margin-left: 1px; }
.ring-label { font-size: 10px; color: var(--text-3); margin-top: 5px; }
.ring-bolt {
  position: absolute; top: 12px; right: 12px;
  color: var(--dian-qing); font-size: 15px;
}

/* ── 低电量警示效果 ────────────────────────────
   中档（30~50%）藤黄：仅换色 + 轻微光晕，提示但不打扰
   低档（<30%）朱砂：环体呼吸脉冲 + 外发光 + 「电量偏低」标签 */
.ring-wrap--mid .ring-fg {
  filter: drop-shadow(0 0 5px color-mix(in srgb, var(--teng-huang) 42%, transparent));
}
.ring-wrap--low .ring-fg {
  filter: drop-shadow(0 0 7px color-mix(in srgb, var(--zhu-sha) 55%, transparent));
}
/* 呼吸脉冲：环体明暗与半径交替，模拟"心跳"警示 */
.ring-pulse {
  transform-origin: 50% 50%;
  animation: ringPulse 1.6s ease-in-out infinite;
}
@keyframes ringPulse {
  0%, 100% { opacity: 1;    transform: scale(1); }
  50%      { opacity: .55;  transform: scale(1.035); }
}
/* 环内数字同步脉冲，强化注意力 */
.ring-wrap--low .ring-num { animation: ringNumPulse 1.6s ease-in-out infinite; }
@keyframes ringNumPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .68; }
}
/* 「电量偏低」胶囊标签，贴在环下方 */
.ring-alert {
  position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
  font-size: 10px; font-weight: 600; white-space: nowrap;
  padding: 2px 9px; border-radius: 10px;
  color: #fff;
  background: var(--zhu-sha);
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--zhu-sha) 60%, transparent);
  animation: alertIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes alertIn { from { opacity: 0; transform: translateX(-50%) scale(.8); } }

@media (prefers-reduced-motion: reduce) {
  .ring-pulse, .ring-wrap--low .ring-num, .ring-alert { animation: none !important; }
}

.hero-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.hero-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
.hero-plate { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.hr { height: 1px; background: var(--separator); }
.mini-row { display: flex; justify-content: space-between; align-items: baseline; }
.mini-label { font-size: 12px; color: var(--text-3); }
.mini-val {
  font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
}

/* ─────────── 充电卡 ─────────── */
.card-charging {
  background: color-mix(in srgb, var(--piao-se) 55%, var(--surface));
}
@media (prefers-color-scheme: dark) {
  .card-charging { background: rgba(77,163,220,.10); }
}
.charge-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--dian-qing);
}
.charge-grid { display: flex; margin-top: 12px; }
.charge-item { flex: 1; text-align: center; }
.charge-item .v {
  font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums;
}
.charge-item .k { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.charge-eta {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-2); margin-top: 11px;
}

/* ─────────── 图标（内联 SVG，避免 emoji 渲染差异）─────────── */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex-shrink: 0; }
.ic-sm { width: 14px; height: 14px; display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

/* ─────────── 统计卡头部 ─────────── */
.stat .head .ic-sm { opacity: .75; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.stat { background: var(--glass-inner); border-radius: var(--card-radius); padding: 13px 14px;
  box-shadow: inset 0 1px 0 0 var(--glass-highlight); }
.stat .head {
  display: flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--text-3); margin-bottom: 7px;
}
.stat .val {
  font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums;
  letter-spacing: -.4px;
}
.stat .val .u { font-size: 11px; font-weight: 400; color: var(--text-3); margin-left: 3px; }

/* ─────────── 胎压 ─────────── */
/* ─────────── 胎压（紧凑横排，一行四列）─────────── */
.tyre-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.tyre {
  background: var(--glass-inner-2); border-radius: 10px;
  padding: 9px 3px; text-align: center;
  box-shadow: inset 0 1px 0 0 var(--glass-highlight);
}
.tyre .v {
  font-size: 16px; font-weight: 600; line-height: 1.15;
  font-variant-numeric: tabular-nums;
  color: var(--dian-lan);   /* 靛蓝：读数感、不是纯黑也不像告警 */
}
.tyre .k { font-size: 10px; color: var(--text-3); margin-bottom: 3px; }
/* 越界用琥珀而不是朱砂：胎压偏高/偏低是"该看一眼"，不是"车坏了"，
   朱砂留给车门未关、车窗未关这类真正需要立刻处理的状态 */
.tyre.warn .v { color: var(--teng-huang); }

/* ─────────── 车身状态 chip ─────────── */
.chip {
  display: flex; align-items: center; gap: 9px;
  background: var(--glass-inner-2); border-radius: 11px; padding: 11px 12px;
}
  /* 车身状态 chip —— 每种状态给独立语义色，不滥用告警色 */
  .chip .ico {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600;
  }
  .chip .txt { min-width: 0; }
  .chip .t { font-size: 11px; color: var(--text-3); }
  .chip .s { font-size: 13px; font-weight: 500; margin-top: 1px; }

  /* 正常/安全 —— 青碧 */
  .chip.good .ico { background: rgba(22,184,154,.14); color: var(--qing-bi); }
  .chip.good .s { color: var(--qing-bi); }

  /* 需要注意 —— 朱砂（仅用于真正的异常） */
  .chip.bad .ico { background: rgba(229,72,59,.13); color: var(--zhu-sha); }
  .chip.bad .s { color: var(--zhu-sha); }

  /* 中性状态 —— 天青（空调开关等非异常状态） */
  .chip.mid .ico { background: rgba(28,111,168,.14); color: var(--tian-qing-deep); }
  .chip.mid .s { color: var(--tian-qing-deep); }

  /* 关闭态 —— 灰调，明确表示「非异常但未启用」 */
  .chip.off .ico { background: rgba(91,100,114,.10); color: var(--text-3); }
  .chip.off .s { color: var(--text-2); }
  /* 关闭态的 chip 本体压暗一档，避免与卡片底色糊在一起 */
  .chip.off { background: rgba(91,100,114,.05); }

  /* 未知态 —— 网关没给这个字段。
     与 off（确认关闭）严格区分：off 是"读了，是关的"，
     unknown 是"没读到"。把两者混同会让用户在没有数据时看到
     「已关」这种假结论（车窗尤其危险 —— 以为关了其实没关）。 */
  .chip.unknown .ico { background: rgba(91,100,114,.08); color: var(--text-3); opacity: .75; }
  .chip.unknown .s { color: var(--text-3); font-weight: 400; }
  .chip.unknown { background: rgba(91,100,114,.03); }
  .chip.unknown .s::after { content: ''; }

/* ─────────── 轨迹缩略图（行程回放）─────────── */
.track {
  margin-top: 8px; border-radius: 10px; overflow: hidden;
  background: var(--glass-inner-2); padding: 8px 10px;
}
  .track svg { display: block; width: 100%; height: 52px; }
  .track .tk-legend {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--text-3); margin-top: 2px;
  }

/* ─────────── 附近充电站 ───────────
   一行一站：左侧站名 + 元信息，右侧当前电价。
   价格刻意用靛青（--dian-qing，本项目"电"的语义色），与消费卡的
   青碧/朱砂互不干扰。点击一行展开分时电价表。 */
.st-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-top: 10px;
}
/* 列表固定高度、自己滚。
   **卡片本身不动**：手指在列表上滑就翻站点，滑到非列表区域才是翻整页 ——
   这样"附近有哪些站"始终钉在同一块地方，下面的「充入电量」「充电记录」
   也不用先滚过一长串站点才能看到。 */
.st-list {
  display: flex; flex-direction: column; gap: 8px; margin-top: 9px;
  max-height: 384px;
  overflow-y: auto;
  /* 滚到底不会"惯性穿透"把整页带走 */
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-right: 2px;
  scrollbar-width: thin;
}
.st-list::-webkit-scrollbar { width: 3px; }
.st-list::-webkit-scrollbar-thumb {
  background: var(--separator); border-radius: 3px;
}
/* 筛选条：一行横向可滚的 chip。
   刻意不复用排序的 .seg —— 排序是"多选一"，筛选是"两组互斥 + 两个开关"，
   混用一个控件会让"点一下是换排序还是加筛选"变得没法解释。 */
.st-filter {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}
.st-filter::-webkit-scrollbar { display: none; }
.st-chip {
  flex: none; border: none; font: inherit; font-size: 11.5px; cursor: pointer;
  padding: 6px 11px; border-radius: 999px; white-space: nowrap;
  background: var(--glass-inner-2); color: var(--text-2);
  transition: background .15s, color .15s;
}
.st-chip.on { background: rgba(30,127,194,.14); color: var(--dian-qing); font-weight: 600; }
.st-chip:active { opacity: .72; }
.st-chip.reset { color: var(--text-3); }
.st {
  background: var(--glass-inner-2); border-radius: 11px;
  padding: 11px 12px; cursor: pointer;
  transition: background .15s;
}
.st:active { background: var(--glass-inner); }
.st-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.st-name {
  font-size: 13.5px; font-weight: 500; color: var(--text-1); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.st-price {
  flex: none; font-size: 16px; font-weight: 600; color: var(--dian-qing);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.st-price .u { font-size: 10.5px; font-weight: 400; color: var(--text-3); margin-left: 1px; }
/* 价格缺失 ≠ 免费 —— 用弱化灰而非 0，避免被读成"这个站不要钱" */
.st-price.na { color: var(--text-3); font-size: 13px; font-weight: 400; }
.st-meta {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 11px; color: var(--text-3); margin-top: 5px;
}
.st-meta .ok { color: var(--qing-bi); }
.st-meta .gone { color: var(--zhu-sha); }
.st-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 5px;
  background: rgba(30,127,194,.12); color: var(--dian-qing);
}
.st-periods {
  margin-top: 9px; padding-top: 8px;
  border-top: 1px solid var(--glass-inner-2);
  display: flex; flex-direction: column; gap: 5px;
}
.st-period {
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 11.5px; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
/* 当前时段高亮 —— 这张卡最该被一眼看到的信息 */
.st-period.now { color: var(--dian-qing); font-weight: 600; }
.st-note { font-size: 10.5px; color: var(--text-3); margin-top: 7px; line-height: 1.6; }
/* 列表底部的分页提示 / 加载更多哨兵 */
.st-more {
  padding: 14px 0 4px;
  text-align: center;
  font-size: 10.5px;
  color: var(--text-3);
  letter-spacing: .02em;
}
/* 展开态：列表自己滚，不再把整页撑长。
   `overscroll-behavior: contain` 很关键 —— 否则滚到底会"惯性穿透"到页面，
   手指一滑整页就跳走了。 */
.st-actions { display: flex; gap: 8px; margin-top: 9px; }
.st-btn {
  flex: 1; border: none; font: inherit; font-size: 12px; cursor: pointer;
  padding: 8px 0; border-radius: 9px;
  background: rgba(30,127,194,.12); color: var(--dian-qing);
}
.st-btn.ghost { background: var(--glass-inner-2); color: var(--text-2); }
.st-btn:active { opacity: .72; }
.st-input {
  flex: 1; min-width: 0; font: inherit; font-size: 12px;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--separator);
  background: var(--surface-alt); color: var(--text-1);
}
@media (prefers-color-scheme: dark) {
  .st-price, .st-period.now { color: var(--accent); }
  .st-tag { background: rgba(77,163,220,.16); color: var(--accent); }
  .st-btn { background: rgba(77,163,220,.16); color: var(--accent); }
}

/* ─────────── 车辆能力集 ─────────── */
.cap-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap {
    font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
    background: rgba(22,184,154,.10); color: var(--qing-bi);
  }
  .cap.no { background: rgba(91,100,114,.08); color: var(--text-3); text-decoration: line-through; }
  /* 权限列表的「…」：虚线描边，一眼看出是可点的，而不是一项权限 */
  .cap-more {
    font-family: inherit; cursor: pointer; letter-spacing: 1px;
    background: transparent; color: var(--text-3);
    border: 1px dashed rgba(91,100,114,.32);
  }
  .cap-more:hover { color: var(--accent); border-color: var(--accent); }
  .cap-badge { font-size: 10.5px; font-weight: 400; color: var(--text-3); }
  .cap-hint {
    margin-top: 10px; font-size: 11px; color: var(--text-3);
    padding: 7px 10px; border-radius: 9px; background: rgba(91,100,114,.05);
  }

/* ─────────── 开关（车控总开关）。
   只是包一层 label，视觉上仍是 iOS 那种系统开关：
   轨道灰 → 开启时染主色，圆点带轻微投影。 */
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.sw-txt { min-width: 0; }
.sw-txt .t { display: block; font-size: 14px; color: var(--text-1); }
.sw-txt .d { display: block; font-size: 11px; color: var(--text-3); margin-top: 3px; }
.sw {
  flex: none; position: relative; margin: 0;
  width: 46px; height: 28px; border-radius: 999px;
  -webkit-appearance: none; appearance: none;
  background: rgba(91, 100, 114, .22);
  transition: background .22s ease; cursor: pointer;
}
.sw::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(20, 30, 45, .30);
  transition: transform .22s cubic-bezier(.22, .61, .36, 1);
}
.sw:checked { background: var(--tian-qing); }
.sw:checked::after { transform: translateX(18px); }
/* 开启后的风险提示：用缇色（非告警朱砂）—— 是提醒，不是错误 */
.sw-warn {
  margin-top: 10px; font-size: 11px; line-height: 1.6;
  color: var(--ti-se);
}
  /* 胎温（与胎压同格显示，小字附在主值下方） */
  .tyre .t { font-size: 10px; color: var(--text-3); margin-top: 1px; }

/* ─────────── 车控按钮（含完整按压 / 下发 / 成功动效）─────────── */
.ctrl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.ctrl-grid + .ctrl-grid { margin-top: var(--gap); }

.ctrl {
  position: relative; overflow: hidden;
  /* 车控按钮走玻璃质感，与卡片同层 */
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid var(--glass-stroke-weak); border-radius: 13px;
  padding: 14px 6px; min-height: 82px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  font-family: inherit; font-size: 12px; color: var(--text-1);
  cursor: pointer; -webkit-user-select: none; user-select: none;
  box-shadow: inset 0 1px 0 0 var(--glass-highlight);
  transition: transform .16s cubic-bezier(.34,1.56,.64,1),
              background .18s ease, color .18s ease, box-shadow .18s ease;
}

/* 图标：按压时轻微下沉 + 回弹 */
.ctrl .ico {
  position: relative;             /* 供成功态的脉冲圈定位 */
  display: flex; align-items: center; justify-content: center;
  transition: transform .28s cubic-bezier(.34,1.56,.64,1);
}
.ctrl svg { width: 22px; height: 22px; display: block; }
.ctrl-txt { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
.ctrl-sub { font-size: 9.5px; color: var(--text-3); transition: color .18s ease; }

/* ① 按压反馈：下沉 + 微缩 + 玻璃内凹 */
.ctrl:active {
  transform: scale(.93);
  background: color-mix(in srgb, var(--tian-qing) 14%, var(--glass-bg));
  color: var(--tian-qing-deep);
  box-shadow: inset 0 2px 8px var(--glass-edge-dim);
}
.ctrl:active .ico { transform: scale(.86) translateY(1px); }
.ctrl:active .ctrl-sub { color: color-mix(in srgb, var(--tian-qing-deep) 70%, transparent); }

/* ② 涟漪：点击处扩散，纯 CSS 变量驱动 */
.ctrl .ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: currentColor; opacity: .22;
  transform: translate(-50%, -50%) scale(0);
  animation: ctrlRipple .55s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes ctrlRipple {
  to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* ③ 开关型：开启态只染图标 + 文字加粗。
   不再整块铺主色 —— 整块变色在密集网格里过重，且盖掉了玻璃质感。
   现在按钮底保持与未开启时一致，仅靠「图标着色」传达状态，
   一眼能扫出哪些是开着的，又不破坏网格的整齐。 */
.ctrl--toggle.on {
  color: var(--text-1);
}
.ctrl--toggle.on .ico {
  color: var(--shan-hu);
  /* 轻微辉光：让着色图标从玻璃底上「浮」起来，弥补线条显色面积小 */
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--shan-hu) 45%, transparent));
}
.ctrl--toggle.on .ico svg { stroke-width: 2; }
/* 开启态文字加粗，与图标的重量感对齐 */
.ctrl--toggle.on .ctrl-txt { font-weight: 600; }
.ctrl--toggle.on .ctrl-sub { color: var(--text-2); }
.ctrl--toggle.on:active {
  background: color-mix(in srgb, var(--shan-hu) 12%, var(--glass-bg));
}

/* ④ 瞬时动作用菱形角标，和开关型区分开 */
.ctrl--action::after {
  content: ''; position: absolute; top: 7px; right: 7px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--text-3); opacity: .45;
}
.ctrl--action:active::after { opacity: 0; }

/* ⑤ 场景型：横向铺开、带副标题 */
.ctrl--scene { min-height: 74px; }
.ctrl--scene .ico svg { width: 20px; height: 20px; }

/* ⑥ 禁用态（如未插枪时不能开充） */
.ctrl[disabled] { opacity: .38; pointer-events: none; }

/* ⑦ 下发中：转圈遮罩，锁定重复点击 */
.ctrl-spin {
  position: absolute; inset: 0;
  display: none; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--surface-alt) 78%, transparent);
  backdrop-filter: blur(1px);
}
/* 开启态按钮底已是普通玻璃，转圈遮罩无需再为主色块特调 */
.ctrl-spin::after {
  content: ''; width: 17px; height: 17px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--text-3) 35%, transparent);
  border-top-color: var(--accent);
  animation: ctrlSpin .7s linear infinite;
}
@keyframes ctrlSpin { to { transform: rotate(360deg); } }

.ctrl.busy { pointer-events: none; }
.ctrl.busy .ctrl-spin { display: flex; }

/* ⑧ 第二段：等待车端执行确认（queryProcessResult）
   与 busy（HTTP 请求中）在语义上必须分开 ——
   网关收下令只是"已受理"，车不一定动了。用琥珀色转圈区分两个阶段，
   避免出现"以为锁了车其实没锁"的假成功。 */
.ctrl.pending { pointer-events: none; }
.ctrl.pending .ctrl-spin { display: flex; }
.ctrl.pending .ctrl-spin::after { border-top-color: var(--teng-huang); }
.ctrl.pending .ctrl-sub { color: var(--teng-huang); }

/* ⑨ 超时未确认：琥珀告警，不当作成功也不当作失败 */
.ctrl.unconfirmed .ico { color: var(--teng-huang); }
.ctrl.unconfirmed .ctrl-sub { color: var(--teng-huang); }

/* ⑧ 成功反馈：图标弹跳 + 着色 + 外圈脉冲，1 秒后自动复位。

   原先用 .ctrl-ok 整块铺满按钮（青碧底 + 白勾），是满屏大色块，
   与开启态整块变色是同一个毛病。现改为「图标自己动」：
   颜色只落在 22px 的图标上，遮罩整块铺色彻底去掉。
   状态靠颜色 + 形状双重传达，不依赖大面积底色。 */
.ctrl.done { animation: ctrlBounce .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes ctrlBounce {
  0% { transform: scale(.93); }
  55% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* 成功：图标变青碧 + 弹一下 */
.ctrl.done .ico {
  animation: ctrlIcoPop .5s cubic-bezier(.34,1.56,.64,1);
}
.ctrl.done:not(.fail) .ico { color: var(--qing-bi); }
@keyframes ctrlIcoPop {
  0%   { transform: scale(.72); }
  55%  { transform: scale(1.16); }
  100% { transform: scale(1); }
}

/* 成功后图标外圈扩散一圈青碧脉冲（只用描边，不铺底） */
.ctrl.done:not(.fail) .ico::after {
  content: ''; position: absolute;
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--qing-bi);
  animation: ctrlPulse .62s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes ctrlPulse {
  from { opacity: .7; transform: scale(.55); }
  to   { opacity: 0;  transform: scale(1.05); }
}

/* ⑨ 失败反馈：图标变朱砂红 + 左右抖动（按钮整体抖，不改底色） */
.ctrl.fail .ico { color: var(--zhu-sha); }
.ctrl.fail { animation: ctrlShake .4s; }
@keyframes ctrlShake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

/* 分组小标题 + 右上角状态提示 */
.ctrl-sep {
  display: flex; align-items: center; gap: 9px;
  font-size: 11px; color: var(--text-3); font-weight: 500;
  margin: 16px 0 10px;
}
.ctrl-sep::after { content: ''; flex: 1; height: 1px; background: var(--separator); }
.ctrl-hint { font-size: 11px; color: var(--text-3); font-weight: 400; }

/* 尊重系统「减弱动态效果」 */
@media (prefers-reduced-motion: reduce) {
  .ctrl, .ctrl .ico, .ctrl .ico::after { animation: none !important; transition-duration: .01ms !important; }
  .ctrl .ripple { display: none; }
}

/* ─────────── 底部 Tab（设计规格 §3，逐值照抄）───────────
   容器 390×90（padding 12/21/21），Pill 348×62 r36，5 项各 62×54。
   选中态只换颜色，不做胶囊/底色/放大。 */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex;
  padding: 12px 21px calc(env(safe-area-inset-bottom) + 21px);
  background: transparent;
  pointer-events: none;
}
.tabbar-inner {
  flex: 1; display: flex; pointer-events: auto;
  height: 62px; padding: 0 10px;
  border-radius: 36px;
  border: 1.5px solid rgba(255,255,255,.95);
  background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.26));
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow:
    inset 0 1px 2px 1px rgba(255,255,255,.90),
    inset 0 7px 16px rgba(255,255,255,.45),
    inset 0 -2px 3px rgba(74,87,120,.12),
    0 2px 5px rgba(74,87,120,.09),
    0 16px 38px rgba(74,87,120,.24);
  overflow: hidden;
}
.tab {
  flex: 1; position: relative; border: none; background: none; font-family: inherit;
  padding: 6px 4px; min-height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-size: 11px; font-weight: 500; color: #5E6775; cursor: pointer;
  transition: color .18s ease;
}
.tab svg { width: 24px; height: 24px; display: block; }
.tab svg * { stroke-width: 1.7; }
.tab:active { opacity: .72; }
.tab.on { color: #6742E8; font-weight: 500; }

/* ─────────── 图表 ─────────── */
.chart-box { background: var(--glass-bg); border-radius: var(--card-radius); padding: var(--card-padding); }
.seg {
  display: inline-flex; background: var(--glass-inner-2);
  border-radius: 9px; padding: 2px; gap: 2px;
}
.seg button {
  border: none; background: none; font-family: inherit;
  font-size: 12px; color: var(--text-2);
  padding: 5px 13px; border-radius: 7px; cursor: pointer;
  transition: background .15s, color .15s;
}
.seg button.on { background: var(--glass-inner); color: var(--text-1); font-weight: 600; }

/* 行程/能耗：区间条（左：日期与统计范围，右：时间区间切换） */
.en-range {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 11px; color: var(--text-3); line-height: 1.5;
}
.en-range .seg button { font-size: 11px; padding: 3px 9px; }
.en-unit { font-size: 11px; font-weight: 400; color: var(--text-3); }
/* 图表横向滚动容器：点位多时横向滑动，不压缩间距 */
.chart-scroll {
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.chart-scroll::-webkit-scrollbar { height: 3px; }
.chart-scroll::-webkit-scrollbar-thumb {
  background: rgba(128,128,128,.28); border-radius: 3px;
}
/* 图表图例圆点：与折线同色 */
.en-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
/* 直流/交流电量拆分：只是给上面的数补一句，单独成卡太碎，压成一行贴在下面。 */
.ch-split {
  margin-top: 9px; font-size: 11.5px; color: var(--text-3);
  font-variant-numeric: tabular-nums;
}
/* 大数区的左右分栏：左边电量、右边金额。
   金额原来单独占一张卡，但它跟"这个月充了多少度"是同一笔账 ——
   电量左边、金额右边的空白，正好一人一半。
   金额区两行「标签 + 数值」：标签在左、数字在右，同一行读完；
   拆成"数字一行、标签一行"要多扫一眼才知道那个数是什么。 */
.ch-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ch-money { flex: 0 0 auto; padding-top: 3px; }
.ch-money .row {
  display: flex; align-items: baseline; justify-content: flex-end; gap: 6px;
  font-variant-numeric: tabular-nums;
}
.ch-money .row + .row { margin-top: 3px; }
.ch-money .k { font-size: 10.5px; opacity: .82; }
.ch-money .v { font-size: 21px; font-weight: 600; letter-spacing: -.4px; line-height: 1.15; }
.ch-money .v2 { font-size: 13px; font-weight: 600; opacity: .9; }
.ch-money .v.na { font-size: 14px; font-weight: 600; opacity: .86; letter-spacing: 0; }
/* 月份筛选行：左侧标签 + 原生 select（样式贴近玻璃卡片） */
.en-month-row { gap: 8px; }
.en-month-label { display: inline-flex; align-items: center; gap: 5px; }
.en-month-btn {
  display: inline-flex; align-items: center; gap: 3px;
  border: none; background: var(--glass-inner-2);
  color: var(--text-1); font-family: inherit; font-size: 12.5px; font-weight: 500;
  padding: 5px 8px 5px 10px; border-radius: 8px; cursor: pointer;
}
.en-month-btn svg { width: 12px; height: 12px; opacity: .55; }

/* 充入电量：标题行右侧是「同步时间小字 + 月份按钮」。
   同步没有按钮 —— 时机全自动（空库 / 跨天 / 充电结束），细节见 state.chargeSyncAt。 */
.ch-actions { display: inline-flex; align-items: center; gap: 7px; }
/* 同步时间小字（原来这里是「同步」按钮）。
   去掉按钮后它是唯一的新鲜度线索，所以放得比按钮低调、但必须看得见。 */
.ch-sync-at {
  font-size: 11px; color: var(--text-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* ── iOS 风格底部弹层（月份选择）──
   参照 iOS ActionSheet：遮罩 + 圆角面板 + 居中列表 + 独立「取消」 */
.sheet-root {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, .28);
  opacity: 0; transition: opacity .18s ease;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.sheet-root.hidden { display: none; }
.sheet-root.show { opacity: 1; }
.sheet {
  width: 100%; max-width: 460px;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  padding: 4px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  transform: translateY(14px); transition: transform .18s ease;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, .18);
}
.sheet-root.show .sheet { transform: translateY(0); }
@media (min-width: 520px) {
  .sheet-root { align-items: center; }
  .sheet { border-radius: 18px; max-width: 360px; padding-bottom: 10px; }
}
.sheet-title {
  font-size: 12px; color: var(--text-3); text-align: center; padding: 12px 0 6px;
}
.sheet-sec { font-size: 11px; color: var(--text-3); padding: 8px 6px 6px; }
/* 左右两栏，各自可上下滚动（左选年、右选月），滚动带吸附 */
.sheet-cols { display: grid; grid-template-columns: 92px 1fr; gap: 10px; }
.sheet-col { min-width: 0; display: flex; flex-direction: column; }
.sheet-years,
.sheet-months {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 236px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  scroll-snap-type: y proximity;
  /* 上下淡出，暗示可以滚 */
  mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
  padding: 2px;
}
.sheet-years::-webkit-scrollbar,
.sheet-months::-webkit-scrollbar { width: 0; }
.sheet-year,
.sheet-mon {
  flex: 0 0 auto; width: 100%; min-height: 40px;
  border: none; border-radius: 10px; cursor: pointer;
  background: var(--glass-inner-2); color: var(--text-1);
  font-family: inherit; font-size: 15px;
  scroll-snap-align: center;
}
.sheet-year.on,
.sheet-mon.on { background: var(--accent); color: #fff; font-weight: 600; }
.sheet-mon.on { background: var(--accent); color: #fff; font-weight: 600; }
.sheet-mon[disabled] { opacity: .3; cursor: not-allowed; }
.sheet-cancel {
  width: 100%; min-height: 48px; margin-top: 8px;
  border: none; border-radius: 12px; cursor: pointer;
  background: var(--glass-inner-2); color: var(--text-1);
  font-family: inherit; font-size: 15px; font-weight: 600;
}
/* 未连后端时的「演示数据」标记：数字是编的，不能让人当成自己的车 */
.en-demo {
  font-style: normal; margin-left: 6px; padding: 1px 6px; border-radius: 6px;
  background: var(--glass-inner-2); color: var(--text-3); font-size: 10px;
}

/* ── 金额补录弹层（截图识别核对 / 手工录入 / 待确认配对）──
   复用 .sheet-root 的遮罩与出场动画，但内容比月份选择高得多（输入框 + 候选列表），
   所以中间那块必须自己滚 —— 不滚的话超过 5 条就顶破屏幕，底部按钮点不到。 */
/* 设计稿 18:167：主标题 + 「已识别 N 张 · 时刻」副标题 + 置信度胶囊 */
.ocr-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 2px 8px; }
.ocr-title { font-size: 16px; font-weight: 600; color: var(--text-1); line-height: 22px; }
.ocr-sub { font-size: 12px; color: var(--text-3); line-height: 18px; white-space: nowrap; }
/* 设计稿 18:167：值是「78.84 元」「58.4 kWh」——单位跟在输入框右侧，不占 label */
.ocr-wrap { position: relative; }
.ocr-unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--text-3); pointer-events: none; }
.ocr-wrap .ocr-input { padding-right: 34px; }
.ocr-conf { font-size: 11px; font-weight: 500; color: #08789F; background: #E9F6FD; border-radius: 999px; padding: 2px 7px; white-space: nowrap; line-height: 14px; }
.ocr-body {
  max-height: min(58vh, 430px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px 2px 2px;
}
.ocr-row {
  border: 1px solid var(--separator); border-radius: 16px;
  padding: 10px; margin-bottom: 10px; background: var(--glass-inner-2);
}
.ocr-row-top {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; color: var(--text-2); margin-bottom: 7px; gap: 8px;
}
.ocr-row-top b { color: var(--text-1); font-size: 13px; }
/* 「需核对」是**黄**不是红：模型读错很常见，但还没到"失败"的程度，
   用红色会让人以为这条不能要了。 */
.ocr-warn {
  font-size: 11.5px; line-height: 1.45; margin-bottom: 8px; padding: 6px 8px;
  border-radius: 8px; background: rgba(242, 153, 74, .16); color: #A8791A;
}
.ocr-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ocr-field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ocr-field label { font-size: 10.5px; color: var(--text-3); padding-left: 2px; }
.ocr-field.wide { grid-column: 1 / -1; }
.ocr-input {
  height: 38px; width: 100%; min-width: 0;
  border: 0; border-radius: 10px;
  background: rgba(27, 34, 51, .04); color: var(--text-1);
  font-family: inherit; font-size: 14px; padding: 0 9px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9);
}
/* 无边框之后靠聚焦环告诉用户"这里能改" */
.ocr-input:focus { outline: 2px solid rgba(103, 66, 232, .35); outline-offset: 0; }
.ocr-sec { font-size: 11px; color: var(--text-3); margin: 10px 0 6px; }
.ocr-sec { margin: 10px 0 2px; font-size: 11px; line-height: 16px; font-weight: 500; color: #666F7E; }
.ocr-nocand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0 4px; text-align: center; }
.ocr-nocand .t { font-size: 14px; line-height: 20px; font-weight: 600; color: #1B2233; }
.ocr-nocand .d { font-size: 12px; line-height: 18px; color: #666F7E; }
.ocr-nocand .btns { display: flex; gap: 8px; margin-top: 6px; }
.ocr-act { height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #EEF0FE;
  color: #6742E8; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.ocr-cands { display: flex; flex-direction: column; gap: 6px; }
.ocr-cand {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  text-align: left; min-height: 38px; padding: 6px 9px; cursor: pointer;
  border: 1px solid var(--separator); border-radius: 9px;
  background: var(--surface); color: var(--text-1);
  font-family: inherit; font-size: 12.5px;
}
/* 设计稿里候选是一列无边框文字行，只有选中项铺紫底 —— 去掉边框和底色 */
.ocr-cand[data-cand] {
  border: 0; background: transparent; padding-left: 9px; padding-right: 9px;
}
.ocr-cand[data-cand].on { background: var(--accent); }
/* 候选行右侧：未选中写「差 N 天」，选中项是对勾 */
.ocr-cand .c-side { font-size: 11.5px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
.ocr-cand.on .c-side { color: #fff; }
/* 「已补录」：候选行对勾左侧的绿胶囊，纯文字标记，不改点击行为 */
.ocr-cand .c-dup { margin-right: 6px; padding: 1px 6px; border-radius: 999px;
  font-size: 10.5px; font-weight: 500; color: #0F7F58; background: #EAF7F1; }
.ocr-cand.on .c-dup { color: #0F7F58; background: rgba(255,255,255,.92); }
.ocr-cand.on {
  border-color: var(--accent); color: #fff; font-weight: 600;
  background: var(--accent);
}
.ocr-cand.on .c-main { font-weight: 600; }
.ocr-actions { display: flex; gap: 8px; }
.ocr-actions .sheet-cancel { flex: 1; margin-top: 8px; }
.ocr-primary {
  flex: 1; min-height: 48px; margin-top: 8px; border: none; border-radius: 12px;
  cursor: pointer; background: var(--accent); color: #fff;
  font-family: inherit; font-size: 15px; font-weight: 600;
}
.ocr-primary[disabled] { opacity: .5; cursor: default; }
@media (prefers-color-scheme: dark) {
  .ocr-warn { background: rgba(242, 153, 74, .18); color: #F0B95E; }
}

/* ── 费用卡：已补录的三件套 + 三个补录入口 ── */
.cost-sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 2px; }
.cost-sub .v { font-size: 17px; font-weight: 650; color: var(--text-1); }
.cost-sub .v small { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 2px; }
.cost-sub .k { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.cost-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.cost-btn {
  flex: 1 1 96px; min-height: 42px; padding: 0 10px; cursor: pointer;
  border: 1px solid var(--separator); border-radius: 11px;
  background: var(--glass-inner-2); color: var(--text-1);
  font-family: inherit; font-size: 13px; font-weight: 600;
}
.cost-btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.cost-btn[disabled] { opacity: .45; cursor: default; }
/* 落在渐变大卡上时换成半透明白底：那里正文是白字，
   沿用中性底 + 灰字会直接看不见（行程页的徽标在浅色行里，不受影响）。 */
.summary-hero .en-demo { background: rgba(255,255,255,.22); color: #fff; }
canvas { display: block; width: 100%; }

/* ─────────── 行程 / 消费列表 ─────────── */
.list { display: flex; flex-direction: column; gap: var(--gap); }
.item {
  background: var(--glass-bg); border-radius: var(--card-radius);
  padding: 13px 14px;
}
.item-top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.item-time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.item-amt {
  font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.item-main { font-size: 14px; font-weight: 500; margin-top: 6px; }
.item-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.item-tags { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.tag {
  font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
  background: var(--glass-inner-2); color: var(--text-2);
}
.tag.p { background: rgba(28,111,168,.14); color: var(--tian-qing-deep); font-weight: 600; }
@media (prefers-color-scheme: dark) {
  .tag.p { background: rgba(77,163,220,.20); color: var(--tian-qing); }
}
.tag.a { background: rgba(23,124,176,.14); color: var(--dian-qing); }
.tag.w { background: rgba(240,194,57,.20); color: #A8791A; }

/* ─────────── 汇总大卡 ─────────── */
.summary-hero {
  /* 清爽天蓝渐变：天青·深 → 天青 → 靛青，统一蓝色系，干净通透 */
  background: linear-gradient(135deg, var(--tian-qing-deep) 0%, var(--tian-qing) 52%, var(--dian-qing) 100%);
  border-radius: var(--card-radius); padding: 18px var(--card-padding);
  color: #fff;
  box-shadow: 0 6px 20px -10px rgba(28,111,168,.45);
}
.summary-hero .lbl { font-size: 11.5px; opacity: .82; }
.summary-hero .big {
  font-size: 33px; font-weight: 600; letter-spacing: -1px;
  margin-top: 4px; font-variant-numeric: tabular-nums;
}
.summary-hero .big .u { font-size: 15px; font-weight: 400; opacity: .85; margin-left: 3px; }
.summary-sub {
  display: flex; gap: 24px; margin-top: 14px;
  padding-top: 13px; border-top: 1px solid rgba(255,255,255,.20);
}
.summary-sub .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.summary-sub .v small { font-size: 10px; font-weight: 400; opacity: .8; margin-left: 2px; }
.summary-sub .k { font-size: 10.5px; opacity: .78; margin-top: 2px; }

/* ─────────── 空态 / 占位 ─────────── */
.empty {
  text-align: center; padding: 46px 24px; color: var(--text-3); font-size: 13px;
}
.empty .ico { font-size: 40px; opacity: .35; margin-bottom: 12px; }

/* ─────────── 账号登录 ───────────
   预览页在「地址指向本机」时默认走内置模拟数据、不发请求（便于没后端时也能看设计）；
   但登录必须真的落到服务端 —— 会话存在后端，debug 页也要用它。
   所以登录相关请求走 apiNoMock()，不受那条默认策略影响。 */
.auth-row { display: flex; gap: 8px; }
.auth-row + .auth-row { margin-top: 9px; }
.auth-input {
  flex: 1; min-width: 0;
  font: inherit; font-size: 13.5px;
  padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--separator);
  background: var(--glass-inner);
  color: var(--text-1);
  -webkit-appearance: none;
}
.auth-input::placeholder { color: var(--text-3); }
.auth-input:focus {
  outline: none;
  border-color: var(--qing-bi);

/* ─────────── 提示条 ───────────
   毛玻璃半透明胶囊 + 深色文字，与 .glass / tabbar 同一套材质语言。
   位置紧贴底部导航胶囊上方：车控面板是车况页最后一张卡片，
   若提示条浮在屏幕中部偏下，滚到底部时会与之重叠而被挡住。 */
.toast {
  position: fixed; left: 50%;
  /* tabbar 上沿 = safe-area + padding 14px + 胶囊 59px = safe-area + 73px，
     此处再留 8px 间隙 = safe-area + 81px。
     取 52 与 iOS 侧的 toastBottomInset 语义对齐 —— iOS 的 52 是相对安全区上沿计的，
     换算到屏幕底即 52 + 34 = 86 ≈ 81（差额来自两边胶囊高度 64pt / 59px）。 */
  bottom: calc(env(safe-area-inset-bottom) + 52px);
  transform: translateX(-50%) translateY(12px);
  background: var(--glass-bg);
  /* 与 tabbar / 卡片共用同一档模糊，同屏并置时质感才一致 */
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border: 1px solid var(--glass-stroke-weak);
  color: var(--text-1); font-size: 12.5px;
  padding: 10px 18px; border-radius: 22px; z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
  max-width: 82vw; text-align: center;
  box-shadow: 0 8px 28px -10px var(--glass-shadow), inset 0 1px 0 0 var(--glass-highlight);
}
/* 底色本身已半透明，不再叠加 opacity —— 再叠一层会让模糊打折、文字发灰 */
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 不支持 backdrop-filter 时降级为不透明底，保证可读性 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .toast { background: var(--surface); }
}

.hidden { display: none !important; }

    0 16px 38px 0 rgba(74, 87, 120, .24);            /* 外阴影 B */
  overflow: visible;
}
.tab {
  flex: 0 0 62px;
  height: 54px;
  min-height: 54px;
  padding: 6px 4px;
  gap: 4px;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: #5E6775;
  letter-spacing: 0;
}
.tab svg, .tab .ti { width: 24px; height: 24px; display: block; }
.tab.on { color: #6742E8; font-weight: 500; transform: none; }
.tab.on svg, .tab.on .ti { transform: none; }
/* 规格明确不做：选中胶囊 / 底色 / 放大动画 */
.tab.on::before { display: none; content: none; }
.tab:active .ti { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) {

}

/* ═══ §7 车况屏（数值取自 MCP batch_read 的 2:4 节点树） ═══ */

.v2-screen { position: relative; display: flex; flex-direction: column; gap: 16px; padding: 8px 0 24px; }
/* 车况屏例外：Content 2:11 gap=12 pad 8/16/16/16（设计稿唯一 gap12 的屏） */
.v2-screen.v2-dash { gap: 12px; padding-bottom: 16px; }

/* SOC 卡：环 100 + gap 20 */
.v2-soc { display: flex; align-items: center; gap: 20px; }

.v2-soc-col { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.v2-plate { align-self: flex-start; padding: 5px 9px; border-radius: 7px; background: rgba(103,66,232,.12); color: #6742E8; font-size: 11px; font-weight: 600; line-height: 14px; }
.v2-kv { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #1B2233; line-height: 22px; }
.v2-kv .u { font-size: 11px; font-weight: 500; color: #5E6775; }
.v2-kv.sub { font-size: 14px; font-weight: 400; color: #5E6775; line-height: 20px; }
/* 充电中卡：gap 8 */

.v2-charge-title { font-size: 14px; font-weight: 600; color: #08789F; line-height: 20px; }

.v2-charge-col { display: flex; align-items: center; gap: 3px; }
.v2-charge-col b { font-size: 16px; font-weight: 600; color: #1B2233; line-height: 22px; }
.v2-charge-col .u { font-size: 11px; font-weight: 500; color: #5E6775; }
.v2-eta { font-size: 12px; color: #5E6775; line-height: 18px; }
/* 指标卡：两行 gap 8，行内 gap 12，格内 label(11) + val(16/11) gap 2 */
.v2-metric-rows { display: flex; flex-direction: column; gap: 8px; }
.v2-metric-row { display: flex; gap: 12px; }
.v2-metric { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.v2-metric .v .u { font-size: 11px; font-weight: 500; color: #666F7E; }
/* 胎压：标题行 gap 4；4 列 gap 8，每列 label(11) + num(16) */
.v2-tyre { display: flex; flex-direction: column; gap: 8px; }
.v2-tyre-head { display: flex; align-items: center; gap: 4px; }
.v2-tyre-head .t { font-size: 14px; font-weight: 600; color: #1B2233; line-height: 20px; }
.v2-tyre-head .u { font-size: 11px; font-weight: 500; color: #666F7E; line-height: 14px; }
.v2-tyre-grid { display: flex; gap: 8px; }
.v2-tyre-col { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.v2-tyre-col .v { font-size: 16px; font-weight: 600; color: #1B2233; line-height: 22px; font-variant-numeric: tabular-nums; }

/* 车身状态：标题 + 两行 gap 9，三列等宽 108.66，行内 gap 0 */
.v2-status { display: flex; flex-direction: column; gap: 8px; }
.v2-status-head { font-size: 14px; font-weight: 600; color: #1B2233; line-height: 20px; }

.v2-status-row { display: flex; align-items: center; }
.v2-status-item { flex: 0 0 33.3333%; display: flex; align-items: center; font-size: 12px; font-weight: 500; line-height: 15px; color: #5E6775; white-space: nowrap; }

.v2-status-item .vl { color: #5E6775; }

.v2-status-item.bad  .vl { color: #C0392B; }
/* 位置卡：标题行 gap 8 */
.v2-loc { display: flex; flex-direction: column; gap: 8px; }
.v2-loc-head { display: flex; align-items: center; gap: 8px; }
.v2-loc-head .t { font-size: 14px; font-weight: 600; color: #1B2233; line-height: 20px; }
.v2-loc-head .time { font-size: 11px; font-weight: 500; color: #666F7E; line-height: 14px; }

.v2-loc-map { width: 100%; border-radius: 16px; margin-top: 8px; display: block; }

/* ═══ §4 行程图表 + §2 状态层组件（数值取自 MCP batch_read） ═══ */
/* 底内距 = 底栏实际高 95（12+62+21）+ iOS 安全区；内容滚到底时正好贴上底栏上沿，不留空 */
.wrap { padding: 56px 16px calc(95px + env(safe-area-inset-bottom)); }

/* 页面左上角不再放大标题：与底部导航选中项重复，纵向也白占一行。

.v2-head { position: absolute; top: -36px; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
/* 1877 行的 .v2-head 会覆盖单类选择器，这里用复合选择器保证右对齐 */

.v2-updated { align-self: center; font-size: 11px; font-weight: 500; color: #666F7E; line-height: 16px; }
.v2-title { margin: 0; font-size: 28px; font-weight: 700; color: #1B2233; line-height: 34px; letter-spacing: -.4px; }

}
.v2-month-chip {

  background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.90);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.70);
  font-size: 13px; font-weight: 600; color: #6742E8; line-height: 16px;
  font-family: inherit; cursor: pointer;
}
.v2-month-row { display: flex; justify-content: flex-end; }

/* 汇总卡：两行 × 两列，gap 14 / 行内 12 / 格内 4 */
.v2-sum-grid { display: flex; flex-direction: column; gap: 14px; }
.v2-sum-row { display: flex; gap: 12px; }
.v2-sum-cell { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.v2-sum-cell .k { font-size: 11px; font-weight: 500; color: #5E6775; line-height: 14px; }
.v2-sum-cell .v { display: flex; align-items: baseline; gap: 3px; font-size: 16px; font-weight: 600; color: #1B2233; line-height: 22px; }
.v2-sum-cell .u { font-size: 11px; font-weight: 500; color: #5E6775; }

/* 分段行 */
.v2-dist { display: flex; align-items: center; justify-content: space-between; height: 30px; }

.v2-seg {
  display: flex; width: 108px; height: 30px; padding: 3px; border-radius: 15px;
  background: rgba(255,255,255,.40); border: 1px solid rgba(255,255,255,.90);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.60);
}
.v2-seg button {
  flex: 1; border: 0; background: transparent; border-radius: 12px; padding: 0;
  font-family: inherit; font-size: 12px; font-weight: 500; color: #666F7E; cursor: pointer;
}
.v2-seg button.on { background: rgba(255,255,255,.95); color: #1B2233; font-weight: 600; box-shadow: 0 2px 6px rgba(74,87,120,.16); }

/* 图表卡 */
.v2-chart-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 20px;
  background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.90);
  backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.60), 0 8px 24px rgba(74,87,120,.12); }
.v2-chart-title { font-size: 14px; font-weight: 600; color: #1B2233; line-height: 20px; }

.v2-leg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: 0 0 8px; }

.v2-bars { display: flex; align-items: flex-end; gap: 30px; height: 132px; }

.v2-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; text-align: center; }

.v2-skel i:nth-child(1) { width: 70%; } .v2-skel i:nth-child(2) { width: 35%; } .v2-skel i:nth-child(3) { width: 55%; }

/* ═══ P3 充电屏（规格 §5 / MCP 3:1 实测） ═══ */
.v2-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  font-size: 34px; line-height: 38px; font-weight: 700; color: #1B2233; }
.v2-cc-hero .v2-u { font-size: 14px; line-height: 20px; font-weight: 500; color: #5E6775; }

.v2-cc-stats .b { color: #1B2233; }

.v2-rec-top .t { font-size: 12px; line-height: 18px; font-weight: 500; color: #666F7E; }
.v2-rec-top .e { font-size: 15px; line-height: 22px; font-weight: 600; color: #1B2233; }
.v2-rec-top .e .u { margin-left: 2px; font-size: 11px; font-weight: 500; color: #666F7E; }
.v2-rec-bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.v2-rec-bot .s { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 18px; font-weight: 500; color: #1B2233; }

.v2-chip { padding: 4px 7px; border-radius: 999px; background: #FEF3E2;
  font-size: 11px; line-height: 16px; font-weight: 500; color: #8A5A12; white-space: nowrap; }
.v2-cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.v2-card-t { font-size: 14px; line-height: 20px; font-weight: 600; color: #1B2233; }
.v2-chip-a { padding: 4px 8px; border-radius: 999px; background: rgba(103,66,232,.12);
  font-size: 11px; line-height: 16px; font-weight: 600; color: #6742E8; white-space: nowrap; }
.v2-cost-note { font-size: 11px; line-height: 17px; font-weight: 500; color: #666F7E; }
.v2-cost-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.v2-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; cursor: pointer;

  font-size: 11px; line-height: 16px; font-weight: 500; color: #5E6775; white-space: nowrap; }
/* §2 S5 stale 提示条：它是提示不是玻璃卡（无 blur、无阴影） */
.v2-stale { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px;
  background: #FFF1F4; box-shadow: inset 0 0 0 1px rgba(240,106,128,.35); }

.v2-spin { display: inline-block; width: 16px; height: 16px; margin-right: 5px; vertical-align: -3px;
  border-radius: 50%; border: 2px solid rgba(103,66,232,.22); border-top-color: #6742E8;
  animation: ctrlSpin 1s linear infinite; }
.v2-cost-err { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: #FFF1F4;
  box-shadow: inset 0 0 0 1px rgba(240,106,128,.35);
  font-size: 12px; line-height: 18px; font-weight: 500; color: #B23350; }
.v2-wall { padding: 36px 20px; text-align: center; }
.v2-wall-ico { display: inline-flex; }
.v2-wall-ico svg { width: 32px; height: 32px; color: rgba(103,66,232,.30); }
.v2-wall-t { margin-top: 12px; font-size: 16px; line-height: 22px; font-weight: 600; color: #1B2233; }
.v2-wall-d { margin-top: 7px; font-size: 12.5px; line-height: 18px; color: #666F7E; }
.v2-wall-btn { width: 100%; height: 44px; margin-top: 18px; border: 0; border-radius: 999px;
  background: #6742E8; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }

/* ═══ P3 附近充电站（收起态按设计 §6，展开态保留原有筛选/排序/分页） ═══ */
.v2-link { border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit;
  font-size: 12px; line-height: 18px; font-weight: 600; color: #6742E8; }
.v2-st { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
  border-radius: 14px; background: rgba(255,255,255,.28); }
.v2-st-h { display: flex; align-items: center; gap: 8px; }
.v2-st-h .n { font-size: 13px; line-height: 19px; font-weight: 600; color: #1B2233; }
.v2-st .badge { padding: 3px 6px; border-radius: 999px; background: #FEF3E2;
  font-size: 10px; line-height: 14px; font-weight: 500; color: #8A5A12; white-space: nowrap; }
.v2-st-m { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.v2-st-m .m { font-size: 12px; line-height: 18px; font-weight: 500; color: #666F7E; }
.v2-st-m .r { display: flex; align-items: center; gap: 10px; }
.v2-st-m .p { font-size: 12px; line-height: 18px; font-weight: 600; color: #08789F; }
.v2-st-m .p .u { margin-left: 1px; font-size: 11px; font-weight: 500; color: #666F7E; }
.v2-btn.sm { padding: 4px 10px; font-size: 11px; line-height: 16px; }
.v2-st-line { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 2px 0; }
/* 站名可以换行，距离与价格不能：长站名把「0.42 km」挤成两行比截断更难看 */
.v2-st-line .n { flex: 1 1 auto; min-width: 0; font-size: 12px; line-height: 18px; font-weight: 500; color: #1B2233; }
.v2-st-line .n em { margin-left: 6px; font-style: normal; font-size: 11px;
  font-weight: 500; color: #666F7E; }
.v2-st-line .r { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; white-space: nowrap; }
.v2-st-line .d { font-size: 11px; line-height: 16px; font-weight: 500; color: #666F7E; white-space: nowrap; }
.v2-st-line .p { font-size: 12px; line-height: 18px; font-weight: 600; color: #08789F; }
/* 收起态三行各是一类推荐位（最近自营 / 最便宜快充 / 空闲最多），
   标签必须留在行内：不然用户看不出这三行为什么偏偏是这三站。 */
.v2-st-pick { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 999px;
  font-size: 10px; line-height: 14px; font-weight: 600; font-style: normal;
  color: #6742E8; background: #EEF0FE; vertical-align: 1px; }
/* 三行都可点：点谁谁变高亮行，其余退成简行 */
.v2-st, .v2-st-line { cursor: pointer; }
.v2-st-line:hover { background: rgba(103,66,232,.05); border-radius: 8px; }

/* ═══ P4 车控屏（MCP 3:26 实测：112×90 主按钮 / 65×90 禁用） ═══ */
.v2-head-l { display: flex; align-items: center; gap: 12px; }
.v2-badge-ok { padding: 6px 12px; border-radius: 999px; background: #EAF7F1;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.90);
  font-size: 13px; line-height: 18px; font-weight: 600; color: #0F7F58; }
.v2-badge-off { padding: 6px 12px; border-radius: 999px; background: #EEF0F8;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.90);
  font-size: 13px; line-height: 18px; font-weight: 600; color: #5E6775; }
.v2-ctrl-grid .v2-ctrl--wide { grid-column: span 2; }
.v2-ctrl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.v2-ctrl-grid--off { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.v2-ctrl { position: relative; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 8px; width: 100%; height: 90px; padding: 15px 8px;
  border: 0; border-radius: 16px; background: rgba(255,255,255,.50);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.90),
              inset 0 1px 2px rgba(255,255,255,.70),
              0 4px 16px rgba(74,87,120,.10);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.v2-ctrl:active { transform: scale(.97); }
.v2-ctrl .v2-ci { width: 28px; height: 28px; display: block; }
.v2-ctrl .v2-ctrl-t { font-size: 12px; line-height: 18px; font-weight: 500; color: #1B2233;
  white-space: nowrap; }
.v2-ctrl.on { background: rgba(103,66,232,.10); }
.v2-ctrl.off { background: rgba(255,255,255,.32);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.50), 0 4px 16px rgba(74,87,120,.10);
  cursor: default; }
.v2-ctrl.off .v2-ctrl-t { color: #6B7484; }
.v2-ctrl[disabled] { opacity: 1; }
.v2-ctrl[disabled] .v2-ci { opacity: .55; }
.v2-ctrl { position: relative; }
/* §2 S7 三态：pending = 20×20 紫圈 1s/圈；done = 1.5px #0F7F58 外框 + check；fail = 1.5px #C0392B 外框 */
.v2-ctrl .ctrl-spin { position: absolute; left: 0; right: 0; top: 15px; height: 28px;
  display: none; align-items: center; justify-content: center;
  background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.v2-ctrl.busy .ctrl-spin, .v2-ctrl.pending .ctrl-spin { display: flex; }
.v2-ctrl .ctrl-spin::after { content: ''; width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid rgba(103,66,232,.22); border-top-color: #6742E8;
  animation: ctrlSpin 1s linear infinite; }
.v2-ctrl.busy .v2-ci, .v2-ctrl.pending .v2-ci { opacity: 0; }
.v2-ctrl.done { animation: none; box-shadow: inset 0 0 0 1.5px #0F7F58, 0 4px 16px rgba(74,87,120,.10); }
.v2-ctrl.fail { animation: none; box-shadow: inset 0 0 0 1.5px #C0392B, 0 4px 16px rgba(74,87,120,.10); }
.v2-ctrl .v2-ck { display: none; width: 20px; height: 20px; color: #0F7F58; }
.v2-ctrl.done .v2-ci { display: none; }
.v2-ctrl.done .v2-ck { display: block; }
.v2-ctrl.fail .v2-ci { color: #C0392B; }
.v2-tlabel { font-size: 11px; line-height: 14px; font-weight: 500; color: #666F7E; }
.v2-note { font-size: 12.5px; line-height: 18px; font-weight: 400; color: #666F7E; }
.v2-note.warn { color: #8A5A12; }
/* 位置卡（§7.2–7.4）：地图 → 地址主行 13.5 → 补充地址 11 → 末行提示 11 */
.v2-loc { display: flex; flex-direction: column; gap: 8px; }
.v2-loc-head { display: flex; align-items: center; gap: 8px; }
.v2-loc-head .t { font-size: 14px; font-weight: 600; color: #1B2233; line-height: 1.3; }
.v2-loc-head .time { margin-left: auto; font-size: 11px; font-weight: 500; color: #666F7E; }
.v2-loc-map { display: block; width: 100%; height: 88px; border-radius: 10px; object-fit: cover; background: #EAF1F8; }
.v2-loc-addr { font-size: 13px; font-weight: 400; color: #5E6775; line-height: 1.45; }   /* 设计稿 2:59：13px Regular #5E6775 */
.v2-loc-addr.dim { color: #666F7E; }
.v2-loc-sub { font-size: 11px; font-weight: 400; color: #666F7E; line-height: 1.45; }
.v2-loc-tip { font-size: 11px; font-weight: 400; color: #666F7E; line-height: 1.45; }

/* ── 确认卡（离开 App 的动作先问一次，结构照 iOS alert）── */
.v2-alert-mask { position: fixed; inset: 0; z-index: 198; background: rgba(15,23,41,.38);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.v2-alert { width: min(300px, calc(100vw - 48px)); text-align: center;
  background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,.95); border-radius: 20px; padding: 20px 18px 14px;
  box-shadow: 0 12px 40px rgba(74,87,120,.30); }
.v2-alert .t { font-size: 16px; font-weight: 600; color: #1B2233; line-height: 1.35; }
.v2-alert .m { margin-top: 8px; font-size: 12.5px; font-weight: 400; color: #5E6775; line-height: 1.5; }
.v2-alert .acts { display: flex; gap: 8px; margin-top: 16px; }
.v2-alert .acts .v2-btn { flex: 1 1 0; height: 40px; justify-content: center; border-radius: 12px; font-size: 13px; font-weight: 600; }

/* ── 充电站 Sheet（§6）：覆盖层 + 白 88% 玻璃 + 42 高行 + 分时电价详情 ── */
.v2-mask { position: fixed; inset: 0; z-index: 60; background: rgba(15,23,41,.38); display: flex; flex-direction: column; justify-content: flex-end; }
.v2-sheet { background: rgba(255,255,255,.88); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,.95); border-bottom: 0; border-radius: 24px 24px 0 0;
  box-shadow: 0 -6px 28px rgba(74,87,120,.22); padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 6px;
  /* 规格 §6.1：高度 hug_contents（12 行 694 / 9 行 555），超长才封顶滚动 */
  height: auto; max-height: min(694px, calc(100dvh - 24px)); overflow: hidden; }
.v2-grip { display: flex; justify-content: center; padding: 0 0 2px; }
.v2-grip i { width: 36px; height: 4px; border-radius: 2px; background: #C9D1DB; }
.v2-sh { display: flex; align-items: center; justify-content: space-between; }
.v2-sh .t { font-size: 17px; font-weight: 600; color: #1B2233; line-height: 1.3; }
.v2-sh .r { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; color: #666F7E; }
.v2-sh .r button { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; font-weight: 600; color: #6742E8; cursor: pointer; }
.v2-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.v2-row2 .m { font-size: 11px; font-weight: 500; color: #6B7484; }
.v2-sheet-f { display: flex; align-items: center; gap: 6px; }
.v2-sheet-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.v2-sheet-foot { font-size: 10px; font-weight: 500; color: #6B7484; line-height: 1.4; }
.v2-sheet .seg.v2-seg { display: flex; align-items: center; gap: 0; width: 108px; height: 30px; padding: 3px; border-radius: 15px;
  background: rgba(255,255,255,.40); border: 1px solid rgba(255,255,255,.90); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 2px rgba(255,255,255,.60); }
.v2-sheet .seg.v2-seg button { flex: 1 1 51px; height: 24px; border: 0; border-radius: 12px; background: none;
  font-size: 12px; font-weight: 500; color: #666F7E; cursor: pointer; }
.v2-sheet .seg.v2-seg button.on { background: rgba(255,255,255,.95); font-weight: 600; color: #1B2233;
  box-shadow: 0 2px 6px rgba(74,87,120,.16); }
.v2-sheet .st-chip { height: 28px; padding: 0 8px; border-radius: 999px; border: 1px solid #E7EBF3; background: #fff;
  font-size: 12px; font-weight: 500; color: #5E6775; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.v2-sheet .st-chip.on { background: rgba(103,66,232,.12); border-color: rgba(103,66,232,.24); color: #6742E8; font-weight: 600; }
.v2-sheet .st-chip.reset { border: 0; background: none; color: #6742E8; padding: 0 4px; }
.v2-sheet .st-filter { display: flex; align-items: center; gap: 6px; margin: 0; }
.v2-sheet-list .st { padding: 4px 0; min-height: 42px; border-bottom: 1px solid #E7EBF3; }
.v2-sheet-list .st:last-child { border-bottom: 0; }
.v2-sheet-list .st-head { display: flex; align-items: flex-start; gap: 8px; }
.v2-sheet-list .st-name { font-size: 13px; font-weight: 600; color: #1B2233; line-height: 1.35; }
.v2-sheet-list .st-price { margin-left: auto; font-size: 13px; font-weight: 600; color: #08789F; line-height: 1.35; white-space: nowrap; }
.v2-sheet-list .st-price:not(.na)::before { content: '¥'; }
.v2-sheet-list .st-price .u { font-size: 11px; font-weight: 500; }
.v2-sheet-list .st-price.na { color: #6B7484; }
.v2-sheet-list .st-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  font-size: 11px; font-weight: 500; color: #666F7E; line-height: 1.5; }
.v2-sheet-list .st-meta .gone { color: #6B7484; }
.v2-sheet-list .st-tag { padding: 1px 6px; border-radius: 999px; background: #FEF3E2; color: #8A5A12; font-size: 10px; font-weight: 500; }
.v2-sheet-list .st-periods { margin: 6px 0 2px 8px; display: flex; flex-direction: column; gap: 6px; }
.v2-sheet-list .st-period { display: flex; align-items: center; justify-content: space-between; height: 22px;
  font-size: 11px; font-weight: 500; color: #666F7E; }
.v2-sheet-list .st-period span:last-child { color: #1B2233; }
.v2-sheet-list .st-period.now { height: 24px; padding: 0 6px; border-radius: 8px; background: #E9F6FD;
  font-weight: 600; color: #08789F; }
.v2-sheet-list .st-period.now span:last-child { color: #08789F; }
.v2-sheet-list .st-note { margin: 4px 0 2px 8px; font-size: 11px; font-weight: 500; color: #6B7484; line-height: 1.5; }
.v2-sheet-list .st-info { margin: 2px 0 0 8px; display: flex; flex-direction: column; gap: 2px; }
.v2-sheet-list .st-info-l { font-size: 11px; font-weight: 500; color: #666F7E; line-height: 1.45; }
.v2-sheet-list .st-actions { margin: 6px 0 4px 8px; }
.v2-sheet-list .st-btn { width: 100%; height: 44px; border: 0; border-radius: 12px; background: #6742E8;
  font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; }

.v2-sheet-list .st { padding: 2px 0; }
.v2-sheet-list .st-head { line-height: 1.3; }
.v2-sheet-list .st-meta { line-height: 1.4; }
.v2-sheet-list .st-tag.t { display: none; }

</style>

<script>
'use strict';

/* ═══════════════════════════════════════════════
   配置
   ═══════════════════════════════════════════════ */

/* 服务端地址来源：
   ① URL 上显式指定 ?api=xxx 时优先使用（方便在不改代码的情况下切换后端）
   ② 页面由自有服务端托管（非 5500 预览端口）时用同源地址
   ③ 其余情况（本地 5500 预览、file:// 打开）回退到 localhost —— 即模拟数据 */
const QUERY_API = new URLSearchParams(location.search).get('api');
/* 服务端设了 API_TOKEN 时，用 ?token=xxx 打开本页即可免改代码带令牌。
   服务端同时接受 Authorization 头与 ?token= 查询参数（见 main.py 中间件）。 */
const QUERY_TOKEN = new URLSearchParams(location.search).get('token') || '';
/* ── 调试台的地址来源（与 index.html 的关键差异）──
   index.html 把「地址指向本机回环」判定为"不联网、直接用内置模拟数据"；
   而调试台存在的意义恰恰是连本机后端，故**不沿用**该规则：
   只要给了地址就发真实请求，连不上就如实报错。

   优先级：URL ?api= > localStorage（调试台里手填过）> 自动推断 */
const DBG_LS_API = 'zeekrdash.debug.api';
const DBG_LS_TOKEN = 'zeekrdash.debug.token';

function defaultApiSource() {
  if (QUERY_API) return QUERY_API.trim();
  // 用户上次在「连接」区填过的地址优先 —— 换过一次就记住
  const saved = localStorage.getItem(DBG_LS_API);
  if (saved) return saved;
  /*
    默认就是本机后端。
    刻意**不**做"同源推断"：调试页可能被 file:// 打开、也可能由静态预览
    服务器托管（如内置预览的 64686 端口），那些 origin 都不是 API 地址，
    推错了会让人以为是后端没起。宁可给一个确定的默认值，
    远程后端用「连接」区的一键预设切换。
  */
  return 'http://127.0.0.1:8765';
}

/* 用 let：调试台要支持运行时切换后端地址 */
let API_SOURCE = defaultApiSource();
let API_TOKEN = QUERY_TOKEN || localStorage.getItem(DBG_LS_TOKEN) || '';

/* 判定地址形态 —— 必须与 iOS 端 EndpointResolver 给出完全一致的结论：
   地址为空或指向本机回环地址 → 使用内置模拟数据，不请求后端；
   配置了真实地址 → 先请求后端，失败才回落模拟数据并弹框提示。

   两处容易与 Swift 走岔的边界，这里显式对齐（均为实测结论）：
   · `http://[::1]:8080` —— Swift 的 URLComponents.host 会**保留**方括号
     （返回 "[::1]"），Node 的 URL.hostname 同样保留，故回环名单里
     两种写法都收，避免任何一侧漏判。
   · `//localhost:8765` —— 没有 `scheme://` 前缀，Swift 的 hasScheme 判为
     false，补成 `http:////localhost:8765` 后 host 为空（→ unset）；
     这里同样把 `//` 开头的输入直接判为 unset，保证两边结论一致。 */
function hasScheme(value) {
  return /^[A-Za-z][A-Za-z0-9+.-]*:\/\//.test(value);
}

function resolveEndpointMode(raw) {
  const value = String(raw ?? '').trim();
  if (!value) return 'unset';                 // 未配置

  // 以 `//` 开头的协议相对地址：Swift 侧 hasScheme 为 false，补成
  // `http:////host` 后解析不出 host（→ unset）。这里显式对齐同一结论。
  if (value.startsWith('//')) return 'unset';

  const candidate = hasScheme(value) ? value : 'http://' + value;
  let host = '';
  try {
    host = new URL(candidate).hostname;
  } catch {
    return 'unset';                            // 无法解析，按未配置处理
  }
  if (!host) return 'unset';

  // 与 Swift 的回环名单保持一致（含带方括号的 IPv6 写法）
  const loopback = ['localhost', '127.0.0.1', '0.0.0.0', '::1', '[::1]'];
  return loopback.includes(host.toLowerCase()) ? 'loopback' : 'remote';
}

/* ═══════════════════════════════════════════════
   预览兜底数据：2026 款焕新极氪 001（真实感演示）
   仅当后端未连接时启用，不影响接真实数据后的逻辑
   ═══════════════════════════════════════════════ */
/* 演示用的「行程与能耗」统计：按「今天往前 n 天」现算日期，且数值自洽
   —— 总电耗 = 动态 + 静态，且 总÷里程 / 动态÷里程 都等于卡片上显示的均耗。 */
function mockEnergy(n) {
  const base = [24.8, 41.2, 18.6, 33.5, 12.4, 56.0, 27.3];
  const now = new Date();
  const pad = (v) => String(v).padStart(2, '0');
  const series = [];
  for (let i = n - 1; i >= 0; i -= 1) {
    const day = new Date(now.getTime() - i * 86400000);
    // 7 天沿用设计稿里的那组数；30 天用确定性伪随机，避免 7 个值循环出花纹
    const jitter = (k) => { const x = Math.sin(k * 12.9898) * 43758.5453; return x - Math.floor(x); };
    const dist = n === 30 ? +(9 + jitter(i + 1) * 47).toFixed(1) : base[(n - 1 - i) % base.length];
    series.push({
      date: `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())}`,
      distanceKm: dist,
      energyKwh: +(dist * 0.2).toFixed(2),
      minutes: Math.round(dist * 1.35),
      consumption: 20.0,
    });
  }
  const totalKm = series.reduce((a, x) => a + x.distanceKm, 0);
  const totalKwh = series.reduce((a, x) => a + x.energyKwh, 0);
  const dynamicKwh = +(totalKwh * 0.9).toFixed(2);
  return {
    days: series.length,
    startDate: series[0].date.replace(/-/g, '/'),
    endDate: series[series.length - 1].date.replace(/-/g, '/'),
    distanceKm: +totalKm.toFixed(1),
    energyKwh: +totalKwh.toFixed(2),
    dynamicEnergyKwh: dynamicKwh,
    avgConsumption: +((totalKwh / totalKm) * 100).toFixed(1),
    avgDynamicConsumption: +((dynamicKwh / totalKm) * 100).toFixed(1),
    fastChargeCount: Math.max(1, Math.round(n / 5)),
    slowChargeCount: 0,
    series,
  };
}

/* ── 演示用的充电流水（10 个月）──

   演示数据如果编出金额，接上真后端后用户会以为"功能丢了"。
   数值是确定性的（不随机），这样每次打开同一月份的图都一样，便于对照样式。
