# XcodeGen 工程描述文件
#
# 用途：从纯文本生成 .xcodeproj，避免手写 pbxproj。
#
# 使用方式：
#   1. 安装 XcodeGen： brew install xcodegen
#   2. 在项目根目录执行： xcodegen generate
#   3. 打开生成的 ZeekrDash.xcodeproj
#
# 如果你不想装 XcodeGen，也可以直接在 Xcode 里新建一个 iOS App 工程，
# 然后把 ZeekrDash/ 目录下的所有 .swift 拖进去（勾选 Copy items if needed）。

name: ZeekrDash
options:
  bundleIdPrefix: com.zeekrdash
  deploymentTarget:
    # iOS 26.0 —— 使用原生 Liquid Glass API（.glassEffect / GlassEffectContainer）
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # 这里是**语言模式**，不是编译器版本：合法值是 4 / 4.2 / 5.0 / 6.0。
    # 写 "5.9" 会让 swiftc 直接报 "SWIFT_VERSION '5.9' is unsupported"，整个 target 编不过。
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # 填入你的 Apple ID Team ID（自签用）
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  ZeekrDash:
    type: application
    platform: iOS
    sources:
      - path: ZeekrDash
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeekrdash.app
        PRODUCT_NAME: ZeekrDash
        INFOPLIST_KEY_CFBundleDisplayName: 极氪看板
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 允许访问本地网络的明文 HTTP（连接自有 Python 服务）
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        # WKWebView 里的内容有独立的 ATS 开关：只放开 web content 的 http，
        # 不用 NSAllowsArbitraryLoads（那会连带放开 URLSession，与既有安全口径冲突）
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsInWebContent: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于连接您本机的 ZeekrDash 数据服务，读取车辆状态与充电记录
        # 查找附近充电站时需要一次定位；位置只用于本次查询，不上传、不留存
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于查找附近的充电站（位置仅用于本次查询，不会上传）
        # WebView 版界面里选充电小票截图走的是 <input type=file>，缺这句会闪退
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于从相册选择充电小票截图，识别充电金额与电量
        INFOPLIST_KEY_NSCameraUsageDescription: 用于直接拍摄充电小票，识别充电金额与电量
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"   # 仅 iPhone
